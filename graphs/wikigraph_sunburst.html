\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- Size: Small\u003cbr\u003e\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 4 (-3)\u003cbr\u003eDexterity (DEX) | 16 (+3)\u003cbr\u003eConstitution (CON) | 12 (+1)\u003cbr\u003eWisdom(WIS) | 10(+0)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003e\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMovement:\u003cbr\u003e\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth ...","","","Collectionfile \u003cbr\u003eAvatar Spirit Check\u003cbr\u003e\ud83c\udf0c Bridge of the Spirit: A Personal Journey\u003cbr\u003e\u003cbr\u003e\u003e \"To be the Avatar is not merely to bend all elements, but to bend one\u2019s self\u2014to align will and wisdom with the needs of the world.\"  \u003cbr\u003e\u003e \u2014 Grandmaster Shuyin of the White Lotus\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udded Reflecting on Your Journey\u003cbr\u003e\u003cbr\u003eEach character stands at a crossroads between spirit and self, and your progression in this campaign is deeply rooted in how your character emotionally and spiritually reacts to the events that unfold. Reflect on:\u003cbr\u003e\u003cbr\u003e- Have recent events hardened them? Are they acting with more recklessness, cruelty, or obsession to achieve their goals\u2014driven by trauma or ambition?\u003cbr\u003e    \u003cbr\u003e- Or have they found inner balance, perhaps discovering a renewed sense of duty or compassion, and beginning to understand the role of a bridge between the mortal and spiritual worlds?\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThis reflection influences your na and will guide what type of power you unlock next.\u003cbr\u003e\u003c...","Avatar Spirit Check\u003cbr\u003e\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003e\u003cbr\u003eRules & limits (assumptions \u2014 adjust with GM):\u003cbr\u003e\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending ...","Collectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003e\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003e\u003cbr\u003eCore contract:\u003cbr\u003e\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003e\u003cbr\u003eSample Moves\u003cbr\u003e\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's natu...","Collectionfile\u003cbr\u003e\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003e\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003e\u003cbr\u003eWhen to use:\u003cbr\u003e\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003e\u003cbr\u003eRisks:\u003cbr\u003e\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003e\u003cbr\u003eQuick references:\u003cbr\u003e\u003cbr\u003e- Moves and examples: Spiritbendin...","","10 + Strength + Proficiency","Earthbending Moves Progression Table\u003cbr\u003e\u003cbr\u003eLevel | Accessible Slots | Total Moves (Newly Learned)\u003cbr\u003e1 | Level 1 | 1 Slot from Level 1\u003cbr\u003e2 | Level 1 | 2 Slots from Level 1\u003cbr\u003e3 | Level 1, Level 2 | 4 Slots (3 from Level 1, 1 from Level 2)\u003cbr\u003e4 | Level 1, Level 2 | 6 Slots (4 from Level 1, 2 from Level 2)\u003cbr\u003e5 | Level 1, Level 2, Level 3 | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)\u003cbr\u003e6 | Level 1, Level 2, Level 3 | 12 Slots (6 from Level 1, 4 from Level 2, 2 from Level 3)\u003cbr\u003e7 | Level 1, Level 2, Level 3, Level 4 | 16 Slots (7 from Level 1, 5 from Level 2, 3 from Level 3, 1 from Level 4)\u003cbr\u003e8 | Level 1, Level 2, Level 3, Level 4 | 20 Slots (8 from Level 1, 6 from Level 2, 4 from Level 3, 2 from Level 4)\u003cbr\u003e9 | Level 1, Level 2, Level 3, Level 4, Level 5 | 25 Slots (9 from Level 1, 7 from Level 2, 5 from Level 3, 3 from Level 4, 1 from Level 5)\u003cbr\u003e10 | Level 1, Level 2, Level 3, Level 4, Level 5 | 30 Slots (10 from Level 1, 8 from Level 2, 6 from Level 3, 4 from Level 4,...","Overview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.","Earthbending rules\u003cbr\u003eEarthbending Slot\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending","","Core Attributes of Firebending\u003cbr\u003efirebending #coreattributes\u003cbr\u003e\u003cbr\u003e- Primary Stat: Wisdom\u003cbr\u003e  - Firebenders rely on their inner focus, discipline, and clarity to control their flames.\u003cbr\u003e\u003cbr\u003e- Key Mechanic: Lingering Damage\u003cbr\u003e  - Firebenders create residual damage zones where their fire strikes, representing burning or smoldering terrain.\u003cbr\u003e\u003cbr\u003e- Stress Level: Firebenders gain a stress level counter, starting at 0. Stress increases by 1 each time the firebender is hit by an attack. For every Stress Level the Firebender suffers -1 to attack and damage Rolls. At high levels, stress can be managed or turned into a weapon.\u003cbr\u003eFirebending","10 + Wisdom + Proficiency\u003cbr\u003eFirebending","Firebending Slots Progression Table\u003cbr\u003e\u003cbr\u003eLevel | Accessible Slots | Total Moves (Newly Learned)\u003cbr\u003e1 | Level 1 | 1 Slot from Level 1\u003cbr\u003e2 | Level 1 | 2 Slots from Level 1\u003cbr\u003e3 | Level 1, Level 2 | 4 Slots (3 from Level 1, 1 from Level 2)\u003cbr\u003e4 | Level 1, Level 2 | 6 Slots (4 from Level 1, 2 from Level 2)\u003cbr\u003e5 | Level 1, Level 2, Level 3 | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)\u003cbr\u003e6 | Level 1, Level 2, Level 3 | 12 Slots (6 from Level 1, 4 from Level 2, 2 from Level 3)\u003cbr\u003e7 | Level 1, Level 2, Level 3, Level 4 | 16 Slots (7 from Level 1, 5 from Level 2, 3 from Level 3, 1 from Level 4)\u003cbr\u003e8 | Level 1, Level 2, Level 3, Level 4 | 20 Slots (8 from Level 1, 6 from Level 2, 4 from Level 3, 2 from Level 4)\u003cbr\u003e9 | Level 1, Level 2, Level 3, Level 4, Level 5 | 25 Slots (9 from Level 1, 7 from Level 2, 5 from Level 3, 3 from Level 4, 1 from Level 5)\u003cbr\u003e10 | Level 1, Level 2, Level 3, Level 4, Level 5 | 30 Slots (10 from Level 1, 8 from Level 2, 6 from Level 3, 4 from Level 4, ...","- Stress Level: Firebenders gain a stress level counter, starting at 0. Stress increases by 1 each time the firebender is hit by an attack. For every Stress Level the Firebender suffers -1 to attack Rolls but +1 to any damage. At high levels, stress can be managed or turned into a weapon. At the End of each of your Turn you can roll a Wisdom DC 20 - Stress Level. If successful the Stresslevel goes Down by 1. \u003cbr\u003eFirebending","Stress Management Moves\u003cbr\u003efirebending #stressmanagement\u003cbr\u003e\u003cbr\u003e- Level 1: Cool Down\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Reduce stress points by 2.\u003cbr\u003e  - Focus your inner fire to calm your mind and regain clarity.\u003cbr\u003e\u003cbr\u003e- Level 3: Rage Fuel (Secret Technique)\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Transform your stress penalty into a bonus. For every stress point, gain a +1 to accuracy and damage rolls for the duration. At the end of the effect, stress resets to 0.\u003cbr\u003e  - Unleash the power of your rage, turning your inner turmoil into devastating strength.\u003cbr\u003eFirebending","","","Collectionfile \u003cbr\u003eIf Concentration is not broken the Water Charges are refunded.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Cyclic Flow --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 graphs\u003cbr\u003e      \u2514\u2500\u2500 wikigraphtreemap.html\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u251c\u2500\u2500 Water Charges.md\u003cbr\u003e                  \u2514\u2500\u2500 Waterbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Healing Water.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 3 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Healing Mist.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","Water Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003eWaterbottle Water Charges \u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e    The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water.:\u003cbr\u003e    \u003cbr\u003e    - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e    - Humid Area: 5-10 Water Charges.\u003cbr\u003e    - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e    - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\t    \u003cbr\u003e- Restoring Water Charges:\u003cbr\u003e    \u003cbr\u003e    - Skill Checks: A waterbender can perform a skill check to draw water from their surroundings DC is determined by how dry the area is. Success restores Water Charges, depending on the environment.\u003cbr\u003e    - Abilities: Certain abilities allow Water Charges recovery or Cyclic Flow.\u003cbr\u003e    \u003cbr\u003eWaterbending","10 + Int + Proficiency\u003cbr\u003eWaterbending","Your Waterbending Level.\u003cbr\u003eWaterbending","Overview:\u003cbr\u003e\u003cbr\u003eWaterbenders are versatile combatants who manipulate water, ice, and mist with fluid, adaptive techniques. Unlike other benders, they rely on a resource called Water Charges to perform bending abilities. Their style focuses on redirection, control, and adaptability, drawing power from their environment.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCore Mechanics:\u003cbr\u003e\u003cbr\u003e1. Redirection Mechanic:\u003cbr\u003e\u003cbr\u003eWaterbenders excel at using their enemies\u2019 attacks against them. This mechanic reflects their unique style.\u003cbr\u003e\u003cbr\u003eAs a Reaction when hit by ranged physical attack.\u003cbr\u003e- Counter-Redirect physical:\u003cbr\u003e    - Cost: 1 Water Charge per 1d10 Damage redirected.\u003cbr\u003e    - When targeted by a ranged physical attack, the Waterbender can redirect it back to the attacker or a different target. This attack has the same range as the initial attack. If you reduce the damage you take to 0 you get back all used Watercharges.\u003cbr\u003e    - Redirected attacks deal half damage.\u003cbr\u003e\u003cbr\u003eAs a Reaction when hit by a physical mel...","How efficiently you use your Waterbottle  that you can carry with you.\u003cbr\u003e\u003cbr\u003eWaterbending Level | Waterbottle Water Charges\u003cbr\u003e1-4 | 1\u003cbr\u003e5-8 | 2\u003cbr\u003e9-12 | 3\u003cbr\u003e13-16 | 4\u003cbr\u003e17-20 | 5\u003cbr\u003e\u003cbr\u003eWaterbending","","Chi Blocking Rules\u003cbr\u003e\u003cbr\u003eChi Blocking is a specialized combat style that relies on targeting an opponent's pressure points to immobilize them or impede their bending abilities. \u003cbr\u003eChi Blockers are adept at neutralizing threats without requiring bending.\u003cbr\u003e\u003cbr\u003eCore Features\u003cbr\u003e- Pressure Point Strikes: Disable bending or other abilities temporarily.\u003cbr\u003e- Energy Points: Manage energy to execute powerful moves.\u003cbr\u003e- Evasion and Defense: Increased agility and defensive techniques.","","The creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action or can remove it with your bending more efficiently.","Paralysis Mechanics\u003cbr\u003e\u003cbr\u003eCertain Chi Blocking moves cause paralysis, preventing the target from taking actions or bending for a specified duration.\u003cbr\u003e\u003cbr\u003eKey Moves\u003cbr\u003e- Pressure Point Strike\u003cbr\u003e- Nerve Strike","A slowed creatures Movement Speed is halved and it can not use any #Bonusactions or #reactions. ( #Action is allowed)","","","Grants Damage reduction. \u003cbr\u003e\u003cbr\u003eGeneral Armor reduces all Damage Types in addition to their specific type Armor (other than spiritual). \u003cbr\u003e\u003cbr\u003ePhysical Armor reduces all Piercing Slashing and bludgeoning Damage.\u003cbr\u003e\u003cbr\u003eBarrier Armor Whenever you suffer unblocked damage Barrier Armor halves","Barrier Armor Whenever you suffer unblocked damage Barrier Armor halves (rounded down)\u003cbr\u003eFor example when you have 15 Barrier Armor and suffer 18 damage you suffer 3 Damage and Barrier Armour halves to 7.","Collectionfile \u003cbr\u003e\u003cbr\u003eCharacter Level. This will be important to scale moves.\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:CL --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u2514\u2500\u2500 Mahogany\u003cbr\u003e              \u2514\u2500\u2500 Transformation Points.md\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u251c\u2500\u2500 Bending Rules\u003cbr\u003e              \u251c\u2500\u2500 Air\u003cbr\u003e                  \u2514\u2500\u2500 Airbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 Level 3 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Hovering Hands.md\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u2514\u2500\u2500 Waterbending Moves\u003cbr\u003e                      \u2514\u2500\u2500 Level 2 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Ice Daggers.md\u003cbr\u003e          \u251c\u2500\u2500 core rules\u003cbr\u003e              \u2514\u2500\u2500 Stat Shorts\u003cbr\u003e                  \u251c\u2500\u2500 Max Hitpoints.md\u003cbr\u003e                  \u2514\u2500\u2500 Proficiency.md\u003cbr\u003e          \u2514\u2500\u2500 Non Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Chi Blocking\u003cbr\u003e                  \u2514\u2500\u2500 Chi Blocking Mechanics\u003cbr\u003e                      \u2514\u2500\u2500 EP.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","Charisma","","","Reduces All l 1, Level 2, Level 3, Level 4, Level 5 | 30 Slots (10 from Level 1, 8 from Level 2, 6 from Level 3, 4 from Level 4, 2...","Move or disperse most Lingering Damage effects\u003cbr\u003eAirbending","Movement \u003cbr\u003e\u003cbr\u003eMany Airbending techniques can boost movement\u003cbr\u003eAirbending","","Avatar Spirit Check.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpiritbending.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Spiritbending.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Avatar Spirit Check.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpiritbending Moves.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Collectionfile\u003cbr\u003e\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003e\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003e\u003cbr\u003eWhen to use:\u003cbr\u003e\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003e\u003cbr\u003eRisks:\u003cbr\u003e\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003e\u003cbr\u003eQuick references:\u003cbr\u003e\u003cbr\u003e- Moves and examples: Spiritbendin...","","","Glassfruit Team-Up Techniques \u003cbr\u003e\u003cbr\u003eX = yz\u003cbr\u003e\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e \u003cbr\u003e\u003e - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e\u003e     \u003cbr\u003e\u003e - Firebender contributes 3 (z = 3)\u003cbr\u003e\u003e     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd34 Inferno Bloom (Red Flamegrape)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e A cluster of buried Flame-glass shards detonates in a chain Reaction.\u003cbr\u003e\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e- Radius: 2  meter  X\u003cbr\u003e    \u003cbr\u003e- Lingering Effect\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udca8Resonant Collapse (Blue Soundbanana)\u003cbr\u003eMust be initiated by a Airbender in line of sight ...","\ud83c\udf47 Origin: \u003cbr\u003e\u003cbr\u003eHigh on the outer cliffs of Omashu and the surrounding valley grow the rare Glassfruit Trees\u2014bizarre plants that draw heavy mineral content from the stone and soil, producing glass-like fruit with dense crystalline seeds. These seeds:\u003cbr\u003e\u003cbr\u003e- Grow in five known varieties, each with distinct elemental-reactive properties.\u003cbr\u003e    \u003cbr\u003e- Can be manipulated by Earthbenders with precise control, refined through spiritual discipline.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLocal legend says the Earth Lion Turtle left these trees here, believing their presence would help the people grow with stone, not just build from it.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ePracticed by: Earthbenders of Omashu, the secretive Order of the Glassfruit  \u003cbr\u003eCore Techniques:\u003cbr\u003e\u003cbr\u003eGlassbenders use Glassfruit Seeds as the basis of their fighting and crafting style. Unlike traditional Earthbending, this form is:\u003cbr\u003e\u003cbr\u003e- Finer, with smaller, more precise motions than usual Earthbending .\u003cbr\u003e    \u003cbr\u003e- Often done with bare hands or finger mo...","","","","","Agni Kai Style\u003cbr\u003efirebending #style #agnikai\u003cbr\u003e\u003cbr\u003e- Duels emphasize precision and dominance.\u003cbr\u003e- Move: Burning Duel\u003cbr\u003e  - Action: Choose a single target and engage them in a duel. Both you and the target gain +2 to attack rolls against each other until one is incapacitated.\u003cbr\u003e  - Lingering Effect: The ground around you is superheated; creatures entering the area take 1d6 fire damage.\u003cbr\u003eFirebending","Classic Firebending\u003cbr\u003efirebending #style #classic\u003cbr\u003e\u003cbr\u003e- Focuses on powerful, straightforward attacks.\u003cbr\u003e- Move: Flame Jet\u003cbr\u003eFirebending","Dancing Dragon Style\u003cbr\u003efirebending #style #dancingdragon\u003cbr\u003e\u003cbr\u003e- Focuses on fluid, continuous motion.\u003cbr\u003e- Move: Spiral Flames\u003cbr\u003e  - Action: Spin and release flames in a 360-degree arc. Creatures within 10 feet must make a Dexterity saving throw or take 2d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area smolders, imposing disadvantage on Dexterity saving throws for creatures within it until the start of your next turn.\u003cbr\u003eFirebending","Explosive Firebending\u003cbr\u003efirebending #style #explosive\u003cbr\u003e\u003cbr\u003e- Focuses on powerful area-of-effect attacks.\u003cbr\u003e- Move: Fireburst\u003cbr\u003e  - Action: Target a point within 30 feet. All creatures in a 10-foot radius must make a Dexterity saving throw or take 3d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area burns for 2 rounds, dealing 1d4 fire damage to creatures starting their turn there.\u003cbr\u003eFirebending","Lightning Generation\u003cbr\u003efirebending #style #lightning\u003cbr\u003e\u003cbr\u003e- Rare skill requiring intense focus.\u003cbr\u003e- Move: Lightning Strike\u003cbr\u003e  - Action: Spend 2 turns charging and unleash a precise bolt of lightning. One target within 60 feet must make a Constitution saving throw or take 4d10 lightning damage. On a successful save, they take half damage.\u003cbr\u003e  - Lingering Effect: None, but the charge must be used within the next turn.\u003cbr\u003eFirebending","","You may use Levels from Air and Earth .\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  Y(Earth): Yd12 Damage per projectile\u003cbr\u003e- X(Air): X Sand Projectiles\u003cbr\u003e\u003cbr\u003e- Z(Earth  Air): Z  5 meter Cone Range\u003cbr\u003e \u003cbr\u003e- One Earthbender shoots Y Sand Projectiles (rolls the Damage roll) and the Airbender controlls them to home to the X Targets)\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eTeam-up Moves","","Action\u003cbr\u003eLevel 3\u003cbr\u003e\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending","","You may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X number of projectiles \u003cbr\u003e-  Y: Yd6 Damage per projectile\u003cbr\u003e \u003cbr\u003e- One waterbender shoots X Water Projectiles (rolls the attack role) and the other one Freezes them  rolls the damage rolls)\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves","Must be initiated by at least two Waterbenders.  \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X  10 Barrier Armor \u003cbr\u003e-  Y: Y  5 Healing at the start of their turn\u003cbr\u003e\u003cbr\u003e- Encase a willing ally in a jagged prism of glacial ice with a liquid healing core.\u003cbr\u003e    \u003cbr\u003e- The ally immediately gains the effects of Barrier Armor\u003cbr\u003e    \u003cbr\u003e- At the start of their next turn, as the ice thaws, they are healed for 2 \u00d7 Y but their movement is halved.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003cbr\u003eHealing","","wikigraphtreemap.html\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWater Charges.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eHealing Water.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eHealing Mist.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","wikigraphtreemap.html\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWater Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003eWaterbottle Water Charges \u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e    The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water.:\u003cbr\u003e    \u003cbr\u003e    - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e    - Humid Area: 5-10 Water Charges.\u003cbr\u003e    - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e    - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\t    \u003cbr\u003e- Restoring Water Charges:\u003cbr\u003e    \u003cbr\u003e    - Skill Checks: A waterbender can perform a skill check to draw water from their surroundings DC is determined by how dry the area is. Success restores Water Charges, depending on the environment.\u003cbr\u003e    - Abilities: Certain abilities allow Water Charges recovery or Cyclic Flow.\u003cbr\u003e    \u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCyclic Flow...","","","Defensive Techniques\u003cbr\u003e\u003cbr\u003eChi Blockers excel at evading and mitigating damage through agility and strategic positioning.\u003cbr\u003e\u003cbr\u003eTechniques\u003cbr\u003e- Enhanced Reflexes: Gain temporary bonuses to evasion.\u003cbr\u003e- Counterattack: Strike back immediately after dodging.","Energy Points\u003cbr\u003e\u003cbr\u003eChi Blockers use Energy Points (EP) to perform their moves. EP are a finite resource that replenishes during rests or by using specific techniques. \u003cbr\u003e\u003cbr\u003eManaging EP\u003cbr\u003e- Base EP: 2CL\u003cbr\u003e- Replenish: Gain 2 EP at the End of your turn if not using any EP this Turn.","","Chi Blocking Moves\u003cbr\u003e\u003cbr\u003eChi Blockers have a range of moves categorized by levels, growing more potent as they develop their skills.\u003cbr\u003e\u003cbr\u003eMove Levels\u003cbr\u003e- Level 1: Basic disruption techniques.\u003cbr\u003e- Level 2: Advanced strikes with added effects.\u003cbr\u003e- Level 3: High-impact moves that exhaust opponents.","","Transformation Points.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eHovering Hands.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eIce Daggers.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMax Hitpoints.md\u003cbr\u003e
