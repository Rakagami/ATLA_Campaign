        <script charset="utf-8" src="https://cdn.plot.ly/plotly-2.32.0.min.js"></script>                <div id="75d5f858-0094-424c-a5cb-ca5680dca106" class="plotly-graph-div" style="height:100%; width:100%;"></div>            <script type="text/javascript">                                    window.PLOTLYENV=window.PLOTLYENV || {};                                    if (document.getElementById("75d5f858-0094-424c-a5cb-ca5680dca106")) {                    Plotly.newPlot(                        "75d5f858-0094-424c-a5cb-ca5680dca106",                        [{"branchvalues":"total","hovertemplate":"%{label}\u003cbr\u003e%{hovertext}\u003cextra\u003e\u003c\u002fextra\u003e","hovertext":["Collectionfile \u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Collectionfile --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","\ud83d\ude80 How to Set Up\u003cbr\u003e\u003cbr\u003e1. Clone or Download the Repository\u003cbr\u003e    \u003cbr\u003e    git clone \u003crepo-url\u003e\u003cbr\u003e    \u003cbr\u003e    Or download as ZIP and extract.\u003cbr\u003e    \u003cbr\u003e2. Open as an Obsidian Vault\u003cbr\u003e    \u003cbr\u003e    - Start Obsidian.\u003cbr\u003e        \u003cbr\u003e    - Select \"Open folder as vault\".\u003cbr\u003e        \u003cbr\u003e    - Navigate to the downloaded repository and open it.\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e\ud83d\udc49 This gives you the best file explorer experience and lets you use all notes, links, and structures directly.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eGit Plugin\u003cbr\u003e\u003cbr\u003eStep 1 \u2014 Install Git\u003cbr\u003e\u003cbr\u003eDownload and install Git: https:\u002f\u002fgit-scm.com\u002fdownloads\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStep 2 \u2014 Generate a Personal Access Token\u003cbr\u003e\u003cbr\u003eIn GitHub (requires an account):\u003cbr\u003e\u003cbr\u003e- Go to Settings \u2192 Developer settings \u2192 Personal access tokens \u2192 Tokens (classic).\u003cbr\u003e    \u003cbr\u003e- Click \u201cGenerate new token\u201d.\u003cbr\u003e    \u003cbr\u003e- Set:\u003cbr\u003e    \u003cbr\u003e    - Scopes: Select repo.\u003cbr\u003e        \u003cbr\u003e    - Expiration: Choose no expiration (recommended for backups).\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStep 3 \u2014 Inst...","\ud83d\udd04 How to Sync Your Vault (Git + Collectionfiles)\u003cbr\u003e\u003cbr\u003eTo sync your local vault with the remote repository and automatically update all collectionfiles (backlink blocks):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython -c \"from WikiFileSystemManager import Sync; Sync()\"\u003cbr\u003e\u003cbr\u003eTo manually recreate all collectionfiles (backlink blocks) without syncing:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --recreate-collectionfiles\u003cbr\u003e\u003cbr\u003eThis will:\u003cbr\u003e\u003cbr\u003e- Stage, commit, and push all local changes\u003cbr\u003e- Pull and merge the latest from origin\u002fmain\u003cbr\u003e- Recreate all collectionfiles (backlink blocks)\u003cbr\u003e- Commit and push any new collectionfile changes\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\ude80 Quickstart\u003cbr\u003e\u003cbr\u003eCopy-paste friendly commands. See also: WikiFileSystemManager (Manual), WikiFileSystemManager (FAQ)\u003cbr\u003e\u003cbr\u003e\u003e Tips: Start with --dry-run, scope with --ext .md, keep backups with --backup .bak.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSafe wiki-link bracketing\u003cbr\u003e\u003cbr\u003eBracket plain mentions, skipping already-linked:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystem...","","","","","","","","","Obsidian Plugins Setup for Developers & Data Scientists\u003cbr\u003e\u003cbr\u003eThis guide covers the installation and basic setup of the best Obsidian plugins for code, data workflows, dashboards, and research.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e1. Install Plugins\u003cbr\u003e1. Open Settings \u2192 Community Plugins.\u003cbr\u003e2. Enable Safe Mode if it's disabled.\u003cbr\u003e3. Click Browse.\u003cbr\u003e4. Search and install the following plugins:\u003cbr\u003e   - Dataview\u003cbr\u003e   - Templater\u003cbr\u003e   - QuickAdd\u003cbr\u003e   - RunJS\u003cbr\u003e   - Note Toolbar\u003cbr\u003e   - Better Search Views\u003cbr\u003e   - Obsidian Tags Overview\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e2. Plugin Configuration\u003cbr\u003e\u003cbr\u003eDataview\u003cbr\u003e- Go to Settings \u2192 Dataview.\u003cbr\u003e- Enable JavaScript Queries for dynamic calculations.\u003cbr\u003e- Example query to list all datasets:\u003cbr\u003e    dataview\u003cbr\u003e    TABLE file.name, size, date\u003cbr\u003e    FROM \"datasets\"\u003cbr\u003e    SORT date DESC\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTemplater\u003cbr\u003e- Set Template Folder Location: templates\u002f\u003cbr\u003e- Create a file dataset-template.md:\u003cbr\u003e    markdown\u003cbr\u003e{{title}}\u003cbr\u003e    Date: \u003c% tp.date.now(\"YYYY-MM-...","","","https:\u002f\u002favatar.fandom.com\u002fwiki\u002fHistoryoftheWorldofAvatar#Eranames","","Spiritbending Moves.md\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","\u003c!-- No backlinks found --\u003e","\u003c!-- No backlinks found --\u003e","","","Type: Air Nomad Offshoot  \u003cbr\u003eLocation: Cliffside plateaus bordering the Great Si Wong Desert  \u003cbr\u003eRole: High-speed messengers, scouts, and storm-chasers of the desert  \u003cbr\u003eSpecialized Style: Thermal Riding\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eThe Crimson Sails are a unique, nomadic sect of Air Nomads adapted to life on the edge of the Si Wong Desert. They do not dwell in temples or static sanctuaries, but aboard elegant skiffs and gliders designed to harness the fierce thermal currents that rise from the sun-scorched sand. Painted in brilliant reds and ochres, their vessels shimmer like embers in the sky.\u003cbr\u003e\u003cbr\u003eBound by the winds and the rhythms of the desert heat, the Crimson Sails are expert couriers, capable of crossing vast expanses far faster than beasts or traditional caravans. However, their airbending is heavily dependent on the desert\u2019s thermal conditions; at night, without the rising heat, they become grounded or slow-moving.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e\u003cbr\u003e- Daybound Nomadis...","Collectionfile\u003cbr\u003eCollectionfile\u003cbr\u003e\u003cbr\u003e\u003e Note: Incensebending is understood as a hybrid craft combining multiple bending styles. Water and earth are used to grow and prepare the organic materials; fire dries and activates them for burning; and the resulting smoke carries a blend of those influences (often shaped further by air or spirit-affiliated bending). Many incense rituals therefore require cooperative inputs from different benders and are rich in mixed-element effects.\u003cbr\u003e\u003cbr\u003eIncencebending Team-Up Techniques\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003eX = y\\z\u003cbr\u003e\u003cbr\u003e- are the number of bending \u002f ritual slots contributed by each participant.\u003cbr\u003e- This encourages coordinated, complementary rituals rather than one person carrying the whole effect.\u003cbr\u003e- X = y \u00d7 z.\u003cbr\u003e\u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e\u003cbr\u003e\u003e - Spirit-bender contributes 2 slots (y = 2)\u003cbr\u003e\u003e - Airbender contributes 3 (z = 3)\u003cbr\u003e\u003e   \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese incense rituals are subtle but potent \u2014 they alter minds, environments, and the thin ...","Location and Culture:\u003cbr\u003e\u003cbr\u003eNestled at the edge of the Si Wong Desert\u2019s shifting dunes, the Village of Mahzeen stands as a rare bastion of life in the arid wilderness. The settlement lies just a half-day\u2019s journey from an ancient Earthbending Temple, its sandstone spires visible on the distant horizon. Though not large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand.\u003cbr\u003e\u003cbr\u003eThe villagers live in dome-shaped tents woven from desert fibers, arranged around a central oasis fed by a hidden spring. Worn banners and intricate stone carvings display their heritage: guardians of the desert\u2019s secrets, proud custodians of a bending style that focuses on defense, endurance, and cunning ambush tactics. These Sandbenders follow a strict code of balance, taught to them by the temple monks long ago.\u003cbr\u003e\u003cbr\u003eThe Sandbending Technique: \u201cSpiked Sand Sphere\u201d\u003cbr\u003e\u003cbr\u003eThe hallmark ability of Mahzeen\u2019s Sandbenders is...","","DMPCs\u003cbr\u003eLotus\u003cbr\u003eNight Bloom","","","","- Session 1 The Spirit Within\u003cbr\u003e- The Lotus Fractures\u003cbr\u003e- Building Alliances\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Session 1 The Spirit Within","- The Spirit Gauge\u2019s Purpose\u003cbr\u003e- Betrayals and Deceptions\u003cbr\u003e- The Shadowed Spirits","- The Avatar\u2019s Legacy\u003cbr\u003e- The Final Confrontation\u003cbr\u003e- The Avatar Reborn\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","Title: Shattered Spirit, Rising Lotus\u003cbr\u003e\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- The Lotus\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","The Lotus\u003cbr\u003e\u003cbr\u003e- Home of the ceremony and spiritual hub.\u003cbr\u003e\u003cbr\u003eCeremony of the Resonance\u003cbr\u003e\u003cbr\u003e- Celebration of unity, balance, and bending mastery.\u003cbr\u003e\u003cbr\u003eNight Bloom\u003cbr\u003e\u003cbr\u003e- Radical faction opposing the Avatar\u2019s central role.\u003cbr\u003e\u003cbr\u003eResonance Jade\u003cbr\u003e\u003cbr\u003e- Artifact measuring spiritual energy.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","Act 1: Unveiling the Threat\u003cbr\u003e\u003cbr\u003e- PCs discover they hold fragmented aspects of the Avatar Spirit.\u003cbr\u003e- Internal conflict: heightened bending abilities without unity.\u003cbr\u003e- Night Bloom\u2019s origins tied to a Lotus Fracture.\u003cbr\u003e\u003cbr\u003eAct 2: The Rise of the Night Bloom\u003cbr\u003e\u003cbr\u003e- Spirit Gauge\u2019s potential to destabilize balance.\u003cbr\u003e- Betrayals within the White Lotus.\u003cbr\u003e- Growing attacks from corrupted spirits.\u003cbr\u003e\u003cbr\u003eAct 3: The Broken Avatar\u003cbr\u003e\u003cbr\u003e- Truth of the Avatar\u2019s death and shattered spirit.\u003cbr\u003e- Final confrontation: Combine spirits to reform Avatar or share the essence among the group.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","1. Balance vs. Independence:  \u003cbr\u003e    Explores centralized power vs. collective leadership.\u003cbr\u003e    \u003cbr\u003e2. Personal Growth:  \u003cbr\u003e    Each PC\u2019s arc reflects their fragment of the Avatar Spirit.\u003cbr\u003e    \u003cbr\u003e3. Moral Dilemmas:  \u003cbr\u003e    The Night Bloom\u2019s ideals resonate with many; their morality isn\u2019t black and white.\u003cbr\u003e    \u003cbr\u003e4. Worldbuilding:  \u003cbr\u003e    Encourage player input for designing clans, bending styles, and spiritual entities.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","Scene Setting:\u003cbr\u003e\u003cbr\u003eThe campaign begins at the serene Temple of the The Lotus, where benders from across the world gather for the annual Ceremony of the Lotus.\u003cbr\u003e\u003cbr\u003e- PCs arrive as prodigies of their respective arts.\u003cbr\u003e- Subtle unease: elders whisper of spiritual disturbances.\u003cbr\u003e- PCs feel a fleeting resonance, but there\u2019s no spiritual response\u2014an ill omen.\u003cbr\u003e\u003cbr\u003eThe Attack on the Ceremony:\u003cbr\u003e\u003cbr\u003e- Smokebomb and the Voice:  \u003cbr\u003e    A black mist explosion (orchestrated by Isai Trekal) disrupts the ceremony.  \u003cbr\u003e    Voice: \u201cThe age of bending submission is over...\u201d\u003cbr\u003e    \u003cbr\u003e- Artifact Theft:  \u003cbr\u003e    The Order of the Night Bloom steals the Resonance Jade.\u003cbr\u003e    \u003cbr\u003e- Rogue Spirit Attack:  \u003cbr\u003e    PCs fend off a corrupted spirit, feeling faint resonance from the ritual during combat.\u003cbr\u003e    \u003cbr\u003e- Aftermath:  \u003cbr\u003e    The artifact is gone, and the PCs are tasked with investigating the theft.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom","Story\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Act 2 The Rise of the Night Bloom\u003cbr\u003e- Campaign Overview\u003cbr\u003e- Act 1 Unveiling the Threat\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Key Groups and Concepts\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Session 1 The Spirit Within\u003cbr\u003e- Act 3 The Broken Avatar\u003cbr\u003e- Modules\u003cbr\u003e- \u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","","","","Organisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Lotus is a venerable organization dedicated to the balance of the world, acting as spiritual guides and protectors of harmony. They host the annual Ceremony of the Resonance, symbolizing their commitment to unity among benders.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003cbr\u003e\u003cbr\u003e- Colors:  \u003cbr\u003e    White and gold, symbolizing purity and enlightenment, with accents of light blue to represent spiritual connection.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Flowing robes for spiritual leaders, with a lotus emblem embroidered on the chest.\u003cbr\u003e    - Soldiers wear sturdy uniforms with plated armor on shoulders and bracers, designed for mobility and defense.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - A sash or belt with a lotus motif, denoting rank.\u003cbr\u003e    - Masks for combat troops, styled after serene and neutral faces, emphasizing their role as impartial protectors.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Armor\u003cbr\u003e- Strength\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Wisdom\u003cbr\u003e- Grandmaster I...","","Marjorie TBA","","\u00a71 This is all fun and games.\u003cbr\u003e\t\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs. \u003cbr\u003e\tSome people like the Characterbuilding and creating a personality and fleshed out character how they imagine it. Both are valid but it needs to be communicated that i want to keep it generally in a very \"yes and...\" kind of style but always accept a \"no id rather have it like...\".\u003cbr\u003e\t\t1.1.1 That being said this also applies to world building and lore so feel free to worldbuild yourself a bit either spontanously during roleplay or planned out for bigger worldbuilding projects (e.g. \"I had an idea for a watertribe that uses plantbending algae as boats for their lake\"(and discussed with the GM)).\u003cbr\u003e\u003cbr\u003e\u00a72 I will try my best to nerve and buff bending moves how i think fits best. \u003cbr\u003e\t2.1 This may also include giving them more roleplaying opportunities to find bending teachers or similar to acquire new skills and bending Moves.\u003cbr\u003e\u003cbr\u003e\u00a73 ...","Defensive:\u003cbr\u003e\tMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\u003cbr\u003e\tThe Damage types will be the same as in Dnd\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor","How hard it is to hit you. \u003cbr\u003eBase Evasion: 10 + Dex","Collectionfile \u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConditions to Join:\u003cbr\u003e\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an...","","Glacial Temple\u003cbr\u003e\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground  \u003cbr\u003eArchitecture: A glimmering structure partially embedded in ice, with prayer flags fluttering around open, steam-warmed courtyards.\u003cbr\u003e\u003cbr\u003eLore:  \u003cbr\u003eBuilt above the Healing Spring of Akara, the Glacial Temple is both a spiritual hub and defensive bastion. It\u2019s home to the Order of the Veiled Mist, a sect of waterbenders trained in Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fCantrips\u002fMistbending \u2014 a sacred technique taught only to those deemed spiritually attuned by the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eAccess to the temple is restricted. Pilgrims may offer prayers at the base, but only those with permission from the High Acolyte may enter the inner sanctum or take water directly from the spring.\u003cbr\u003e\u003cbr\u003eTemple Customs:\u003cbr\u003e\u003cbr\u003e- No artificial fire within the inner sanctum.\u003cbr\u003e    \u003cbr\u003e- Offerings must include a piece of handwoven fabric dipped in the spring.\u003cbr\u003e    \u003cbr\u003e- All initiates take a vow of...","Properties:  \u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated.\u003cbr\u003e\u003cbr\u003eLimits:\u003cbr\u003e\u003cbr\u003e- Only a limited volume can be extracted per day.\u003cbr\u003e    \u003cbr\u003e- Excessive exposure can dull pain but doesn\u2019t cure deeper ailments unless sanctioned by the temple.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---","Form: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.  \u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes.\u003cbr\u003e\u003cbr\u003eVery emotionally unstable and the waterbenders have to be super careful not to disturb the water as the manatee starts to cry and throw a tantrum when they do.\u003cbr\u003e\u003cbr\u003e---","Location: Southern Water Tribe tundra, near the Glacial Temple  \u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round  \u003cbr\u003eNotable Feature: The Healing Spring of Akara, which emits a continuous healing mist due to the presence of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003eDescription:  \u003cbr\u003eAkara is a quiet, snow-dusted village nestled against a glacial ridge. Built in concentric circles around the Healing Spring of Akara, the town's layout reflects the cultural importance of balance and flow. Small wooden homes carved with oceanic motifs cluster closer to the spring, with larger communal and guest housing further out.\u003cbr\u003e\u003cbr\u003eThe village has become a sacred pilgrimage site for the chronically ill, terminally afflicted, and spirit-touched. While the Healing Spring of Akara's waters are said to be miraculous, the villagers are extremely cautious in how much water they allow to be drawn, in reverence to the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eKey NPCs:\u003cbr\u003e\u003cbr\u003e- High Acolyte Siva: Stoic leader of ...","","Type: Water Tribe Island Village  \u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves  \u003cbr\u003eAffinity: Waterbending, Spirits\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eKugluktup is a secretive and remote waterbending village located on a rugged island surrounded by turbulent seas. It lies several days' journey south of the Northern Water Tribe's territories. Due to its isolation and history of raids by pirates and foreign explorers, the villagers are notoriously wary and openly hostile to outsiders. Their waterbending traditions have diverged significantly from the mainstream Northern Tribe practices, adapting to a more self-sufficient, ocean-based survival.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUnique Features\u003cbr\u003e\u003cbr\u003eOceanwater Desalination Technique\u003cbr\u003e\u003cbr\u003eKugluktup's greatest innovation is their sacred Desalination Ritual, used to convert seawater into fresh water. This process is spiritual as much as it is practical and is central to village survival. It involves collaboration with the vill...","","The shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e\u003cbr\u003e\u003e \"There was\u2026 someone who always believed. The High Priest. Master Anzu.  \u003cbr\u003e\u003e He was banished to the temple archives after\u2026 well, too many sermons about invisible fish.\"\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfdb\ufe0f Act I: Finding Master Anzu\u003cbr\u003e\u003cbr\u003eThe party must explore the forbidden lower sanctum of the temple \u2014 a quiet, echoing archive of moldy scrolls, broken water clocks, and fish-shaped relics. Deep within, they find Master Anzu:\u003cbr\u003e\u003cbr\u003e- A thin, ancient man with big watery eyes, speaking in half-poetry and full riddles\u003cbr\u003e    \u003cbr\u003e- Surrounded by aquariums full of no fish \u2014 only reflections and bubbles\u003cbr\u003e    \u003cbr\u003e- He talks to the goldfish regularly, but admits \u201cShe\u2019s shy. She only appears when you aren\u2019t looking.\u201d\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdd Act II: The Limerick\u003cbr\u003e\u003cbr\u003eAmong the scrolls, Anzu reci...","","\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements. \u003cbr\u003e\u003cbr\u003e\u003e A watermelon seed that needs to be watered to grow into a sphere of X meter radius that pushes everyone away and creates a Heavy sphere with X(Earthebending slot count double) Hitpoints. The watermelon is then quickly heated and the steam cooled down to heal every creature in a 5  X Meters cone from the watermelon with the steam 3  X Hitpoints \u003cbr\u003e- Effects: \u003cbr\u003e- Wall : \u003cbr\u003e\t- X(Earthebending slot count double) Hitpoints\u003cbr\u003e- Healing\u003cbr\u003e\t- 5  X Meters cone from the watermelon\u003cbr\u003e\t- 2  X(Water Counts double) Hitpoints Healing\u003cbr\u003e\t-\u003cbr\u003e\ud83c\udf4b Sunburst Nectarfield (Lemonseed)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Fire or Water. Requires at least one Level from Fire and Air.  \u003cbr\u003eYou may use Levels from up to two Elements. Fire counts double.\u003cbr\u003e\u003cbr\u003e\u003e A lemon-shaped crystal is launched skyward, where it refr...","Location: Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\u003cbr\u003e\u003cbr\u003eSituation:  \u003cbr\u003eThe party seeks access to the Heart of Clarity (the ancient Resonance Stone), but they\u2019re intercepted by a Glassfang Vanguard Cell \u2014 loyal to the stone and sworn to protect it from those deemed \u201cunworthy\u201d or \u201cdisruptive.\u201d\u003cbr\u003e\u003cbr\u003eThe Glassfang benders are trained in Glassfruit Team-Up Techniques and immediately unleash synchronized bending using harvested seeds and sacred resonance tones.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc65 Encounter Composition\u003cbr\u003e\u003cbr\u003e\ud83e\uddf1 Baezu \u2013 Earthbender (Initiator for Glassfruit seeds)\u003cbr\u003e\u003cbr\u003e- Tactical leader, chants in low harmonic tones\u003cbr\u003e    \u003cbr\u003e- Carries a pouch of clear Soulseeds\u003cbr\u003e    \u003cbr\u003e- Triggers Soulseed Harmonic Seal for massive battlefield control\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Siroh \u2013 Firebender (Initiator for Inferno Bloom & FlashLemon)\u003cbr\u003e\u003cbr\u003e- Aggressive and flashy, uses rapid Firebending katas\u003cbr\u003e    \u003cbr\u003e- Wear...","Baezu \u2013 Earthbender Master of Resonance\u003cbr\u003e\u003cbr\u003eRole: Boss \u2013 Controller, Support, Spiritual Conduit  \u003cbr\u003eInitiates: \u26aa Soulseed Harmonic Seal, \ud83d\udfe2 BlueBerry Surge\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStats\u003cbr\u003e\u003cbr\u003e- HP: 110\u003cbr\u003e    \u003cbr\u003e- Armor: 3\u003cbr\u003e    \u003cbr\u003e- Earthbending Level: 7\u003cbr\u003e    \u003cbr\u003e- Speed: Slow 4m\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eactions per Round: 2 (Legendary Bender)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Earth Anchor (Passive)\u003cbr\u003e\u003cbr\u003eCannot be forcibly moved or knocked prone while touching stone. \u003cbr\u003eHas advantage on Concentration Checks\u003cbr\u003e\u003cbr\u003e\u25aa\ufe0f Seismic Meditation (Bonus Action)\u003cbr\u003e\u003cbr\u003eRegain 1 bending slot if standing still for the round.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTechniques\u003cbr\u003eGlassfruit Seed Mechanics\u003cbr\u003e\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\u270b Harmonic Command (Support)\u003cbr\u003e\u003cbr\u003eBonus Action: another Crystalfang bender may immediately act using 1 technique as a Reaction\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Siroh \u2013 Firebender Glassforger\u003cbr\u003e\u003cbr\u003eRole: Blaster, AoE Control  \u003cbr\u003eInitiates: \ud83d\udd34 Inferno Bloom, \ud83d\udfe1 FlashLemon Beam\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStats\u003cbr\u003e\u003cbr\u003e- HP: 6...","Plothook\u003cbr\u003e\u003cbr\u003eLocation: Omashu  \u003cbr\u003eCategory: Mystery, Ancient Lore, Spiritual Intrigue\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u26f0\ufe0f Hook Summary:\u003cbr\u003e\u003cbr\u003eWhile staying in Omashu, the party becomes involved in a mystery that will shake the foundation\u2014literally\u2014of one of the Earth Kingdom\u2019s oldest cities. Tremors beneath the city reveal not just ancient ruins, but a dormant guardian far older than the city itself.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf2c\ufe0f Cultural Flavor:\u003cbr\u003e\u003cbr\u003eLocals greet each other now with the phrase:  \u003cbr\u003e\u201cThe stone beneath still breathes.\u201d\u003cbr\u003e\u003cbr\u003eIt began as a poetic slogan after a strange event four years ago:  \u003cbr\u003eA group of quarry workers unearthed a resonance stone in the southern cliffs near Omashu. When struck, it caused a massive tremor\u2014and to the astonishment of all present, a massive turtle\u2019s head breached the ocean waters below the mountain, took a single GLORIOUS breath, and sank back below.\u003cbr\u003e\u003cbr\u003eIt was the first time the Earth Lion Turtle had moved in known history.\u003cbr\u003e\u003cbr\u003eScholars and spirit...","","City of Murmura\u003cbr\u003e\u003cbr\u003eTags: #PatolaMountainRange #Murmura #Airbending #Monastery\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eTucked away in the shadows of the Patola Mountain Range, Murmura is a quiet city known for its mysterious and serene atmosphere. It is the home of the [Monastery of the Silent Echo], where airbenders train in creating sound barriers that shield conversations and disrupt vibrations.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eFeatures of Murmura\u003cbr\u003e\u003cbr\u003eGeography\u003cbr\u003e- Located in a valley surrounded by towering cliffs.\u003cbr\u003e- Natural acoustics make it an ideal place for sound-dampening practices.\u003cbr\u003e\u003cbr\u003eTrade and Economy\u003cbr\u003e- Renowned for stone masonry and crafting architectural elements designed to manage acoustics.\u003cbr\u003e- Produces soundproofing materials that are sought after by other cities.\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e- Values silence and mindfulness.\u003cbr\u003e- Rituals and celebrations often emphasize visual and tactile elements, such as light displays and intricate carvings, over sound.\u003cbr\u003e- Meditative practices are common, with...","City of Zephyros\u003cbr\u003e\u003cbr\u003eTags: #PatolaMountainRange #Zephyros #Airbending #Monastery\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eNestled on a high plateau of the Patola Mountain Range, Zephyros is a small yet vibrant city, renowned for its connection to airbending arts and the wind-swept beauty of its surroundings. It serves as home to the revered [Monastery of the Whispering Winds], a center for training advanced airbending techniques that amplify sound vibrations.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eFeatures of Zephyros\u003cbr\u003e\u003cbr\u003eGeography\u003cbr\u003e- Situated on a plateau surrounded by cliffs and narrow mountain passes.\u003cbr\u003e- Frequent strong winds make it an ideal location for the Monastery\u2019s practices.\u003cbr\u003e\u003cbr\u003eTrade and Economy\u003cbr\u003e- Known for its windmill-powered grain mills.\u003cbr\u003e- Exports rare herbs and teas found only in the Patola Mountain Range.\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e- A city that reveres sound and storytelling.\u003cbr\u003e- Town squares are filled with musicians, poets, and storytellers showcasing their art.\u003cbr\u003e- Festivals often feature perform...","Earmur\u003cbr\u003e\u003cbr\u003eTags: #PatolaMountainRange #Fauna #Soundbending\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eThe Sonar Earmur is a unique and fascinating creature native to the Patola Mountain Range. A Lemur with huge ears. This animal is renowned for its natural attunement to soundbending, which it uses to hunt insects and navigate the rugged terrain of its habitat.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ePhysical Description\u003cbr\u003e- Fur: Dense, velvety fur in shades of dark gray and brown, providing camouflage against rocky surroundings.\u003cbr\u003e- Eyes: Small and poorly developed, as the creature relies on sound rather than sight.\u003cbr\u003e- Ears: Oversized and highly sensitive, capable of detecting the faintest vibrations in the air.\u003cbr\u003e- Claws: Strong, digging claws adapted for burrowing into soft soil and crevices.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBehavior\u003cbr\u003eHunting\u003cbr\u003e- The Sonar Earmur uses a form of natural soundbending to emit focused sound waves. By controlling the vibrations in the air, it can detect and pinpoint the location of insects even in comple...","","Overview:  \u003cbr\u003eTwin siblings from Sekan\u2019to whose seamless coordination has turned their unique dual-element fusion into an art form. They\u2019re local legends among younger benders and are being watched closely by the Crystalfire Circle.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc66 Kael (Older Twin, Firebender)\u003cbr\u003e\u003cbr\u003e- Element: Fire\u003cbr\u003e    \u003cbr\u003e- Personality: Outgoing, reckless, theatrical; deeply protective of Lira\u003cbr\u003e    \u003cbr\u003e- Style: Sharp, focused flame that arcs like a laser through mirrored crystals\u003cbr\u003e    \u003cbr\u003e- Role: Offensive striker and flare tactician\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc67 Lira (Younger Twin, Earth\u002fCrystalbender)\u003cbr\u003e\u003cbr\u003e- Element: Crystal Earthbending\u003cbr\u003e    \u003cbr\u003e- Personality: Reserved, focused, analytical; handles all structural control\u003cbr\u003e    \u003cbr\u003e- Style: Forms and shapes a mirror-like mineral coating (called Shinestone) over crystals\u003cbr\u003e    \u003cbr\u003e- Role: Light-focus engineer and illusion architect\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd2e Twin Bending Style: Gleam-Fusion Technique\u003cbr\u003e\u003cbr\u003eA high-discipline techni...","\ud83e\udded Hook Summary:\u003cbr\u003e\u003cbr\u003eWhile traveling the harsh Si Wong Desert, the heroes spot a mysterious gleam atop a sandstone spire\u2014a rhythmic flash of white light that appears unnatural, almost like a signal. Locals mention an ancient legend of a \u201cstar-serpent\u201d and a tribe of light-forgers hidden within the rock. The party must brave scorching winds, treacherous slopes, and possibly spiritual interference to uncover the truth.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udde3\ufe0f GM Read-Aloud \u2013 Desert Discovery\u003cbr\u003e\u003cbr\u003e\u003e As the desert heat shimmers on the horizon, something catches your eye \u2014 a glint. Then another. A pulse of light, like lightning trapped inside glass. It blinks from the top of a jagged rock mesa that juts out from the dunes like a spear aimed at the sun.\u003cbr\u003e\u003e \u003cbr\u003e\u003e \u201cNo fire shines like that in this heat,\u201d one of you murmurs. The light flickers again \u2014 three pulses. Then darkness.\u003cbr\u003e\u003e \u003cbr\u003e\u003e A traveler nearby mutters nervously, \u201cYou saw the serpent\u2019s signal. The old folk say that\u2019s where the Gleam-Tamers live...","DC 17 \u003cbr\u003e\u003cbr\u003eType: Greater Spirit  \u003cbr\u003eDomain: Light, Trickery, Fire  \u003cbr\u003eAlignment: Chaotic Neutral  \u003cbr\u003eChallenge Rating: 9  \u003cbr\u003eLair: The Crystal Hollow beneath Sekan\u2019to\u003cbr\u003e\u003cbr\u003e21\u003cbr\u003e27\u003cbr\u003e32\u003cbr\u003e36\u003cbr\u003e43\u003cbr\u003e47\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAppearance:  \u003cbr\u003eA sinuous spirit with translucent scales that shimmer with inner fire. Its wings resemble glowing firefly lanterns, and its rattlesnake-like tail ends in a crystal that emits dazzling pulses of light.\u003cbr\u003e\u003cbr\u003eWhooo are you to stand in front of me without kneeling?\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities:\u003cbr\u003e\u003cbr\u003e\u27a4 Blinding Flash (Recharge 4\u20136):  \u003cbr\u003eRaza'tel emits a pulse of searing white light from its tail crystal. All creatures within 60 ft must make a CON Save (DC 17) or be blinded for 1 minute. Success reduces to 1 round. Spirit-bonded individuals from Sekan\u2019to can use Reaction to shield themselves with a flare crystal.\u003cbr\u003e\u003cbr\u003e\u27a4 Serpent\u2019s Dance:  \u003cbr\u003eCan move through tight spaces without penalty and ignores difficult terrain created by crystal or fir...","\ud83d\udcc4 \u003cbr\u003eOverview:  \u003cbr\u003eRaza'tel, Spirit of Flash and Fang, has grown erratic and testy in recent weeks. Once content with the offerings of the villagers and occasional predator flesh, he has begun lurking near homes, unsettling livestock, and\u2014most concerning\u2014fixating on a curious village child who watches him from the rooftops.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eThe Spirit's Condition\u003cbr\u003e\u003cbr\u003e- Hunger: His appetite has deepened unnaturally, driven not just by physical need but spiritual imbalance due to a stolen object \u2014 the Resonance Stone.\u003cbr\u003e    \u003cbr\u003e- Mood Swings: Villagers report rapid mood shifts \u2014 playful illusions one moment, threatening flares the next.\u003cbr\u003e    \u003cbr\u003e- Recent Event: A stranger arrived a week ago and offered Raza'tel fresh meat, buying the village some time. But no one knows who the stranger was or where they went.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eQuest Hook\u003cbr\u003e\u003cbr\u003eWhen the party meets Raza'tel, he coils above a cracked cliff-ledge, glowing eyes half-lidded, tail slowly rattling with bursts ...","Elemental Roots: Firebending + Crystal-focused Earthbending  \u003cbr\u003eNickname: Crystalfire Flash or Gleam-bending\u003cbr\u003e\u003cbr\u003eCombat Techniques:\u003cbr\u003e\u003cbr\u003e- Flashflare Strike: A sudden burst of white-hot light from a crystal bomb, used to blind and disorient\u003cbr\u003e    \u003cbr\u003e- Radiant Brand: Fire-infused crystal shards that cling to a target and continue glowing intensely\u003cbr\u003e    \u003cbr\u003e- Mirror Serpent Dance: Reflective crystals scatter light from one another, creating blinding zones and illusions\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eUtility Techniques:\u003cbr\u003e\u003cbr\u003e- Flaretrail Pathing: Crystals laid in advance can be ignited to form a glowing path or trap\u003cbr\u003e    \u003cbr\u003e- Echo Pulse: Crystals resonate with flame, creating a pulse of light and sound that acts like echolocation\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eSpiritual Aspects:\u003cbr\u003e\u003cbr\u003e- Every crystal must be \"awakened\" with a ritual guided by Raza'tel, the Flashing Coil, invoking its inner light\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTraining:\u003cbr\u003e\u003cbr\u003e- Young benders must master both the meditative patience of earthbending cryst...","\ud83c\udf0d Setting: Village of Sekan'to (Si Wong Desert)\u003cbr\u003e\u003cbr\u003e- Hidden within a towering mesa in the Si Wong Desert, Sekan'to is carved into rich quartz veins deep in the desert\u2019s sandstone spires.\u003cbr\u003e    \u003cbr\u003e- Subterranean galleries and halls protect the village from heat and sandstorms.\u003cbr\u003e    \u003cbr\u003e- Flame-infused crystals illuminate the stone tunnels, casting glowing, angular patterns on the walls.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eMajor Locations:\u003cbr\u003e\u003cbr\u003e- Crystalfire Circle \u2013 the ruling council who sit in the mirrored Hall of Judgment\u003cbr\u003e    \u003cbr\u003e- Forge-Shrines \u2013 subterranean smithies where fire and earth unite to purify and shape crystals\u003cbr\u003e    \u003cbr\u003e- Crucible of Gleam \u2013 an arena embedded in a polished stone bowl that uses reflected sunlight and fire to dazzle fighters\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Unique Bending Style: Sekan'to Crystalfire Style\u003cbr\u003e\u003cbr\u003e- A refined fusion of firebending and crystal-earthbending, adapted to desert minerals\u003cbr\u003e    \u003cbr\u003e- Combines light, heat, and mineral reflection to disorient...","","Description\u003cbr\u003e\u003cbr\u003e- Appearance: A colossal peaceful and good spirit creature that is a hybrid between a toad and an elephant. It has thick, webbed feet, long elephant tusks, and a bloated, amphibian-like body with slick moist skin. Its texture resembles that of a toads \u2014 moist, clothed in simple silk robes. On its back is a disturbing cyst-like growth shaped like a smaller toad's face, with a trunk for a tongue hanging limply. The creature is ancient and wise, embodying Earth and Water, and is surrounded by a shimmering aura of mist.\u003cbr\u003e\t\u003cbr\u003e\u003cbr\u003e- Role: The spiritual protector of the Undersands Village .\u003cbr\u003e- Teachings:\u003cbr\u003e    - Combined Earth and Waterbending to manipulate sandstone hydration.\u003cbr\u003e    - Balance and sustainability in the harsh desert environment.\u003cbr\u003e\u003cbr\u003eCurrent Problem\u003cbr\u003e\u003cbr\u003e- Essence corruption: The spirit\u2019s power is shifting due to unknown influences.\u003cbr\u003e- Evil form:\u003cbr\u003e    - Tusks elongate, trunk becomes prehensile with a sticky frog tongue.\u003cbr\u003e    - Aggressive and...","","Overview\u003cbr\u003e\u003cbr\u003e- Location: Hidden beneath Si Wong Rock , central Si Wong Desert.\u003cbr\u003e    \u003cbr\u003e- Primary Features:\u003cbr\u003e    \u003cbr\u003e    - Underground lake: Provides water to sustain life.\u003cbr\u003e    - Fungi colonies: Essential for food, clothing, and tools.\u003cbr\u003e    - Purple light crystals: Emit a bioluminescent glow, providing light.\u003cbr\u003e- Inhabitants:\u003cbr\u003e    \u003cbr\u003e    - Dual-bending Earth and Waterbenders who use a unique technique to hydrate sandstone, allowing water retention in a closed system.\u003cbr\u003e    - Isolation for centuries. Language, traditions, and clothing are unique.\u003cbr\u003e- Religion and Worship:\u003cbr\u003e    \u003cbr\u003e    - Spirit: Ch\u00e1nch\u00fa  \u2013 A wise and powerful being that guided them to survive in their hostile environment.\u003cbr\u003e- Society:\u003cbr\u003e    \u003cbr\u003e    - Resource-focused: Mushroom-based leather-like textiles, crystal paste for light, and strict water management.\u003cbr\u003e    - Leadership: A council of elder benders, each excelling in Earth, Water, or combined bending techniques.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cb...","","I maybe want an arc there between metalbender and airbender characters to find ways to woek together.\u003cbr\u003e\u003cbr\u003eType: Spirit Beast  \u003cbr\u003eElemental Affinity: Air & Earth  \u003cbr\u003eHybrid Form: Peregrine Falcon + Armadillo\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udccc Description\u003cbr\u003e\u003cbr\u003eThe Galehide Armadra is a rare spirit born from the convergence of swift winds and resolute stone. It has the wings and keen eyes of a falcon, merged with the armored shell and burrowing claws of an armadillo. Its spirit form is in constant, subtle motion\u2014its body shimmering slightly as if caught between gust and granite.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Abilities\u003cbr\u003e\u003cbr\u003eEvasive Windstep (Airbending)\u003cbr\u003e\u003cbr\u003e- The Galehide Armadra uses short bursts of compressed air to blur its position, making it extremely difficult to track or hit.\u003cbr\u003e    \u003cbr\u003e- Mechanically: +2 or +3 to Evasion rolls; may impose Disadvantage on attacks once per round.\u003cbr\u003e    \u003cbr\u003e- Fluff: It seems to \"ghost\" sideways just as you strike.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eMetalhide Mantle (Earthbending\u002fMet...","","","Name: Kaedo  \u003cbr\u003eAge: Mid-twenties  \u003cbr\u003eRole: Tour Guide of Mahzeen Village, Sandbending Prodigy\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBackground:\u003cbr\u003e\u003cbr\u003eKaedo was born and raised in the Village of Mahzeen, a remote Sandbender settlement near the ancient Earth Temple. As a child, he was always tinkering with the dunes, shaping small sand sculptures for travelers and inventing playful uses for the desert wind. His parents\u2014humble herders\u2014never expected much beyond a stable future guiding caravans, but Kaedo surprised everyone with his natural talent and quick mastery of sandbending techniques.\u003cbr\u003e\u003cbr\u003eAs he grew older, Kaedo became the village\u2019s unofficial \u201cfaces and voices\u201d to the outside world. His tours of Mahzeen were famous for their charm, humor, and breathtaking bending displays. He\u2019s the one who leads travelers around the oasis, showing them the intricate carvings, the subtle dunes that whisper of ancient spirits, and the clever ways Sandbenders have adapted to life in the harsh desert.\u003cbr\u003e\u003cbr\u003e---\u003cbr...","A Dark humnaoid Cat like Spirit that has a large shard of Vaatu and was therefore corrupted early. He supresses the dark as good as he cans but the dark spirit also gives him the gifts to be an elite assasin. He only uses a little bit of airbending and is mostly waepon and archery based.\u003cbr\u003e\u003cbr\u003eRace\u002fType: Dark Humanoid Cat-like Spirit  \u003cbr\u003eAffiliation: Independent (Potentially allied with the Party and later Night Bloom?)  \u003cbr\u003eRole: Elite Assassin, Tracker, and Protector\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eSilent Song is a shadowy feline humanoid spirit with sleek, dark fur and piercing silver eyes. His form is lithe and agile, blending the traits of a predator with the intelligence of a humanoid. A shard of Vaatu, the spirit of chaos and darkness, embedded itself in Silent Song. This corruption taints him, but Silent Song works tirelessly to suppress its influence.\u003cbr\u003e\u003cbr\u003eThe dark shard grants him supernatural abilities, enhancing his combat prowess and sensory skills but constantly tem...","Links:\u003cbr\u003e- Kaedo, the Young Sandbender Guide","","The Last Avatar\u003cbr\u003eFather of Kaedo\u003cbr\u003e\u003cbr\u003eWrite a dreamsequence Monologue for the players. The narrator is Salla. She was the avatar before Atash (the last avatar). She perfected Foambending and is showing a vision in the foam of the ocean waves in the wind. Describe her as standing and almost dancing on top of the water in a wind swept sea as she uses air and waterbending to control the storm around her and create visions in the foam. She taught Atash to use Sandbending to create stories. She explains that now that the avatar spirit is splintered there are many that are born with a part of it. The light and dark parts are not distributed evently and as it grows exponentially it is important too nourish the light energy early on. In the second dream she explains that by showing kindness and bringing joy to the world you can nourish your light energy. She also says that she can feel Atashs spirit still being trapped and the avatar spirit being sucked out of him slowly and potentially pa...","","Links:\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Grandmaster Iroh Tanaka","","Links:\u003cbr\u003e- Rin Kotak\u003cbr\u003e- Isay Trekal\u003cbr\u003e- Hanal Koga","","Name: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 6 (-2)\u003cbr\u003eDexterity (DEX) | 16 (+3)\u003cbr\u003eConstitution (CON) | 10 (+0)\u003cbr\u003e\u003cbr\u003e- Size: Small\u003cbr\u003e    \u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMovement:\u003cbr\u003e\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect en...","Tranformation Points cost: 2 Transformation Points\u003cbr\u003e\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 8 (-1)\u003cbr\u003eDexterity (DEX) | 14 (+2)\u003cbr\u003eConstitution (CON) | 12 (+1)\u003cbr\u003e\u003cbr\u003e- Size: Medium\u003cbr\u003e-  Ideal for scouting, hunting, and ambushing. The Sonar Earmur's sound-based abilities make it perfect for detecting enemies and disrupting plans, while its stealth and mobility allow it to evade retaliation effectively. Its combat abilities make it a nuisance for casters or stealth-reliant foes.\"\u003cbr\u003e\u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable, silent).\u003cbr\u003e    - Burrow 5 m (adapted for soft soil and loose earth).\u003cbr\u003e\u003cbr\u003e- Abilities in Sonar Earmur Form:    \u003cbr\u003e    - Echolocation Mastery: Advantage on Perception checks that rely on hearing. Can detect creatures and objects within a 30 m radius, even in complete darkness, unless in a \"silence zone.\"\u003cbr\u003e\t- Silent Hunt: Advantage on Stealth checks while flying or burrowing, as its movements are nearly soundless.\u003cbr\u003e\t- Soundbending Pulse: Once per ...","Context:  \u003cbr\u003eImmediately after the group's victory over a corrupted spirit. Mahogany, the group's only spirit, has absorbed the entity\u2019s negative energy and purified it from within through a spiritual contest.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfaf Mechanics\u003cbr\u003e\u003cbr\u003e- Trigger: Mahogany completes the spirit cleansing.\u003cbr\u003e    \u003cbr\u003e- Airbenders in the group must make a Perception check (DC 12, with advantage).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eOn Success:  \u003cbr\u003eThey sense a brief, unnatural shift in air pressure\u2014a swirl or pulse like a door opening to a hidden chamber, but they are high on a mountain with nothing around. It vanishes after two seconds.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Mahogany's Vision\u003cbr\u003e\u003cbr\u003e\u003e (Private: The player can request the others to leave the room for this scene.)\u003cbr\u003e\u003cbr\u003e\u003e As the spiritual remnants fade, Mahogany feels a tingle in the air\u2014not hostile, but watchful.  \u003cbr\u003e\u003e Then, a soft voice, cold as distant wind, whispers directly into her ear:\u003cbr\u003e\u003cbr\u003e\"Now... who are you?\"\u003cbr\u003e\u003cbr\u003eMahogany may make a History or Insigh...","","","The village of the Spidermonkeys\u003cbr\u003eAdventure: \u003cbr\u003e\u003cbr\u003eSetting: The Floating Island of the Nomadic Airbenders\u003cbr\u003e\u003cbr\u003eThe players find themselves in a dense forest, where an entire floating island has landed momentarily. This island belongs to a nomadic airbending tribe that has perfected a unique bending style called Silkbending, inspired by their deep bond with the Spiderlemurs.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs\u003cbr\u003e\u003cbr\u003eA rare species found only in this part of the world, Spiderlemurs have the body of a lemur but with four arms, four legs, and a long prehensile tail. Their heads resemble spiders, complete with multiple eyes and small mandibles. They produce powerful silk from each of their appendages, which they use to glide alongside the airbenders, creating parachutes they manipulate through airbending. Their silk is also essential for the tribe, used for clothing, rope, and even structural supports for their floating homes.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs assist in keeping the floating island airborn...","","","Overview of Earth Kingdom adventures, including themes like resilience, strength, and the challenges of navigating a vast and diverse region. Includes guidelines for integrating these modules with the larger campaign.","","Overview:\u003cbr\u003e\u003cbr\u003eThe Avatar spirit, the bridge between the physical and spiritual realms, is in a precarious state. During the final moments of the last Avatar\u2019s life, a catastrophic event caused the spirit\u2019s essence to splinter, disrupting the cycle of reincarnation and weakening its connection to the Spirit World.\u003cbr\u003e\u003cbr\u003eEvent of Fracture:\u003cbr\u003e\u003cbr\u003eThe fracture occurred during a climactic battle against a monstrous corrupted spirit, commanded by the rogue Spiritbender. The Avatar sacrificed themselves to contain the spirit\u2019s power, but the Spiritbender\u2019s mist disrupted the Avatar\u2019s spiritual essence, leaving it fragmented and vulnerable.\u003cbr\u003e\u003cbr\u003eEffects of the Fracture:\u003cbr\u003e\u003cbr\u003e1. Weakened Avatar State: The current Avatar cannot fully access the power of their predecessors, making their connection to past lives erratic and unreliable.\u003cbr\u003e    \u003cbr\u003e2. Disturbed Spirit World: The fracture has caused chaos in the Spirit World, with dark spirits manifesting more frequently in the physical real...","","Overview of the purpose of the #Modules folder, including guidelines on how to scale the modules based on the party's power level and integrate them into the main campaign.\u003cbr\u003e\u003cbr\u003eModules","","Collectionfile\u003cbr\u003e\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Action --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 graphs\u003cbr\u003e      \u2514\u2500\u2500 wikigraphtreemap.html\u003cbr\u003e  \u251c\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u251c\u2500\u2500 Bending Rules\u003cbr\u003e              \u251c\u2500\u2500 Air\u003cbr\u003e                  \u2514\u2500\u2500 Airbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 2 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Wind spiral.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 3 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Hovering Hands.md\u003cbr\u003e              \u251c\u2500\u2500 Earth\u003cbr\u003e                  \u251c\u2500\u25 3cbr\u003e  .\u002f\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","","- Physical Description:  \u003cbr\u003e        A tall, lean man in his early sixties with silver-streaked black hair tied into a high topknot. His sharp amber eyes radiate wisdom and authority, while his lightly weathered skin reflects years of spiritual practice. He has a composed, almost regal posture, wearing a perpetual calm smile that hides the fire of his immense power.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Firebending infused with advanced spiritual techniques, emphasizing control and harmony over raw power. Known for producing green flame as a sign of his mastery.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the organization\u2019s spiritual and physical balance, emphasizing diplomacy and tradition.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Wisdom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eFirebending\u003cbr\u003e\u003cbr\u003eDear Iroh Tanaka,\u003cbr\u003eWe hope this letter finds you well, we from team anju the avatar make our way Omashu. We think the bad guys (and girls and enbis) want to go to that village. Greeting from christopher. anyways that village has a chrystal that...","- Physical Description:  \u003cbr\u003e        A middle-aged woman of medium height with a graceful, slender build. Her long, silvery-blue hair flows freely down her back, adorned with small jade pins shaped like water droplets. Her piercing sea-green eyes seem to look into a person\u2019s soul. Her demeanor is serene but carries an undercurrent of strength, much like a calm sea hiding its depth.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending that incorporates healing and offensive manipulation of mist, granting her versatility in combats\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Strength\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eNPC","NPC","","Character\u003cbr\u003e\u003cbr\u003e- Name: Ula\u003cbr\u003e    \u003cbr\u003e- Appearance:\u003cbr\u003e    \u003cbr\u003e    - Pale skin, faintly glowing purple hair due to crystal-paste dye.\u003cbr\u003e    - Mushroom-leather outfit with a toad-eye hood for tradition and identity.\u003cbr\u003e- Personality:\u003cbr\u003e    \u003cbr\u003e    - Determined, resourceful, and reverent toward the spirit.\u003cbr\u003e    - Nervous about interacting with the outside world.\u003cbr\u003e- Role:\u003cbr\u003e    \u003cbr\u003e    - Tasked with seeking a Spirit Bender to save Ch\u00e1nch\u00fa .\u003cbr\u003e    - Acts as the guide for the party to the Undersands Village .\u003cbr\u003e\u003cbr\u003eEquipment:\u003cbr\u003e\u003cbr\u003e- Crystals for lighting caves.\u003cbr\u003e- Hydration stones for water control and protection.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e\u003cbr\u003e- Ch\u00e1nch\u00fa \u003cbr\u003e- Undersands Village \u003cbr\u003e- Spirit Benders \u003cbr\u003e- Mushroom Leather Techniques \u003cbr\u003eNPC","","- Physical Description:  \u003cbr\u003e    A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e- Bending Style:  \u003cbr\u003e    Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e- Role:  \u003cbr\u003e    Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003eNPC","","","Organisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Night Bloom is a radical faction seeking to overthrow the Avatar\u2019s influence, advocating for a world ruled collectively by elite benders. They view the Avatar as a relic of oppression and seek to reshape the spiritual and physical realms.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLeadership:\u003cbr\u003e\u003cbr\u003e1. Isay Trekal (she\u002fher) (Faction Leader)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e    - R...","","My character is Anju, the oldest daughter of 5 siblings. Anju's father always wanted a son but he\u003cbr\u003ewas only blessed with daughters. Believing only males could lead the great southern water tribe\u003cbr\u003eto further prosperity, he decided to raise Anju like the son he always wanted to have.\u003cbr\u003e(Anju is derived from \"Angijua\" in Inuktitut which means \"older brother\")\u003cbr\u003eThe mother died after giving birth to the 5th child, Anju and her siblings were raised by their\u003cbr\u003efather and the father's sister.\u003cbr\u003e\u003cbr\u003eEven though Anju was raised like a man, she has a feminine side to her which she learned from\u003cbr\u003eher aunt. The father is strict but also a good instructor. In time, Anju has enough athletic ability\u003cbr\u003eto pass as an average male of her tribe (though not outstanding like Korra). Anju's strength lies\u003cbr\u003ein her ability to create icicles. One of her greatest achievements - and also secrets - is when she\u003cbr\u003ecreated thick icicle soles to appear 5cm taller, which made her taller than her father at ...","","Character Summary\u003cbr\u003e\u003cbr\u003eRace:  \u003cbr\u003eSpirit-turned-human\u003cbr\u003e\u003cbr\u003eClass:  \u003cbr\u003eAir Spirit\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBackstory:  \u003cbr\u003eOnce a small spirit living among the Air Nomads, I helped them forage, offering guidance and protection in their peaceful, nature-centered life. But when the spirit doors closed, I was trapped in the Spirit World, separated from the humans I cared for.\u003cbr\u003e\u003cbr\u003eAfter countless years, I found a way to cross back through an abandoned Air Nomad temple. When I arrived, I was shocked to see how much the world had changed\u2014machines, bending powers, and humans who no longer lived in harmony with nature.\u003cbr\u003e\u003cbr\u003eConfused and fascinated, I wander this unfamiliar world, trying to understand what has happened and how I can help again.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBase Abilities (Available in all forms)\u003cbr\u003e\u003cbr\u003e- Spiritual Nourishment:  \u003cbr\u003e    Can create small plants or fruits that provide minor healing (1d6 + Proficiency bonus) or temporary bonuses:\u003cbr\u003e    \u003cbr\u003e    - Energizing Fruit: Grants +2...","You have your CL  2  amount of Transformation Points\u003cbr\u003e\u003cbr\u003etransformation","","","\u003c!-- No backlinks found --\u003e","\u003c!-- No backlinks found --\u003e","","","If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.","Con save DC of max(10, Damage Taken \u002f 2)\u003cbr\u003eSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con save with a DC o
