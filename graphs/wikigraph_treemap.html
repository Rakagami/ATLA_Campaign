ic Flow\u003cbr\u003eConcentration\u003cbr\u003eLevel 3\u003cbr\u003e    \u003cbr\u003eRange: 1  Water Charges Meter radius cloud\u003cbr\u003eEffect:\u003cbr\u003e Water Charges  d8 Healing to every creature that was in the clouds radius during the Concentration\u003cbr\u003e\u003cbr\u003e- Interactions:\u003cbr\u003e    - Can be moved by Airbenders.\u003cbr\u003e        \u003cbr\u003e    - Can be dispersed or destroyed by strong firebending or extreme heat breaking Cyclic Flow\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eCyclic Flow\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eIce Wall (3rd Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 4 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a solid wall of ice, up to 30ft long 10 ft tall and 10 ft wide.\u003cbr\u003e    - HP: 30 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Ice Wall\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e- Cost: 3- 2  CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 5 Meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    You create A number of Icicles equal to the used charges.\u003cbr\u003e\tThey swirl around the Target and grants them the Reaction to send any or all of the Ammunition against one target within 100 Meters of them until all Icicles are used.\u003cbr\u003e\tAmmunition:\u003cbr\u003e    - HP: 20 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Damage 5d12 + Int Piercing Damage\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Passive.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender rides atop a thin sheet of water or ice, moving with increased agility.\u003cbr\u003e    - Speed Boost: Gain +30 ft movement speed.\u003cbr\u003e    - Prerequisite: Accessible at a higher level(TBA).\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eShockfreeze (Cantrip)\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: The same as the Waterbending used as Action f\u003cbr\u003e- Effect:  \u003cbr\u003e    After using an Action to use a Waterbending Move that consumes water charges you can use your Bonus Action to let every creature hit by your Action roll a Strength Saving throw against your Waterbending DC or become Immobilised. \u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Shockfreeze\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eImmobilisation \u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eWaterbenders are versatile combatants who manipulate water, ice, and mist with fluid, adaptive techniques. Unlike other benders, they rely on a resource called Water Charges to perform bending abilities. Their style focuses on redirection, control, and adaptability, drawing power from their environment.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCore Mechanics:\u003cbr\u003e\u003cbr\u003e1. Redirection Mechanic:\u003cbr\u003e\u003cbr\u003eWaterbenders excel at using their enemies\u2019 attacks against them. This mechanic reflects their unique style.\u003cbr\u003e\u003cbr\u003eAs a Reaction when hit by ranged physical attack.\u003cbr\u003e- Counter-Redirect physical:\u003cbr\u003e    - Cost: 1 Water Charge per 1d10 Damage redirected.\u003cbr\u003e    - When targeted by a ranged physical attack, the Waterbender can redirect it back to the attacker or a different target. This attack has the same range as the initial attack. If you reduce the damage you take to 0 you get back all used Watercharges.\u003cbr\u003e    - Redirected attacks deal half damage.\u003cbr\u003e\u003cbr\u003eAs a Reaction when hit by a physical melee attack\u003cbr\u003e- Parry:\u003cbr\u003e    - Cost: 1 Water Charge per 1d6 Damage parried.\u003cbr\u003e    - Reduce incoming physical melee damage by 1d6 + Dexterity modifier.\u003cbr\u003e    \u003cbr\u003eAs a Reaction when hit by a Waterbending Attack\u003cbr\u003e-Counter Waterbending\u003cbr\u003e    - Cost: None.\u003cbr\u003e    - When targeted by a Waterbending attack, you can use their own Waterbending to reduce the Damage by 1d10 per Character Level.\u003cbr\u003e    - If the Damage is reduced to 0 you can use one of your own Waterbending attacks with the same (or less) Watercharges cost.\u003cbr\u003e\t\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMud bending costs more charges as it is harder to bend than pure water. (1.5)\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eHow efficiently you use your Waterbottle  that you can carry with you.\u003cbr\u003e\u003cbr\u003eWaterbending Level | Waterbottle Water Charges\u003cbr\u003e1-4 | 1\u003cbr\u003e5-8 | 2\u003cbr\u003e9-12 | 3\u003cbr\u003e13-16 | 4\u003cbr\u003e17-20 | 5\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","","Danger Sense Reaction.\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 3  Airbending Slot meters.\u003cbr\u003eEffects:\u003cbr\u003e- Push up to Airbending Slot  objects or creatures within Range away, up to Airbending Slot Meters in a chosen direction.\u003cbr\u003e- Creatures must make a Strength save against your Airbending DC.\u003cbr\u003eAirbending DC\u003cbr\u003e---\u003cbr\u003eDanger Sense Reaction\u003cbr\u003eLevel 3\u003cbr\u003e\t- Range: Self\u003cbr\u003eEffects:\u003cbr\u003e\t- Gain Advantage on dexterity saving throws until the start of your turn\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003eDanger Sense Reaction\u003cbr\u003eLevel 2\u003cbr\u003e\t- Range: 2  Airbending Slot meters radius.\u003cbr\u003e- Duration: Instantaneous.\u003cbr\u003eEffects:\u003cbr\u003e\tCreate a swirling vortex of air around you to deflect projectiles and disperse lingering Damgage effects.\u003cbr\u003eAirbending\u003cbr\u003e---","\u003c!-- No backlinks found --\u003e","wikigraph_treemap.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Physical Description:  \u003cbr\u003e        A tall, lean man in his early sixties with silver-streaked black hair tied into a high topknot. His sharp amber eyes radiate wisdom and authority, while his lightly weathered skin reflects years of spiritual practice. He has a composed, almost regal posture, wearing a perpetual calm smile that hides the fire of his immense power.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Firebending infused with advanced spiritual techniques, emphasizing control and harmony over raw power. Known for producing green flame as a sign of his mastery.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the organization\u2019s spiritual and physical balance, emphasizing diplomacy and tradition.\u003cbr\u003eLinks:\u003cbr\u003e- Wisdom\u003cbr\u003eTags:\u003cbr\u003eFirebending\u003cbr\u003eDear Iroh Tanaka,\u003cbr\u003eWe hope this letter finds you well, we from team anju the avatar make our way Omashu. We think the bad guys (and girls and enbis) want to go to that village. Greeting from christopher. anyways that village has a chrystal that we think that might be the next target of the evil people.\u003cbr\u003emfg  \u003cbr\u003eTeam Anju\u003cbr\u003eTHIS GOT EATEN BY ALEXANDER\u003cbr\u003eNPC\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Physical Description:  \u003cbr\u003e        A middle-aged woman of medium height with a graceful, slender build. Her long, silvery-blue hair flows freely down her back, adorned with small jade pins shaped like water droplets. Her piercing sea-green eyes seem to look into a person\u2019s soul. Her demeanor is serene but carries an undercurrent of strength, much like a calm sea hiding its depth.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending that incorporates healing and offensive manipulation of mist, granting her versatility in combats\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Strength\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eNPC\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eNPC\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCharacter\u003cbr\u003e- Name: Ula\u003cbr\u003e    \u003cbr\u003e- Appearance:\u003cbr\u003e    \u003cbr\u003e    - Pale skin, faintly glowing purple hair due to crystal-paste dye.\u003cbr\u003e    - Mushroom-leather outfit with a toad-eye hood for tradition and identity.\u003cbr\u003e- Personality:\u003cbr\u003e    \u003cbr\u003e    - Determined, resourceful, and reverent toward the spirit.\u003cbr\u003e    - Nervous about interacting with the outside world.\u003cbr\u003e- Role:\u003cbr\u003e    \u003cbr\u003e    - Tasked with seeking a Spirit Bender to save Ch\u00e1nch\u00fa .\u003cbr\u003e    - Acts as the guide for the party to the Undersands Village .\u003cbr\u003eEquipment:\u003cbr\u003e- Crystals for lighting caves.\u003cbr\u003e- Hydration stones for water control and protection.\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e- Ch\u00e1nch\u00fa \u003cbr\u003e- Undersands Village \u003cbr\u003e- Spirit Benders \u003cbr\u003e- Mushroom Leather Techniques \u003cbr\u003eNPC\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Physical Description:  \u003cbr\u003e    A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e- Bending Style:  \u003cbr\u003e    Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e- Role:  \u003cbr\u003e    Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eNPC\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eshe her\u003cbr\u003ePhysical Description:  \u003cbr\u003e        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Earthbending with a specialization in sand manipulation.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Night Bloom\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eNPC\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eRin Kotak.png\u003cbr\u003ehe\u002fhim\u003cbr\u003ePhysical Description:  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003eTags:\u003cbr\u003eAirbending\u003cbr\u003e\u201cThey call it balance. They say the Avatar brings peace. But I ask you\u2014what peace is built upon the whims of a single soul? One person, plucked from the cycle, anointed by spirits, wielding the fury of all four elements like a god among mortals. We kneel to them. We trust them. We fear them. We wait for them to fix what we cannot. But what happens when the Avatar fails? When they vanish? When they turn tyrant? No one should bear such power. And no one should have to live under it. Balance cannot come from a single hand\u2014it must rise from all of us, together. End the cycle. Let the world breathe free for once, without its so-called savior.\u201d\u003cbr\u003eInit:\u003cbr\u003ephot 21 \u003cbr\u003eRin Xolai 20 \u003cbr\u003eTapi 19\u003cbr\u003ePui 15\u003cbr\u003eIroh Tanaka 15\u003cbr\u003eRiu 14\u003cbr\u003eIsay Treksal 12\u003cbr\u003eStie 12\u003cbr\u003eAnju 12\u003cbr\u003eJin koga\u003cbr\u003eAkira Meiyu\u003cbr\u003eDAMAGE\u003cbr\u003e9\u003cbr\u003eNPC\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Organisations\u003cbr\u003eOverview:\u003cbr\u003eThe Night Bloom is a radical faction seeking to overthrow the Avatar\u2019s influence, advocating for a world ruled collectively by elite benders. They view the Avatar as a relic of oppression and seek to reshape the spiritual and physical realms.\u003cbr\u003e---\u003cbr\u003eLeadership:\u003cbr\u003e1. Isay Trekal (she\u002fher) (Faction Leader)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e    - Role:  \u003cbr\u003e        Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e2. Hanal Koga(she\u002fher) (Second-in-Command)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Earthbending with a specialization in sand manipulation.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\u003cbr\u003e3. Rin Kotak(he\u002fhim) (Spiritualist)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003e    - Role:  \u003cbr\u003e        Spirit guide of the Night Bloom, responsible for forging alliances with rogue spirits.\u003cbr\u003e---\u003cbr\u003eUniform Design:\u003cbr\u003e- Colors:  \u003cbr\u003e    Black and deep purple, representing secrecy and defiance, with accents of crimson to signify rebellion.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Sleek and utilitarian clothing designed for agility.\u003cbr\u003e    - Leaders wear flowing cloaks with jagged, petal-like edges to resemble blooming flowers in the dark.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - Masks covering the lower face, often stylized with floral patterns or fanged motifs.\u003cbr\u003e    - Small spirit-charms integrated into their outfits, glowing faintly with corrupted energy during rituals or battles.\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Isay Trekal\u003cbr\u003e- Rin Kotak\u003cbr\u003e- Night Bloom\u003cbr\u003e- Hanal Koga\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eWaterbending\u003cbr\u003eAirbending\u003cbr\u003eAvatar\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eOrganisations\u003cbr\u003eOverview:\u003cbr\u003eThe Lotus is a venerable organization dedicated to the balance of the world, acting as spiritual guides and protectors of harmony. They host the annual Ceremony of the Resonance, symbolizing their commitment to unity among benders.\u003cbr\u003e---\u003cbr\u003eUniform Design:\u003cbr\u003e- Colors:  \u003cbr\u003e    White and gold, symbolizing purity and enlightenment, with accents of light blue to represent spiritual connection.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Flowing robes for spiritual leaders, with a lotus emblem embroidered on the chest.\u003cbr\u003e    - Soldiers wear sturdy uniforms with plated armor on shoulders and bracers, designed for mobility and defense.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - A sash or belt with a lotus motif, denoting rank.\u003cbr\u003e    - Masks for combat troops, styled after serene and neutral faces, emphasizing their role as impartial protectors.\u003cbr\u003eLinks:\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Armor\u003cbr\u003e- Strength\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Wisdom\u003cbr\u003e- Grandmaster Iroh Tanaka\u003cbr\u003e- The Lotus\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","\u003c!-- No backlinks found --\u003e","Danger Sense Reaction.\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 3  Airbending Slot meters.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- Push up to Airbending Slot  objects or creatures within Range away, up to Airbending Slot Meters in a chosen direction.\u003cbr\u003e- Creatures must make a Strength save against your Airbending DC.\u003cbr\u003e\u003cbr\u003eAirbending DC\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eDanger Sense Reaction\u003cbr\u003eLevel 3\u003cbr\u003e\t- Range: Self\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\t- Gain Advantage on dexterity saving throws until the start of your turn\u003cbr\u003e\u003cbr\u003eAirbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eDanger Sense Reaction\u003cbr\u003eLevel 2\u003cbr\u003e\t- Range: 2  Airbending Slot meters radius.\u003cbr\u003e- Duration: Instantaneous.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\tCreate a swirling vortex of air around you to deflect projectiles and disperse lingering Damgage effects.\u003cbr\u003e\u003cbr\u003eAirbending\u003cbr\u003e\u003cbr\u003e---","","she her\u003cbr\u003ePhysical Description:  \u003cbr\u003e        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Earthbending with a specialization in sand manipulation.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eNPC","","Rin Kotak.png\u003cbr\u003ehe\u002fhim\u003cbr\u003e**Physical Description:**  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - **Bending Style:**  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003e**Links**:\u003cbr\u003e- [[Night Bloom]]\u003cbr\u003eTags:\u003cbr\u003e#Airbending\u003cbr\u003e\u201cThey call it balance. They say the Avatar brings peace. But I ask you\u2014what peace is built upon the whims of a single soul? One person, plucked from the cycle, anointed by spirits, wielding the fury of all four elements like a god among mortals. We kneel to them. We trust them. We fear them. We wait for them to fix what we cannot. But what happens when the Avatar fails? When they vanish? When they turn tyrant? No one should bear such power. And no one should have to live under it. Balance cannot come from a single hand\u2014it must rise from all of us, together. End the cycle. Let the world breathe free for once, without its so-called savior.\u201d\u003cbr\u003eInit:\u003cbr\u003ephot 21 \u003cbr\u003eRin Xolai 20 \u003cbr\u003eTapi 19\u003cbr\u003ePui 15\u003cbr\u003eIroh Tanaka 15\u003cbr\u003eRiu 14\u003cbr\u003eIsay Treksal 12\u003cbr\u003eStie 12\u003cbr\u003eAnju 12\u003cbr\u003eJin koga\u003cbr\u003eAkira Meiyu\u003cbr\u003eDAMAGE\u003cbr\u003e9\u003cbr\u003e[[NPC]]","","Bearturtle.webp#### **Bearturtle Form (Protection\u002fDefense Form)**\u003cbr\u003e- **Size:** Medium\u003cbr\u003e- On Transform:\u003cbr\u003e\t- **Defensive Presence:** Allies within 5 meter gain +3 to their AC until you Form Drops.\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 22 (+6)\u003cbr\u003eDexterity (DEX) | 2 (-4)\u003cbr\u003eConstitution (CON) | 24 (+7)\u003cbr\u003eWisdom(WIS) | 10(+0)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003e- **Movement:**\u003cbr\u003e    \u003cbr\u003e    - Walk 20 meter.\u003cbr\u003e    - Swim 10 meter\u003cbr\u003e- **Abilities in Bearturtle Form:**\u003cbr\u003e    - **Shell Shield:**\u003cbr\u003e\t    - [[Reaction]]\u003cbr\u003e\t        When an ally within 3 meter is attacked, impose Disadvantage on the attack roll as you shift to protect them with your shell. Can be used a number of times equal to your [[Proficiency]] bonus per long rest.\u003cbr\u003e\t    **Tuck in**: \u003cbr\u003e\t    - [[Reaction]]\u003cbr\u003e\t\t    When you fail a dexterity saving throw you still only take half damage. Your [[Movement]] in the next round is halved.\u003cbr\u003e    - **Sturdy Form:**\u003cbr\u003e\t    - You have Advantage on saving throws against being knocked prone or moved against your will.\u003cbr\u003e    -\u003cbr\u003e    - \u003cbr\u003e- **Combat Stats (Bearturtle):**\u003cbr\u003e    \u003cbr\u003e    - Evasion: 15\u003cbr\u003e    - \u003cbr\u003e    - Armor: \u003cbr\u003e\t    - 5 [[Physical Armor]]\u003cbr\u003e\t    - 3 [[General Armor]]\u003cbr\u003e    - HP: 28.\u003cbr\u003e    - Attacks:\u003cbr\u003e        - **Powerful Swipe:** Melee Weapon Attack, +Strength to hit, 2d6 + Str slashing damage.\u003cbr\u003e\t- **Shell Slam (AOE):** All creatures within a 1 meter radius must make a Dexterity save DC17 or take 2d8 bludgeoning damage.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1","Flying Lemur Form\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 6 (-2)\u003cbr\u003eDexterity (DEX) | 24(+7)\u003cbr\u003eConstitution (CON) | 7 (-2)\u003cbr\u003eWisdom(WIS) | 14(+2)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e- Size: Small\u003cbr\u003e    \u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable).\u003cbr\u003e    - Climb 20 m (adapted to vertical movement).\u003cbr\u003e- Abilities in Flying Lemur Form:\u003cbr\u003e\u003cbr\u003e    - Silent Glide: Advantage on Stealth checks while flying.\u003cbr\u003e    - Acute Senses: Advantage on Perception checks that rely on sight or hearing.\u003cbr\u003e    - Quick Escape: Disengage or dash as a Bonus Action.\u003cbr\u003e- Combat Stats (Flying Lemur):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 20\u003cbr\u003e    - HP: 6 (fragile but evasive).\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Razor Claws: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 slashing damage.\u003cbr\u003e- Uses:  \u003cbr\u003e    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\u003cbr\u003e\u003cbr\u003eBending Slots:\u003cbr\u003e\tAir Lvl1: 4","**Name:** Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003e**Type:** Lesser Spirit  \u003cbr\u003e**Domain:** Light, Trickery  \u003cbr\u003e**Transformation Points cost:** 2 [[Transformation Points]]\u003cbr\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- **Size:** Small\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 4 (-3)\u003cbr\u003eDexterity (DEX) | 16 (+3)\u003cbr\u003eConstitution (CON) | 12 (+1)\u003cbr\u003eWisdom(WIS) | 10(+0)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003e- **Ideal for infiltration, distraction, and sensory manipulation.** Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e### **Movement:**\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e### **Abilities in Luma\u2019tik Form:**\u003cbr\u003e- **Refraction Veil:** While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- **Mirage Flicker (1\u002f[[Short Rest]]):** As a [[Bonus Action]], Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e- **Pulse of Dazzling Light (3\u002frest):** Emit a flash in a 10 m radius. Creatures must succeed on a DC (8 + [[Wisdom]] + [[Proficiency]]) Constitution saving throw or be **blinded** until the end of their next turn. Allies who avert their gaze are unaffected.\u003cbr\u003e    \u003cbr\u003e- **Glimmerjump:** \u003cbr\u003e- [[Reaction]]:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e### **Combat Stats:**\u003cbr\u003e- **Evasion:** 17\u003cbr\u003e    \u003cbr\u003e- **HP:** 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e### **Attacks:**\u003cbr\u003e- **Sparkbite:** Melee Weapon Attack, [[Dex]]+[[Proficiency]] to hit, 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 psychic damage.\u003cbr\u003e    \u003cbr\u003e- **Lightshard Dart:** Ranged Attack, [[Dex]]+[[Proficiency]] to hit, 1d6 radiant damage. On hit, target must make a DC (8 + [[Dex]] + [[Proficiency]]) Wisdom saving throw or have disadvantage on Perception checks for 1 minute.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e_Luma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians._\u003cbr\u003e---\u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1","","","Collectionfile \u003cbr\u003eAvatar Spirit Check\u003cbr\u003e\ud83c\udf0c Bridge of the Spirit: A Personal Journey\u003cbr\u003e\u003cbr\u003e\u003e \"To be the Avatar is not merely to bend all elements, but to bend one\u2019s self\u2014to align will and wisdom with the needs of the world.\"  \u003cbr\u003e\u003e \u2014 Grandmaster Shuyin of the White Lotus\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udded Reflecting on Your Journey\u003cbr\u003e\u003cbr\u003eEach character stands at a crossroads between spirit and self, and your progression in this campaign is deeply rooted in how your character emotionally and spiritually reacts to the events that unfold. Reflect on:\u003cbr\u003e\u003cbr\u003e- Have recent events hardened them? Are they acting with more recklessness, cruelty, or obsession to achieve their goals\u2014driven by trauma or ambition?\u003cbr\u003e    \u003cbr\u003e- Or have they found inner balance, perhaps discovering a renewed sense of duty or compassion, and beginning to understand the role of a bridge between the mortal and spiritual worlds?\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThis reflection influences your na and will guide what type of power you unlock next.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Paths of Power\u003cbr\u003e\u003cbr\u003eWhen your character increases their Bridge Level, they may choose one of the following paths, shaped by how they have grown:\u003cbr\u003e\u003cbr\u003eChaotic Awakening\u003cbr\u003e\u003cbr\u003eFor those who pursue strength, vengeance, or control without regard for balance. Unlock a new bending slot in an element already known (but not your origin element).  \u003cbr\u003eExample: A waterbender who has learned firebending may now gain a second firebending move.\u003cbr\u003e\u003cbr\u003eHarmonic Enlightenment\u003cbr\u003e\u003cbr\u003eFor those who embrace their role as a bridge between worlds. Unlock a new bending element, representing spiritual expansion and Avatar-like growth.  \u003cbr\u003eExample: An earthbender may now begin learning airbending.  \u003cbr\u003eAdditionally, you may gain access to rare spiritual techniques (GM approval), such as Spirit-Bending, Healing Flames, Echobending, etc., reflecting your evolving balance and connection to the Avatar Spirit.\u003cbr\u003e\u003cbr\u003e\u003e Choose based on your character's emotional and spiritual arc. This is about what kind of person they are becoming, not just what powers they can gain.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc8e Spirit Stones\u003cbr\u003e\u003cbr\u003eScattered throughout the world are rare, luminous Spirit Stones, ancient relics humming with resonance from the Spirit World. Each stone can be used in a ritual to unlock or increase a Bridge Level, drawing forth latent potential within the bender\u2019s soul.\u003cbr\u003e\u003cbr\u003e- Your first Bridge Level was gained using one such stone in the initial ritual.\u003cbr\u003e    \u003cbr\u003e- These stones are rare and valuable, often hidden, protected, or born from significant spirit-world events.\u003cbr\u003e    \u003cbr\u003e- Some stones may resonate with specific emotions, elements, or spirits, and influence what type of power is awakened.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\u003e The ritual may vary depending on location, spirit presence, or celestial timing. Use of a stone should always involve narrative roleplay, reflection, and a meaningful choice.\u003cbr\u003e\u003cbr\u003eTrack stones and their effects in your Spirit Stone Log.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcca Bending Move Availability Table\u003cbr\u003e\u003cbr\u003eAvatar Spirit Bridge Level | Unlocked Move Level\u003cbr\u003e1 | Level 1\u003cbr\u003e2 | Level 1\u003cbr\u003e3 | Level 2\u003cbr\u003e4 | Level 2\u003cbr\u003e5 | Level 3\u003cbr\u003e6 | Level 3\u003cbr\u003e7 | Level 4\u003cbr\u003e8 | Level 4\u003cbr\u003e9 | Level 5\u003cbr\u003e10 | Level 5\u003cbr\u003e11 | Level 6\u003cbr\u003e12 | Level 6\u003cbr\u003e13 | Level 7\u003cbr\u003e14 | Level 7\u003cbr\u003e15 | Level 8\u003cbr\u003e16 | Level 8\u003cbr\u003e17 | Level 9\u003cbr\u003e18 | Level 9\u003cbr\u003e19 | Level 9\u003cbr\u003e20 | Level 9\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 How to Use This Table\u003cbr\u003e\u003cbr\u003e- On odd-numbered Bridge Levels, you gain access to new move tiers.\u003cbr\u003e    \u003cbr\u003e- On even-numbered Bridge Levels, you may select additional moves from existing unlocked tiers, but do not gain a new tier.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u2728 Next Steps\u003cbr\u003e\u003cbr\u003e- Reflect in your journal: where is your character now\u2014spiritually, emotionally, morally? Use the tag #spiritreflection.\u003cbr\u003e    \u003cbr\u003e- Record any discovered or used Spirit Stones in the Spirit Stone Log.\u003cbr\u003e    \u003cbr\u003e- Meet with the GM to finalize your chosen path: new slot in a known element (Chaotic Awakening) or a new bending element (Harmonic Enlightenment).\u003cbr\u003e    \u003cbr\u003e- Update your Character Sheet Template with any changes to bending capabilities.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTags:  \u003cbr\u003emechanics #spiritbridge #bending #characterprogression #Avatar #spiritstones #advancement\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Avatar Spirit Bridge Level --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u251c\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","Avatar Spirit Check\u003cbr\u003e\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003e\u003cbr\u003eRules & limits (assumptions \u2014 adjust with GM):\u003cbr\u003e\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003e\u003cbr\u003eExample:\u003cbr\u003e\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003e\u003cbr\u003eAvatar Spirit Bridge Level","Collectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003e\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003e\u003cbr\u003eCore contract:\u003cbr\u003e\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003e\u003cbr\u003eSample Moves\u003cbr\u003e\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003e\u003cbr\u003eDesign notes:\u003cbr\u003e\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003e\u003cbr\u003eSpiritbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","Collectionfile\u003cbr\u003e\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003e\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003e\u003cbr\u003eWhen to use:\u003cbr\u003e\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003e\u003cbr\u003eRisks:\u003cbr\u003e\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003e\u003cbr\u003eQuick references:\u003cbr\u003e\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u251c\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","","10 + Strength + Proficiency","Earthbending Moves Progression Table\u003cbr\u003e\u003cbr\u003eLevel | Accessible Slots | Total Moves (Newly Learned)\u003cbr\u003e1 | Level 1 | 1 Slot from Level 1\u003cbr\u003e2 | Level 1 | 2 Slots from Level 1\u003cbr\u003e3 | Level 1, Level 2 | 4 Slots (3 from Level 1, 1 from Level 2)\u003cbr\u003e4 | Level 1, Level 2 | 6 Slots (4 from Level 1, 2 from Level 2)\u003cbr\u003e5 | Level 1, Level 2, Level 3 | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)\u003cbr\u003e6 | Level 1, Level 2, Level 3 | 12 Slots (6 from Level 1, 4 from Level 2, 2 from Level 3)\u003cbr\u003e7 | Level 1, Level 2, Level 3, Level 4 | 16 Slots (7 from Level 1, 5 from Level 2, 3 from Level 3, 1 from Level 4)\u003cbr\u003e8 | Level 1, Level 2, Level 3, Level 4 | 20 Slots (8 from Level 1, 6 from Level 2, 4 from Level 3, 2 from Level 4)\u003cbr\u003e9 | Level 1, Level 2, Level 3, Level 4, Level 5 | 25 Slots (9 from Level 1, 7 from Level 2, 5 from Level 3, 3 from Level 4, 1 from Level 5)\u003cbr\u003e10 | Level 1, Level 2, Level 3, Level 4, Level 5 | 30 Slots (10 from Level 1, 8 from Level 2, 6 from Level 3, 4 from Level 4, 2 from Level 5)\u003cbr\u003e11 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6 | 36 Slots (11 from Level 1, 9 from Level 2, 7 from Level 3, 5 from Level 4, 3 from Level 5, 1 from Level 6)\u003cbr\u003e12 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6 | 42 Slots (12 from Level 1, 10 from Level 2, 8 from Level 3, 6 from Level 4, 4 from Level 5, 2 from Level 6)\u003cbr\u003e13 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7 | 49 Slots (13 from Level 1, 11 from Level 2, 9 from Level 3, 7 from Level 4, 5 from Level 5, 3 from Level 6, 1 from Level 7)\u003cbr\u003e14 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7 | 56 Slots (14 from Level 1, 12 from Level 2, 10 from Level 3, 8 from Level 4, 6 from Level 5, 4 from Level 6, 2 from Level 7)\u003cbr\u003e15 | Level 1 - Level 8 | 64 Slots (15 from Level 1, 13 from Level 2, 11 from Level 3, 9 from Level 4, 7 from Level 5, 5 from Level 6, 3 from Level 7, 1 from Level 8)\u003cbr\u003e16 | Level 1 - Level 8 | 72 Slots (16 from Level 1, 14 from Level 2, 12 from Level 3, 10 from Level 4, 8 from Level 5, 6 from Level 6, 4 from Level 7, 2 from Level 8)\u003cbr\u003e17 | Level 1 - Level 9 | 81 Slots (17 from Level 1, 15 from Level 2, 13 from Level 3, 11 from Level 4, 9 from Level 5, 7 from Level 6, 5 from Level 7, 3 from Level 8, 1 from Level 9)\u003cbr\u003e18 | Level 1 - Level 9 | 90 Slots (18 from Level 1, 16 from Level 2, 14 from Level 3, 12 from Level 4, 10 from Level 5, 8 from Level 6, 6 from Level 7, 4 from Level 8, 2 from Level 9)\u003cbr\u003e19 | Level 1 - Level 9 | 99 Slots (19 from Level 1, 17 from Level 2, 15 from Level 3, 13 from Level 4, 11 from Level 5, 9 from Level 6, 7 from Level 7, 5 from Level 8, 3 from Level 9)\u003cbr\u003e20 | Level 1 - Level 9 | 108 Slots (20 from Level 1, 18 from Level 2, 16 from Level 3, 14 from Level 4, 12 from Level 5, 10 from Level 6, 8 from Level 7, 6 from Level 8, 4 from Level 9)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eExplanation:\u003cbr\u003e\u003cbr\u003e1. Slots Increase Each Level: As characters level up, they gain slots to learn new moves, and the distribution of slots ensures steady growth and access to higher-level moves.\u003cbr\u003e2. Balanced Progression: Players gain slots evenly while progressively unlocking new levels at Levels 3, 5, 7, 9, 11, 13, 15, and 17.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending","Overview:\u003cbr\u003e\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability.","Earthbending rules\u003cbr\u003eEarthbending Slot\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending","","Core Attributes of Firebending\u003cbr\u003efirebending #coreattributes\u003cbr\u003e\u003cbr\u003e- Primary Stat: Wisdom\u003cbr\u003e  - Firebenders rely on their inner focus, discipline, and clarity to control their flames.\u003cbr\u003e\u003cbr\u003e- Key Mechanic: Lingering Damage\u003cbr\u003e  - Firebenders create residual damage zones where their fire strikes, representing burning or smoldering terrain.\u003cbr\u003e\u003cbr\u003e- Stress Level: Firebenders gain a stress level counter, starting at 0. Stress increases by 1 each time the firebender is hit by an attack. For every Stress Level the Firebender suffers -1 to attack and damage Rolls. At high levels, stress can be managed or turned into a weapon.\u003cbr\u003eFirebending","10 + Wisdom + Proficiency\u003cbr\u003eFirebending","Firebending Slots Progression Table\u003cbr\u003e\u003cbr\u003eLevel | Accessible Slots | Total Moves (Newly Learned)\u003cbr\u003e1 | Level 1 | 1 Slot from Level 1\u003cbr\u003e2 | Level 1 | 2 Slots from Level 1\u003cbr\u003e3 | Level 1, Level 2 | 4 Slots (3 from Level 1, 1 from Level 2)\u003cbr\u003e4 | Level 1, Level 2 | 6 Slots (4 from Level 1, 2 from Level 2)\u003cbr\u003e5 | Level 1, Level 2, Level 3 | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)\u003cbr\u003e6 | Level 1, Level 2, Level 3 | 12 Slots (6 from Level 1, 4 from Level 2, 2 from Level 3)\u003cbr\u003e7 | Level 1, Level 2, Level 3, Level 4 | 16 Slots (7 from Level 1, 5 from Level 2, 3 from Level 3, 1 from Level 4)\u003cbr\u003e8 | Level 1, Level 2, Level 3, Level 4 | 20 Slots (8 from Level 1, 6 from Level 2, 4 from Level 3, 2 from Level 4)\u003cbr\u003e9 | Level 1, Level 2, Level 3, Level 4, Level 5 | 25 Slots (9 from Level 1, 7 from Level 2, 5 from Level 3, 3 from Level 4, 1 from Level 5)\u003cbr\u003e10 | Level 1, Level 2, Level 3, Level 4, Level 5 | 30 Slots (10 from Level 1, 8 from Level 2, 6 from Level 3, 4 from Level 4, 2 from Level 5)\u003cbr\u003e11 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6 | 36 Slots (11 from Level 1, 9 from Level 2, 7 from Level 3, 5 from Level 4, 3 from Level 5, 1 from Level 6)\u003cbr\u003e12 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6 | 42 Slots (12 from Level 1, 10 from Level 2, 8 from Level 3, 6 from Level 4, 4 from Level 5, 2 from Level 6)\u003cbr\u003e13 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7 | 49 Slots (13 from Level 1, 11 from Level 2, 9 from Level 3, 7 from Level 4, 5 from Level 5, 3 from Level 6, 1 from Level 7)\u003cbr\u003e14 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7 | 56 Slots (14 from Level 1, 12 from Level 2, 10 from Level 3, 8 from Level 4, 6 from Level 5, 4 from Level 6, 2 from Level 7)\u003cbr\u003e15 | Level 1 - Level 8 | 64 Slots (15 from Level 1, 13 from Level 2, 11 from Level 3, 9 from Level 4, 7 from Level 5, 5 from Level 6, 3 from Level 7, 1 from Level 8)\u003cbr\u003e16 | Level 1 - Level 8 | 72 Slots (16 from Level 1, 14 from Level 2, 12 from Level 3, 10 from Level 4, 8 from Level 5, 6 from Level 6, 4 from Level 7, 2 from Level 8)\u003cbr\u003e17 | Level 1 - Level 9 | 81 Slots (17 from Level 1, 15 from Level 2, 13 from Level 3, 11 from Level 4, 9 from Level 5, 7 from Level 6, 5 from Level 7, 3 from Level 8, 1 from Level 9)\u003cbr\u003e18 | Level 1 - Level 9 | 90 Slots (18 from Level 1, 16 from Level 2, 14 from Level 3, 12 from Level 4, 10 from Level 5, 8 from Level 6, 6 from Level 7, 4 from Level 8, 2 from Level 9)\u003cbr\u003e19 | Level 1 - Level 9 | 99 Slots (19 from Level 1, 17 from Level 2, 15 from Level 3, 13 from Level 4, 11 from Level 5, 9 from Level 6, 7 from Level 7, 5 from Level 8, 3 from Level 9)\u003cbr\u003e20 | Level 1 - Level 9 | 108 Slots (20 from Level 1, 18 from Level 2, 16 from Level 3, 14 from Level 4, 12 from Level 5, 10 from Level 6, 8 from Level 7, 6 from Level 8, 4 from Level 9)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eExplanation:\u003cbr\u003e\u003cbr\u003e1. Slots Increase Each Level: As characters level up, they gain slots to learn new moves, and the distribution of slots ensures steady growth and access to higher-level moves.\u003cbr\u003e2. Balanced Progression: Players gain slots evenly while progressively unlocking new levels at Levels 3, 5, 7, 9, 11, 13, 15, and 17.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eFirebending\u003cbr\u003eFirebending","- Stress Level: Firebenders gain a stress level counter, starting at 0. Stress increases by 1 each time the firebender is hit by an attack. For every Stress Level the Firebender suffers -1 to attack Rolls but +1 to any damage. At high levels, stress can be managed or turned into a weapon. At the End of each of your Turn you can roll a Wisdom DC 20 - Stress Level. If successful the Stresslevel goes Down by 1. \u003cbr\u003eFirebending","Stress Management Moves\u003cbr\u003efirebending #stressmanagement\u003cbr\u003e\u003cbr\u003e- Level 1: Cool Down\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Reduce stress points by 2.\u003cbr\u003e  - Focus your inner fire to calm your mind and regain clarity.\u003cbr\u003e\u003cbr\u003e- Level 3: Rage Fuel (Secret Technique)\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Transform your stress penalty into a bonus. For every stress point, gain a +1 to accuracy and damage rolls for the duration. At the end of the effect, stress resets to 0.\u003cbr\u003e  - Unleash the power of your rage, turning your inner turmoil into devastating strength.\u003cbr\u003eFirebending","","","Collectionfile \u003cbr\u003eIf Concentration is not broken the Water Charges are refunded.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Cyclic Flow --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 graphs\u003cbr\u003e      \u2514\u2500\u2500 wikigraphtreemap.html\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u251c\u2500\u2500 Water Charges.md\u003cbr\u003e                  \u2514\u2500\u2500 Waterbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Healing Water.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 3 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Healing Mist.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","Water Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003eHow efficiently you use your Waterbottle  that you can carry with you.\u003cbr\u003eWaterbending Level | Waterbottle Water Charges\u003cbr\u003e1-4 | 1\u003cbr\u003e5-8 | 2\u003cbr\u003e9-12 | 3\u003cbr\u003e13-16 | 4\u003cbr\u003e17-20 | 5\u003cbr\u003eWaterbending\u003cbr\u003e \u003cbr\u003e- **Environmental Influence:**  \u003cbr\u003e    The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water.:\u003cbr\u003e    \u003cbr\u003e    - **Desert\u002fDry Area:** ~0 Water Charges (minimum water source).\u003cbr\u003e    - **Humid Area:** ~5-10 Water Charges.\u003cbr\u003e    - **Near Water Source (Lake, Ocean, etc.):** 15 Water Charges.\u003cbr\u003e    - **In Lake, Ocean, etc.:** ~50+ charges\u003cbr\u003e\t    \u003cbr\u003e- **Restoring Water Charges:**\u003cbr\u003e    \u003cbr\u003e    - **Skill Checks:** A waterbender can perform a skill check to draw water from their surroundings DC is determined by how dry the area is. Success restores Water Charges, depending on the environment.\u003cbr\u003e    - **Abilities:** Certain abilities allow Water Charges recovery or [[Cyclic Flow]].\u003cbr\u003e    \u003cbr\u003e[[Waterbending]]","10 + Int + Proficiency\u003cbr\u003eWaterbending","Your Waterbending Level.\u003cbr\u003eWaterbending","Overview:\u003cbr\u003e\u003cbr\u003eWaterbenders are versatile combatants who manipulate water, ice, and mist with fluid, adaptive techniques. Unlike other benders, they rely on a resource called Water Charges to perform bending abilities. Their style focuses on redirection, control, and adaptability, drawing power from their environment.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCore Mechanics:\u003cbr\u003e\u003cbr\u003e1. Redirection Mechanic:\u003cbr\u003e\u003cbr\u003eWaterbenders excel at using their enemies\u2019 attacks against them. This mechanic reflects their unique style.\u003cbr\u003e\u003cbr\u003eAs a Reaction when hit by ranged physical attack.\u003cbr\u003e- Counter-Redirect physical:\u003cbr\u003e    - Cost: 1 Water Charge per 1d10 Damage redirected.\u003cbr\u003e    - When targeted by a ranged physical attack, the Waterbender can redirect it back to the attacker or a different target. This attack has the same range as the initial attack. If you reduce the damage you take to 0 you get back all used Watercharges.\u003cbr\u003e    - Redirected attacks deal half damage.\u003cbr\u003e\u003cbr\u003eAs a Reaction when hit by a physical melee attack\u003cbr\u003e- Parry:\u003cbr\u003e    - Cost: 1 Water Charge per 1d6 Damage parried.\u003cbr\u003e    - Reduce incoming physical melee damage by 1d6 + Dexterity modifier.\u003cbr\u003e    \u003cbr\u003eAs a Reaction when hit by a Waterbending Attack\u003cbr\u003e-Counter Waterbending\u003cbr\u003e    - Cost: None.\u003cbr\u003e    - When targeted by a Waterbending attack, you can use their own Waterbending to reduce the Damage by 1d10 per Character Level.\u003cbr\u003e    - If the Damage is reduced to 0 you can use one of your own Waterbending attacks with the same (or less) Watercharges cost.\u003cbr\u003e\t\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMud bending costs more charges as it is harder to bend than pure water. (1.5)\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending","How efficiently you use your Waterbottle  that you can carry with you.\u003cbr\u003e\u003cbr\u003eWaterbending Level | Waterbottle Water Charges\u003cbr\u003e1-4 | 1\u003cbr\u003e5-8 | 2\u003cbr\u003e9-12 | 3\u003cbr\u003e13-16 | 4\u003cbr\u003e17-20 | 5\u003cbr\u003e\u003cbr\u003eWaterbending","","Chi Blocking Rules\u003cbr\u003e\u003cbr\u003eChi Blocking is a specialized combat style that relies on targeting an opponent's pressure points to immobilize them or impede their bending abilities. \u003cbr\u003eChi Blockers are adept at neutralizing threats without requiring bending.\u003cbr\u003e\u003cbr\u003eCore Features\u003cbr\u003e- Pressure Point Strikes: Disable bending or other abilities temporarily.\u003cbr\u003e- Energy Points: Manage energy to execute powerful moves.\u003cbr\u003e- Evasion and Defense: Increased agility and defensive techniques.","","The creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action or can remove it with your bending more efficiently.","Paralysis Mechanics\u003cbr\u003e\u003cbr\u003eCertain Chi Blocking moves cause paralysis, preventing the target from taking actions or bending for a specified duration.\u003cbr\u003e\u003cbr\u003eKey Moves\u003cbr\u003e- Pressure Point Strike\u003cbr\u003e- Nerve Strike","A slowed creatures Movement Speed is halved and it can not use any #Bonusactions or #reactions. ( #Action is allowed)","","","Grants Damage reduction. \u003cbr\u003e\u003cbr\u003eGeneral Armor reduces all Damage Types in addition to their specific type Armor (other than spiritual). \u003cbr\u003e\u003cbr\u003ePhysical Armor reduces all Piercing Slashing and bludgeoning Damage.\u003cbr\u003e\u003cbr\u003eBarrier Armor Whenever you suffer unblocked damage Barrier Armor halves","Barrier Armor Whenever you suffer unblocked damage Barrier Armor halves (rounded down)\u003cbr\u003eFor example when you have 15 Barrier Armor and suffer 18 damage you suffer 3 Damage and Barrier Armour halves to 7.","Collectionfile \u003cbr\u003e\u003cbr\u003eCharacter Level. This will be important to scale moves.\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:CL --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u251c\u2500\u2500 PCs\u003cbr\u003e          \u2514\u2500\u2500 Mahogany\u003cbr\u003e              \u2514\u2500\u2500 Transformation Points.md\u003cbr\u003e      \u2514\u2500\u2500 Rules\ ots Increase Each Level: As characters level up, they gain slots to learn new moves, and the distribution of slots ensures steady growth and access to higher-level moves.\u003cbr\u003e2. Balanced Progression: Players gain slots evenly while progressively unlocking new levels at Levels 3, 5, 7, 9, 11, 13, 15, and 17.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending\u003cbr\u003eAirbending","Move or disperse most Lingering Damage effects\u003cbr\u003eAirbending","Movement per Round:\u003cbr\u003e10 meters + Airbending Level  3\u003cbr\u003e \u003cbr\u003eMany Airbending techniques can boost movement\u003cbr\u003e[[Airbending]]","","Avatar Spirit Check\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003eRules & limits (assumptions \u2014 adjust with GM):\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003eExample:\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCollectionfile\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003eWhen to use:\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003eRisks:\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003eQuick references:\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003eTeam-up Moves\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u251c\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Collectionfile\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003eWhen to use:\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003eRisks:\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003eQuick references:\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003eTeam-up Moves\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u251c\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Avatar Spirit Check\u003cbr\u003eRoll a d20 as part of a spirit-focused ritual or when prompted by the GM (typically at key story beats or after using a Spirit Stone).\u003cbr\u003e- If the roll is even: you gain a number of temporary Spiritbending spellslots equal to the d20 result. These slots last until the end of the current scene or until spent, whichever comes first.\u003cbr\u003e- If the roll is odd: you do not gain slots, but you receive one Spirit Echo \u2014 a small, narratively useful boon (example: advantage on one Spiritbending check, a single short vision providing a clue, or temporary insight on a spirit's motive). The GM chooses the precise echo based on context.\u003cbr\u003eRules & limits (assumptions \u2014 adjust with GM):\u003cbr\u003e- Maximum gained slots cannot exceed the character's Bridge Level (or another GM-set cap).\u003cbr\u003e- This check is usually available once per long rest unless a Spirit Stone or special ritual grants repeated checks.\u003cbr\u003e- Spirit slots gained are of the lowest available Spiritbending tier and must be used for Spiritbending moves or effects.\u003cbr\u003eExample:\u003cbr\u003e- You roll a d20 and get 14 (even). You gain 14 temporary Spiritbending spellslots (subject to the GM cap). You spend 2 of them to cast a Spirit Ward and keep the rest until the end of the scene.\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCollectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003eCore contract:\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003eSample Moves\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003eDesign notes:\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003eSpiritbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","Collectionfile\u003cbr\u003e\u003cbr\u003eSpiritbending represents techniques and rituals that draw on the Avatar Spirit or local spirit presences. These moves often focus on communication, protection, travel between worlds, and subtle influence rather than raw damage.\u003cbr\u003e\u003cbr\u003eHow it works (tiny contract):\u003cbr\u003e\u003cbr\u003e- Resource: Spiritbending slots. These come from your Bridge Level, Spirit Stones, and occasional Avatar Spirit Checks.\u003cbr\u003e- Use: Spend slots to cast Spiritbending moves (see Spiritbending Moves.md).\u003cbr\u003e- Limits: The GM may cap maximum temporary slots gained from checks or stones to preserve balance.\u003cbr\u003e\u003cbr\u003eWhen to use:\u003cbr\u003e\u003cbr\u003e- During rituals, when interacting with spirits, when entering spirit-touched locations, or as part of major story beats involving the Avatar Spirit.\u003cbr\u003e\u003cbr\u003eRisks:\u003cbr\u003e\u003cbr\u003e- Spiritbending can attract attention from powerful spirits. Overuse or reckless bargaining may cause hauntings, covenants, or spirit debt.\u003cbr\u003e\u003cbr\u003eQuick references:\u003cbr\u003e\u003cbr\u003e- Moves and examples: Spiritbending Moves\u003cbr\u003e- Mechanics for gaining slots: Avatar Spirit Check\u003cbr\u003e- Progression and Bridge mechanics: Avatar Spirit Bridge Level\u003cbr\u003e\u003cbr\u003eTeam-up Moves\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u251c\u2500\u2500 Avatar Spirit Check.md\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","","","Glassfruit Team-Up Techniques \u003cbr\u003e\u003cbr\u003eX = yz\u003cbr\u003e\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e \u003cbr\u003e\u003e - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e\u003e     \u003cbr\u003e\u003e - Firebender contributes 3 (z = 3)\u003cbr\u003e\u003e     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd34 Inferno Bloom (Red Flamegrape)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e A cluster of buried Flame-glass shards detonates in a chain Reaction.\u003cbr\u003e\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e- Radius: 2  meter  X\u003cbr\u003e    \u003cbr\u003e- Lingering Effect\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udca8Resonant Collapse (Blue Soundbanana)\u003cbr\u003eMust be initiated by a Airbender in line of sight \u003cbr\u003e\u003cbr\u003e\u003e A soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e\u003cbr\u003e- Effect: Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e    \u003cbr\u003e- Secondary: Earth terrain in the zone becomes difficult terrain\u003cbr\u003e    \u003cbr\u003e- Radius:  2X meter\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 12, causes localized landslide or ceiling collapse in enclosed space\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Clear out guards, knock down spirit constructs\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd35 BlueBerry Glass Surge\u003cbr\u003eMust be initiated by a Waterbender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e  Stick and grow trapping enemies and reshaping the terrain.\u003cbr\u003e\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Dex save to jump aside or  get Immobilised in cold soft and barely liquid Glass.\u003cbr\u003e    \u003cbr\u003e- Radius: X  2\u003cbr\u003e    \u003cbr\u003e- Duration:  X minutes but trapped creatures can as an Action make a strength saving throws to break out with the same DC - Rounds since getting trapped\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 8, brambles regenerate once if destroyed\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Reshape battlefield, trap beasts or enemy squads\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udfe1 FlashLemon Refractor Beam \u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e Focused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003eRange:  10  X meter cone\u003cbr\u003e- Bonus: Deal Xd8 radiant damage to one target hit directly\u003cbr\u003e    \u003cbr\u003e- Lasting Effect: All affected enemies suffer disadvantage on perception for 4 turns\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 10, the Focused damage is doubled \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u26aa Soulseed Harmonic Seal (Clear Soulseed)\u003cbr\u003eMust be initiated by another Earthbender in line of sight\u003cbr\u003e\u003e A ritual resonance of GlassSeeds pressed on the Ground around the earthbenders \u003cbr\u003e   Concentration for both\u003cbr\u003e- Effect: As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e\u003cbr\u003e- Radius: within line of sight up to 100 meter\u003cbr\u003e    \u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 15, the seal becomes permanent unless shattered by spiritual corruption\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Close spirit portals, bind corrupted spirits, defend a holy site\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves","\ud83c\udf47 Origin: \u003cbr\u003e\u003cbr\u003eHigh on the outer cliffs of Omashu and the surrounding valley grow the rare Glassfruit Trees\u2014bizarre plants that draw heavy mineral content from the stone and soil, producing glass-like fruit with dense crystalline seeds. These seeds:\u003cbr\u003e\u003cbr\u003e- Grow in five known varieties, each with distinct elemental-reactive properties.\u003cbr\u003e    \u003cbr\u003e- Can be manipulated by Earthbenders with precise control, refined through spiritual discipline.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLocal legend says the Earth Lion Turtle left these trees here, believing their presence would help the people grow with stone, not just build from it.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ePracticed by: Earthbenders of Omashu, the secretive Order of the Glassfruit  \u003cbr\u003eCore Techniques:\u003cbr\u003e\u003cbr\u003eGlassbenders use Glassfruit Seeds as the basis of their fighting and crafting style. Unlike traditional Earthbending, this form is:\u003cbr\u003e\u003cbr\u003e- Finer, with smaller, more precise motions than usual Earthbending .\u003cbr\u003e    \u003cbr\u003e- Often done with bare hands or finger movements, not stances.\u003cbr\u003e    \u003cbr\u003e- Focused on resonance, fracturing, refraction, and vibrational manipulation.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf08 The Five Seeds of the Glassfruit:\u003cbr\u003e\u003cbr\u003eEach seed color has unique applications:\u003cbr\u003e\u003cbr\u003e1. Red Flameglass\u003cbr\u003e    \u003cbr\u003e    - Slightly combustible. Ignites under pressure or heat.\u003cbr\u003e        \u003cbr\u003e    - Used in explosive traps, ignited whips, or forged blades.\u003cbr\u003e        \u003cbr\u003e    - Enhanced by Firebenders.\u003cbr\u003e        \u003cbr\u003e2. Blue Soundstone\u003cbr\u003e    \u003cbr\u003e    - Vibrates and hums when bent.\u003cbr\u003e        \u003cbr\u003e    - Used in sound manipulation, echolocation, sonic shockwaves.\u003cbr\u003e        \u003cbr\u003e    - Enhanced by Airbenders.\u003cbr\u003e        \u003cbr\u003e3. Green Bramblecrystal\u003cbr\u003e    \u003cbr\u003e    - Fractal growth pattern. Rapidly expands under water or chi.\u003cbr\u003e        \u003cbr\u003e    - Used for entrapment, growing crystal armor, or climbing gear.\u003cbr\u003e        \u003cbr\u003e    - Enhanced by Waterbenders.\u003cbr\u003e        \u003cbr\u003e4. Yellow Flashcore\u003cbr\u003e    \u003cbr\u003e    - Emits blinding pulses under friction or chi stimulation.\u003cbr\u003e        \u003cbr\u003e    - Used in stunning bursts, signal flares, or reflective barriers.\u003cbr\u003e        \u003cbr\u003e    - Enhanced by Light-reflective surfaces or Sun Chi.\u003cbr\u003e        \u003cbr\u003e5. Clear Soulseed\u003cbr\u003e    \u003cbr\u003e    - Rare. Used for resonance harmonization and spiritual bending.\u003cbr\u003e        \u003cbr\u003e    - Used in rituals, spirit communication, and healing constructs.\u003cbr\u003e        \u003cbr\u003e    - Only effective when paired with a Resonance Stone.\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 The Crystalbenders\u003cbr\u003e\u003cbr\u003eA secret sect called the Order of the Crystalfang lives beneath Omashu\u2019s outer wall in vast, glass-tiled tunnels. They are:\u003cbr\u003e\u003cbr\u003e- A multibender alliance: Earthbenders, Firebenders, Airbenders working in tandem.\u003cbr\u003e    \u003cbr\u003e- Focused on refining Glassfruit Seeds into glass weapons, armor, instruments, and ritual relics.\u003cbr\u003e    \u003cbr\u003e- Trained in team bending maneuvers, using Fire to heat and shape, Air to cool and vibrate, and Earth to control and fracture.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThey believe the art of Glassbending is a gift of the Lion Turtle, and they worship a large Resonance Stone known as:\u003cbr\u003e\u003cbr\u003e\u003e \u201cThe Heart of Clarity\u201d\u003cbr\u003e\u003cbr\u003eThis Relic is deeply attuned to spirit energy and plays tones that only Crystalfangs can interpret. Some say it sings when the right soul is nearby.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Resonance Stone & the Party:\u003cbr\u003e\u003cbr\u003eThe Heart of Clarity is actually one of several Resonance Stones\u2014ancient spiritual relics tied to the slumbering Lion Turtle.\u003cbr\u003e\u003cbr\u003eThe party must obtain or attune to it to:\u003cbr\u003e\u003cbr\u003e- Unlock advanced spiritual techniques.\u003cbr\u003e    \u003cbr\u003e- Amplify their elemental abilities in resonance with the world.\u003cbr\u003e    \u003cbr\u003e- Possibly awaken latent powers or allow inter-elemental harmony.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Hooks:\u003cbr\u003e\u003cbr\u003e- A Crystalfang initiate seeks the party's help after the Heart of Clarity goes silent for the first time in generations.\u003cbr\u003e    \u003cbr\u003e- The Order is being manipulated by a rogue faction of Stonebloods who want to use the Resonance Stone to awaken the Lion Turtle.\u003cbr\u003e    \u003cbr\u003e- Spirit-corrupted Glassfruit trees begin growing in unnatural ways\u2014hinting at a breach from the Spirit World.","","","","","Agni Kai Style\u003cbr\u003efirebending #style #agnikai\u003cbr\u003e\u003cbr\u003e- Duels emphasize precision and dominance.\u003cbr\u003e- Move: Burning Duel\u003cbr\u003e  - Action: Choose a single target and engage them in a duel. Both you and the
