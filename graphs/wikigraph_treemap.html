ot large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand....","","DMPCs\u003cbr\u003eLotus...","","","","- Session 1 The Spirit Within\u003cbr\u003e- The Lotus Fractures...","- The Spirit Gauge\u2019s Purpose\u003cbr\u003e- Betrayals and Deceptions...","- The Avatar\u2019s Legacy\u003cbr\u003e- The Final Confrontation...","Title: Shattered Spirit, Rising Lotus\u003cbr\u003e- The Ceremony of the Lotus...","The Lotus\u003cbr\u003e- Home of the ceremony and spiritual hub....","Act 1: Unveiling the Threat\u003cbr\u003e- PCs discover they hold fragmented aspects of the Avatar Spirit....","1. Balance vs. Independence:\u003cbr\u003eExplores centralized power vs. collective leadership....","Scene Setting:\u003cbr\u003eThe campaign begins at the serene Temple of the The Lotus, where benders from across the world gather for the annual Ceremony of the Lotus....","Story\u003cbr\u003eLinks:...","","","","Organisations\u003cbr\u003eOverview:...","","Marjorie TBA","","\u00a71 This is all fun and games.\u003cbr\u003e\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs....","Defensive:\u003cbr\u003eMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance....","How hard it is to hit you.\u003cbr\u003eBase Evasion: 10 + Dex","PROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:...","","Glacial Temple\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground...","Properties:\u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated....","Form: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.\u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes....","Location: Southern Water Tribe tundra, near the Glacial Temple\u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round...","","Type: Water Tribe Island Village\u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves...","","The shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e\u003e \"There was\u2026 someone who always believed. The High Priest. Master Anzu....","","\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements....","Location: Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\u003cbr\u003eSituation:...","Baezu \u2013 Earthbender Master of Resonance\u003cbr\u003eRole: Boss \u2013 Controller, Support, Spiritual Conduit...","Plothook\u003cbr\u003eLocation: Omashu...","","City of Murmura\u003cbr\u003eTags: #PatolaMountainRange #Murmura #Airbending #Monastery...","City of Zephyros\u003cbr\u003eTags: #PatolaMountainRange #Zephyros #Airbending #Monastery...","Earmur\u003cbr\u003eTags: #PatolaMountainRange #Fauna #Soundbending...","","Overview:\u003cbr\u003eTwin siblings from Sekan\u2019to whose seamless coordination has turned their unique dual-element fusion into an art form. They\u2019re local legends among younger benders and are being  the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability....","Earthbending rules\u003cbr\u003eEarthbending Slot...","","Core Attributes of Firebending\u003cbr\u003efirebending #coreattributes...","10 + Wisdom + Proficiency\u003cbr\u003eFirebending","Firebending Slots Progression Table\u003cbr\u003e| Level | Accessible Slots                                          | Total Moves (Newly Learned)                                                                                                                                  |...","- Stress Level: Firebenders gain a stress level counter, starting at 0. Stress increases by 1 each time the firebender is hit by an attack. For every Stress Level the Firebender suffers -1 to attack Rolls but +1 to any damage. At high levels, stress can be managed or turned into a weapon. At the End of each of your Turn you can roll a Wisdom DC 20 - Stress Level. If successful the Stresslevel goes Down by 1.\u003cbr\u003eFirebending","Stress Management Moves\u003cbr\u003efirebending #stressmanagement...","","","Collectionfile\u003cbr\u003eIf Concentration is not broken the Water Charges are refunded....","Water Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003eWaterbottle Water Charges...","10 + Int + Proficiency\u003cbr\u003eWaterbending","Your Waterbending Level.\u003cbr\u003eWaterbending","Overview:\u003cbr\u003eWaterbenders are versatile combatants who manipulate water, ice, and mist with fluid, adaptive techniques. Unlike other benders, they rely on a resource called Water Charges to perform bending abilities. Their style focuses on redirection, control, and adaptability, drawing power from their environment....","How efficiently you use your Waterbottle  that you can carry with you.\u003cbr\u003e| Waterbending Level | Waterbottle Water Charges |...","","Chi Blocking Rules\u003cbr\u003eChi Blocking is a specialized combat style that relies on targeting an opponent's pressure points to immobilize them or impede their bending abilities....","","The creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action or can remove it with your bending more efficiently.","Paralysis Mechanics\u003cbr\u003eCertain Chi Blocking moves cause paralysis, preventing the target from taking actions or bending for a specified duration....","A slowed creatures Movement Speed is halved and it can not use any #Bonusactions or #reactions. ( #Action is allowed)","","","Grants Damage reduction.\u003cbr\u003eGeneral Armor reduces all Damage Types in addition to their specific type Armor (other than spiritual)....","Barrier Armor Whenever you suffer unblocked damage Barrier Armor halves (rounded down)\u003cbr\u003eFor example when you have 15 Barrier Armor and suffer 18 damage you suffer 3 Damage and Barrier Armour halves to 7.","Collectionfile\u003cbr\u003eCharacter Level. This will be important to scale moves....","Charisma","","","Reduces All Damage Types other than Spiritual Damage.","Hitpoints\u003cbr\u003eWhen your HP reach 0 you are unconscious and bleeding out....","Very mandatory for living.\u003cbr\u003eMax Hitpoints...","Intelligence\u003cbr\u003eOne of the 6 Stats. Important for Waterbending Moves....","Auotoexplanatory.","You max Hitpoints are determined by your Level and Bending Type:\u003cbr\u003eEarth: 1d12 per CL...","","Collectionfile\u003cbr\u003e| CLRange | Proficiency Bonus |...","","Temporary Hitpoints are always used first and usually don't Stack but Situational exceptions.","","","Reaction\u003cbr\u003eRange: 3  Airbending Slot meters...","","10 + Dex + Proficiency\u003cbr\u003eAirbending","Your Airbending Level.","Airbendi fects can backfire or produce an unintended Spirit Echo.\u003cbr\u003eSample Moves\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003eDesign notes:\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003eSpiritbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","\u003c!-- No backlinks found --\u003e","\u003c!-- No backlinks found --\u003e","","","Type: Air Nomad Offshoot  \u003cbr\u003eLocation: Cliffside plateaus bordering th 3cbr\u003e\u003cbr\u003eThe Lotus is a venerable organization dedicated to the balance of the world, acting as spiritual guides and protectors of harmony. They host the annual Ceremony of the Resonance, symbolizing their commitment to unity among benders.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003c...","","Marjorie TBA","","\u00a71 This is all fun and games.\u003cbr\u003e\t\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs. \u003cbr\u003e\tSome people like the Characterbuilding and creating a personality and fleshed out character how they imagine it. Both are valid but it needs to be ...","Defensive:\u003cbr\u003e\tMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\u003cbr\u003e\tThe Damage types will be the same as in Dnd\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor","How hard it is to hit you. \u003cbr\u003eBase Evasion: 10 + Dex","PROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConditions to Join:\u003cbr\u003e\u003c...","","Glacial Temple\u003cbr\u003e\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground  \u003cbr\u003eArchitecture: A glimmering structure partially embedded in ice, with prayer flags fluttering around open, steam-warmed courtyards.\u003cbr\u003e\u003cbr\u003eLore:  \u003cbr\u003eBuilt above the Healing Spring of Akara, the Glacial Temple is ...","Properties:  \u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated.\u003cbr\u003e\u003cbr\u003eLimits:\u003cbr\u003e\u003cbr\u003e- On...","Form: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.  \u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. Wh...","Location: Southern Water Tribe tundra, near the Glacial Temple  \u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round  \u003cbr\u003eNotable Feature: The Healing Spring of Akara, which emits a continuous healing mist due to the presence of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003eDescription:  \u003cbr\u003eAkar...","","Type: Water Tribe Island Village  \u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves  \u003cbr\u003eAffinity: Waterbending, Spirits\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eKugluktup is a secretive and remote waterbending village located on a rugged island surrounded by turbulent seas. It lies...","","The shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e\u003cbr\u003e\u003e \"There was\u2026 someone who always believed. The High Priest. Master Anzu.  \u003cbr\u003e\u003e He was banish...","","\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements. \u003cbr\u003e\u003cbr\u003e\u003e A watermelon seed that needs to be watered to grow into a sphere of X meter radius that pushes everyone...","Location: Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\u003cbr\u003e\u003cbr\u003eSituation:  \u003cbr\u003eThe party seeks access to the Heart of Clarity (the ancient Resonance Stone), but they\u2019re intercepted by a Glassfang Vanguard Cell \u2014...","## Baezu \u2013 Earthbender Master of Resonance\u003cbr\u003e**Role:** Boss \u2013 Controller, Support, Spiritual Conduit  \u003cbr\u003e**Initiates:** \u26aa Soulseed Harmonic Seal, \ud83d\udfe2 BlueBerry Surge\u003cbr\u003e---\u003cbr\u003e### **Stats**\u003cbr\u003e- **HP:** 110\u003cbr\u003e    \u003cbr\u003e- **Armor:** 3\u003cbr\u003e    \u003cbr\u003e- **Earthbending Level:** 7\u003cbr\u003e    \u003cbr\u003e- **Speed:** Slow 4m\u003cbr\u003e    \u003cbr\u003e### **actions per Round:** 2 (Legendary Bender)\u003cbr\u003e---\u003cbr\u003e### **Abilities**\u003cbr\u003e#### \u25aa\ufe0f **Earth Anchor (Passive)**\u003cbr\u003eCannot be forcibly moved or knocked prone while touching stone. \u003cbr\u003eHas advantage on Concentration Checks\u003cbr\u003e#### \u25aa\ufe0f **Seismic Meditation ([[Bonus Action]])**\u003cbr\u003eRegain 1 bending slot if standing still for the round.\u003cbr\u003e---\u003cbr\u003e### **Techniques**\u003cbr\u003eGlassfruit Team-Up Techniques \u003cbr\u003eX = yz\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e \u003cbr\u003e\u003e - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e\u003e     \u003cbr\u003e\u003e - Firebender contributes 3 (z = 3)\u003cbr\u003e\u003e     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e---\u003cbr\u003e\ud83d\udd34 Inferno Bloom (Red Flamegrape)\u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003e A cluster of buried Flame-glass shards detonates in a chain Reaction.\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e- Radius: 2  meter  X\u003cbr\u003e    \u003cbr\u003e- Lingering Effect\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udca8Resonant Collapse (Blue Soundbanana)\u003cbr\u003eMust be initiated by a Airbender in line of sight \u003cbr\u003e\u003e A soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e- Effect: Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e    \u003cbr\u003e- Secondary: Earth terrain in the zone becomes difficult terrain\u003cbr\u003e    \u003cbr\u003e- Radius:  2X meter\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 12, causes localized landslide or ceiling collapse in enclosed space\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Clear out guards, knock down spirit constructs\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udd35 BlueBerry Glass Surge\u003cbr\u003eMust be initiated by a Waterbender in line of sight\u003cbr\u003e\u003e  Stick and grow trapping enemies and reshaping the terrain.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Dex save to jump aside or  get Immobilised in cold soft and barely liquid Glass.\u003cbr\u003e    \u003cbr\u003e- Radius: X  2\u003cbr\u003e    \u003cbr\u003e- Duration:  X minutes but trapped creatures can as an Action make a strength saving throws to break out with the same DC - Rounds since getting trapped\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 8, brambles regenerate once if destroyed\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Reshape battlefield, trap beasts or enemy squads\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udfe1 FlashLemon Refractor Beam \u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003e Focused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003eRange:  10  X meter cone\u003cbr\u003e- Bonus: Deal Xd8 radiant damage to one target hit directly\u003cbr\u003e    \u003cbr\u003e- Lasting Effect: All affected enemies suffer disadvantage on perception for 4 turns\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 10, the Focused damage is doubled \u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\u26aa Soulseed Harmonic Seal (Clear Soulseed)\u003cbr\u003eMust be initiated by another Earthbender in line of sight\u003cbr\u003e\u003e A ritual resonance of GlassSeeds pressed on the Ground around the earthbenders \u003cbr\u003e   Concentration for both\u003cbr\u003e- Effect: As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e- Radius: within line of sight up to 100 meter\u003cbr\u003e    \u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 15, the seal becomes permanent unless shattered by spiritual corruption\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Close spirit portals, bind corrupted spirits, defend a holy site\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves\u003cbr\u003e    \u003cbr\u003e#### \u270b **Harmonic Command (Support)**\u003cbr\u003e[[Bonus Action]]: another Crystalfang bender may immediately act using 1 technique as a **[[Reaction]]**\u003cbr\u003e---\u003cbr\u003e## \ud83d\udd25 Siroh \u2013 Firebender Glassforger\u003cbr\u003e**Role:** Blaster, AoE Control  \u003cbr\u003e**Initiates:** \ud83d\udd34 Inferno Bloom, \ud83d\udfe1 FlashLemon Beam\u003cbr\u003e---\u003cbr\u003e### **Stats**\u003cbr\u003e- **HP:** 60\u003cbr\u003e    \u003cbr\u003e- **Armor:** 1\u003cbr\u003e    \u003cbr\u003e- **Chi Slots:** 4\u003cbr\u003e    \u003cbr\u003e- **Speed:** Normal\u003cbr\u003e    \u003cbr\u003e- **Weaknesses:** Cold, Waterbending\u003cbr\u003e    \u003cbr\u003e### **Bending Slots:** 3\u003cbr\u003e### **actions per Round:** 1\u003cbr\u003e---\u003cbr\u003e### **Abilities**\u003cbr\u003e#### \u25aa\ufe0f **Overheat Spark (Passive)**\u003cbr\u003eWhen using a Fire-based team-up, add +1 to total X\u003cbr\u003e#### \u25aa\ufe0f **Flashcore Mantle (1x\u002fday)**\u003cbr\u003eCreate a cloak of glowing crystals \u2013 gain resistance to radiant damage for 2 rounds\u003cbr\u003e---\u003cbr\u003e### **Techniques**\u003cbr\u003e#### \ud83d\udd34 **Inferno Bloom (X = y \u00d7 z)**\u003cbr\u003eInitiates with any bender\u003cbr\u003e- Explosive AoE, 2m \u00d7 X radius\u003cbr\u003e    \u003cbr\u003e- Damage: Xd6 bludgeoning + half fire\u003cbr\u003e    \u003cbr\u003e#### \ud83d\udfe1 **FlashLemon Refractor Beam (X = y \u00d7 z)**\u003cbr\u003eInitiates with Air or Earthbender\u003cbr\u003e- Cone: 10m \u00d7 X\u003cbr\u003e    \u003cbr\u003e- Blind + Xd8 radiant to primary target\u003cbr\u003e    \u003cbr\u003e- Enemies save INT vs DC X\u00d72\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e## \ud83d\udca8 Orhu \u2013 Airbender Harmonic Duelist\u003cbr\u003e**Role:** Support, Disruption  \u003cbr\u003e**Initiates:** \ud83d\udca8 Resonant Collapse, \ud83d\udfe1 FlashLemon Beam\u003cbr\u003e---\u003cbr\u003e### **Stats**\u003cbr\u003e- **HP:** 55\u003cbr\u003e    \u003cbr\u003e- **Armor:** 0\u003cbr\u003e    \u003cbr\u003e- **Chi Slots:** 3\u003cbr\u003e    \u003cbr\u003e- **Speed:** Fast (9m), ignores terrain\u003cbr\u003e    \u003cbr\u003e- **Weaknesses:** Slashing\u002fHeavy weapon attacks\u003cbr\u003e    \u003cbr\u003e### **Bending Slots:** 2\u003cbr\u003e### **actions per Round:** 1\u003cbr\u003e---\u003cbr\u003e### cbr\u003e    \u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e \u003cbr\u003e\u003e - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e\u003e     \u003cbr\u003e\u003e - Firebender contributes 3 (z = 3)\u003cbr\u003e\u003e     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e---\u003cbr\u003e\ud83d\udd34 Inferno Bloom (Red Flamegrape)\u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003e A cluster of buried Flame-glass shards detonates in a chain Reaction.\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e- Radius: 2  meter  X\u003cbr\u003e    \u003cbr\u003e- Lingering Effect\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udca8Resonant Collapse (Blue Soundbanana)\u003cbr\u003eMust be initiated by a Airbender in line of sight \u003cbr\u003e\u003e A soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e- Effect: Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e    \u003cbr\u003e- Secondary: Earth terrain in the zone becomes difficult terrain\u003cbr\u003e    \u003cbr\u003e- Radius:  2X meter\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 12, causes localized landslide or ceiling collapse in enclosed space\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Clear out guards, knock down spirit constructs\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udd35 BlueBerry Glass Surge\u003cbr\u003eMust be initiated by a Waterbender in line of sight\u003cbr\u003e\u003e  Stick and grow trapping enemies and reshaping the terrain.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Dex save to jump aside or  get Immobilised in cold soft and barely liquid Glass.\u003cbr\u003e    \u003cbr\u003e- Radius: X  2\u003cbr\u003e    \u003cbr\u003e- Duration:  X minutes but trapped creatures can as an Action make a strength saving throws to break out with the same DC - Rounds since getting trapped\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 8, brambles regenerate once if destroyed\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Reshape battlefield, trap beasts or enemy squads\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udfe1 FlashLemon Refractor Beam \u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003e Focused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003eRange:  10  X meter cone\u003cbr\u003e- Bonus: Deal Xd8 radiant damage to one target hit directly\u003cbr\u003e    \u003cbr\u003e- Lasting Effect: All affected enemies suffer disadvantage on perception for 4 turns\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 10, the Focused damage is doubled \u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\u26aa Soulseed Harmonic Seal (Clear Soulseed)\u003cbr\u003eMust be initiated by another Earthbender in line of sight\u003cbr\u003e\u003e A ritual resonance of GlassSeeds pressed on the Ground around the earthbenders \u003cbr\u003e   Concentration for both\u003cbr\u003e- Effect: As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e- Radius: within line of sight up to 100 meter\u003cbr\u003e    \u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 15, the seal becomes permanent unless shattered by spiritual corruption\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Close spirit portals, bind corrupted spirits, defend a holy site\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u ng one target\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eLingering Effect\u003cbr\u003eAction\u003cbr\u003e  - Range: 5  Firebending Slot meters. Sphere with a radius of Firebending Slot  1 meters.\u003cbr\u003e  - Damage: 2d6 fire per Firebending Slot.\u003cbr\u003e  - Save: Dex DC against your  Firebending DC \u003cbr\u003e  - Create a fiery explosion at a target point, affecting all creatures within a 10-foot radius.\u003cbr\u003eLingering Effect\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLingering Effect\u003cbr\u003e  - Range: 1  Firebending Slot meters.\u003cbr\u003e  - Damage: Firebending Slot 2d8 fire.\u003cbr\u003e  - Attack Roll: Wisdom + Proficiency.\u003cbr\u003e  - Release multiple smaller blasts of fire in quick succession, targeting up to three creatures within range.\u003cbr\u003eLingering Effect\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003efirebending #level3\u003cbr\u003e- Rage Fuel\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds. Concentration.\u003cbr\u003e  - Transform your stress penalty into a bonus. Gain +1 to accuracy and damage rolls for every stress point. At the end, stress resets to 0.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eScorching Aura\u003cbr\u003efirebending #level3\u003cbr\u003e- Scorching Aura\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Creatures within 5 feet of you take 1d6 fire damage at the start of their turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003e Level 4\u003cbr\u003e Concentration\u003cbr\u003e  - Range: 3  Firebending Slot meters radius centered on yourself. Moves with you and you are immune to its damage.\u003cbr\u003e  - Duration: Firebending Slot\u002f2 rounds. Concentration. \u003cbr\u003e  - Damage: Firebending Slot  2 d12 fire.\u003cbr\u003e  - Create a localized storm of fire in a 3  Firebending Slot meters radius, damaging all creatures within the area.\u003cbr\u003eConcentration\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eLightning Strike\u003cbr\u003efirebending #level4\u003cbr\u003e- Lightning Strike\u003cbr\u003e  - Action: 2 actions (Charge required).\u003cbr\u003e  - Range: 10  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: 4d10 lightning.\u003cbr\u003e  - Attack Roll: Wisdom + Proficiency.\u003cbr\u003e  - After charging for a round, unleash a bolt of lightning at a single target.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003e  Lingering Effect\u003cbr\u003e- Level 4\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: Firebending Slot  2 d12 fire.\u003cbr\u003e  - Summon a massive phoenix of fire that flies in a straight line within range, damaging all in its path.\u003cbr\u003eFirebending\u003cbr\u003eFirebending Slot\u003cbr\u003eFirebending DC\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eInfernal Form\u003cbr\u003efirebending #level5\u003cbr\u003e- Infernal Form\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 1 minute.\u003cbr\u003e  - Transform into a being of pure flame. Gain resistance to all non-magical damage and deal 2d8 fire damage to any creature that attacks you in melee.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eMeteor Shower\u003cbr\u003efirebending #level5\u003cbr\u003e- Meteor Shower\u003cbr\u003e  - Action: 2 actions.\u003cbr\u003e  - Range: 50  Firebending Slot meters.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Summon fiery meteors that fall in a 50-foot radius. Each round, creatures in the area must make Dexterity saving throws or take 4d6 fire damage.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eVolcanic Eruption\u003cbr\u003efirebending #level5\u003cbr\u003e- Volcanic Eruption\u003cbr\u003e  - Action: 1 Action.\u003cbr\u003e  - Range: 40  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: 6d10 fire.\u003cbr\u003e  - Create a massive eruption of molten rock and fire at a target point, affecting all creatures in a 30-foot radius.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eStress Management Moves\u003cbr\u003efirebending #stressmanagement\u003cbr\u003e- Level 1: Cool Down\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Reduce stress points by 2.\u003cbr\u003e  - Focus your inner fire to calm your mind and regain clarity.\u003cbr\u003e- Level 3: Rage Fuel (Secret Technique)\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Transform your stress penalty into a bonus. For every stress point, gain a +1 to accuracy and damage rolls for the duration. At the end of the effect, stress resets to 0.\u003cbr\u003e  - Unleash the power of your rage, turning your inner turmoil into devastating strength.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAgni Kai Style\u003cbr\u003efirebending #style #agnikai\u003cbr\u003e- Duels emphasize precision and dominance.\u003cbr\u003e- Move: Burning Duel\u003cbr\u003e  - Action: Choose a single target and engage them in a duel. Both you and the target gain +2 to attack rolls against each other until one is incapacitated.\u003cbr\u003e  - Lingering Effect: The ground around you is superheated; creatures entering the area take 1d6 fire damage.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eDancing Dragon Style\u003cbr\u003efirebending #style #dancingdragon\u003cbr\u003e- Focuses on fluid, continuous motion.\u003cbr\u003e- Move: Spiral Flames\u003cbr\u003e  - Action: Spin and release flames in a 360-degree arc. Creatures within 10 feet must make a Dexterity saving throw or take 2d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area smolders, imposing disadvantage on Dexterity saving throws for creatures within it until the start of your next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eExplosive Firebending\u003cbr\u003efirebending #style #explosive\u003cbr\u003e- Focuses on powerful area-of-effect attacks.\u003cbr\u003e- Move: Fireburst\u003cbr\u003e  - Action: Target a point within 30 feet. All creatures in a 10-foot radius must make a Dexterity saving throw or take 3d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area burns for 2 rounds, dealing 1d4 fire damage to creatures starting their turn there.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eLightning Generation\u003cbr\u003efirebending #style #lightning\u003cbr\u003e- Rare skill requiring intense focus.\u003cbr\u003e- Move: Lightning Strike\u003cbr\u003e  - Action: Spend 2 turns charging and unleash a precise bolt of lightning. One target within 60 feet must make a Constitution saving throw or take 4d10 lightning damage. On a successful save, they take half damage.\u003cbr\u003e  - Lingering Effect: None, but the charge must be used within the next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 3\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIcecubes (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 3m\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Creating Mist:\u003cbr\u003e- Cost: 1 Water Charge per 10 ft radius .\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 10 ft radius centered on self.\u003cbr\u003e    - Will grow 10 feet per round until full sized\u003cbr\u003e    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (10 feeet radius per Turn) or blown await by air.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eShape Water (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Range: 30 ft.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an Int ability check.\u003cbr\u003eLinks:\u003cbr\u003e- Shape Water\u003cbr\u003e- Rules\u003cbr\u003e- Int\u003cbr\u003e- Waterbending Moves\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCyclic Flow\u003cbr\u003eLevel 1\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable.\u003cbr\u003e    - Healing: 2d8 per charge + Int modifier at the beginning of your next Turn.\u003cbr\u003e    - Limitations: Cannot heal constructs or undead.\u003cbr\u003eCyclic Flow\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Range: 3  Water Charges meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender shoots a sharp, pressurized stream of water at a target.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: Water Charges d8 piercing or Water Charges d6 bludgeoning damage per Charge.\u003cbr\u003e    \u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Piercing Water\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eSlicing Water (1st Level Move)\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft cone.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender unleashes a slicing wave of water in a cone, dealing damage to multiple targets.\u003cbr\u003e    - Saving Throw: Targets make a Dexterity save (DC = 8 + Proficiency + Int mod).\u003cbr\u003e    - Damage: 1d6 slashing damage on a failed save, half on success.\u003cbr\u003eLinks:\u003cbr\u003e- Rules\u003cbr\u003e- Slicing Water\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWater Whip (Level 1 Ability)\u003cbr\u003e- Cost: 1 Water Charge.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Action: 1 Action.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender lashes out with a tendril of water, striking a target within range.\u003cbr\u003e    - Attack Roll: Intelligence + Proficiency Bonus.\u003cbr\u003e    - Damage: 1d8 + Int modifier bludgeoning damage.\u003cbr\u003e    - Special: The target must succeed on a Strength saving throw (DC 10 + Int modifier + Proficiency) or be knocked back 10 feet.\u003cbr\u003e    \u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Water Whip\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIce Daggers (2nd Level Move)\u003cbr\u003e- Cost: 1-2CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates sharp daggers of ice to hurl at targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency\u003cbr\u003e- Damage: 1d8 + Int modifier piercing damage per dagger (can create up to 2CL daggers).\u003cbr\u003eLinks:\u003cbr\u003e- CL\u003cbr\u003e- Proficiency\u003cbr\u003e- Ice Daggers\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWall of Water (2nd Level Move)\u003cbr\u003e- Cost: 3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a wall of water up to 30 ft long, 10 ft high, and 1 ft thick.\u003cbr\u003e    - Duration: Concentration, up to 1 minute.\u003cbr\u003e    - Effect: Provides partial cover and can extinguish flames.\u003cbr\u003eLinks:\u003cbr\u003e- Wall of water\u003cbr\u003eTags:\u003cbr\u003eWaterbendingx \u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWater Tentacles (2nd Level Move)\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender summons two water tentacles to attack or grapple targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: 1d10 bludgeoning damage per tentacle.\u003cbr\u003e    - Grapple: A creature hit by the tentacle must succeed on a Strength saving throw or be restrained.\u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Water Tentacles\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIce Wall (3rd Level Move)\u003cbr\u003e- Cost: 4 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a solid wall of ice, up to 30ft long 10 ft tall and 10 ft wide.\u003cbr\u003e    - HP: 30 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003eLinks:\u003cbr\u003e- Ice Wall\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 3- 2  CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 5 Meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    You create A number of Icicles equal to the used charges.\u003cbr\u003e\tThey swirl around the Target and grants them the Reaction to send any or all of the Ammunition against one target within 100 Meters of them until all Icicles are used.\u003cbr\u003e\tAmmunition:\u003cbr\u003e    - HP: 20 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Damage 5d12 + Int Piercing Damage\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eShockfreeze (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: The same as the Waterbending used as Action f\u003cbr\u003e- Effect:  \u003cbr\u003e    After using an Action to use a Waterbending Move that consumes water charges you can use your Bonus Action to let every creature hit by your Action roll a Strength Saving throw against your Waterbending DC or become Immobilised. \u003cbr\u003eLinks:\u003cbr\u003e- Shockfreeze\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eImmobilisation \u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eThe creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action or can remove it with your bending more efficiently.\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eA slowed creatures Movement Speed is halved and it can not use any #Bonusactions or #reactions. ( #Action is allowed)\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 2+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Effect:  \u003cbr\u003e    A Flick to the forehead to disrupt focus. Deals EPd4 + Dexterity and the target makes concentraion saves with disadvantage until the end of your next turn.\u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 3+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex + Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    A precise strike that deals no damage but if hit the Target must succeed a DC 10+Proficiency+EP Con Save or be Paralysed until the end of your next Turn. \u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 4 EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex+Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    Deliver a powerful blow that if hit restores 6 EP. The Target must succeed on a DC 10 + Proficiency + EP Con Save or become Slowed.\u003cbr\u003e    - Duration: 2 turns.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e---\u003cbr\u003eConditions to Join:\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e---\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e---\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an Ice Wall from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \u003cbr\u003e    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWiki_File_System_Manager.py\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","wikigraph_sunburst.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003ewikigraph_treemap.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eFlying Lemur Form\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e| Stat                       | Value |\u003cbr\u003e| ------------------------------ | --------- |\u003cbr\u003e| Strength (STR)     | 6 (-2)    |\u003cbr\u003e| Dexterity (DEX)    | 24(+7)    |\u003cbr\u003e| Constitution (CON) | 7 (-2)    |\u003cbr\u003e| Wisdom(WIS)            | 14(+2)    |\u003cbr\u003e| Intelligence(Int)      | 8(-1)     |\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e- Size: Small\u003cbr\u003e    \u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable).\u003cbr\u003e    - Climb 20 m (adapted to vertical movement).\u003cbr\u003e- Abilities in Flying Lemur Form:\u003cbr\u003e    - Silent Glide: Advantage on Stealth checks while flying.\u003cbr\u003e    - Acute Senses: Advantage on Perception checks that rely on sight or hearing.\u003cbr\u003e    - Quick Escape: Disengage or dash as a Bonus Action.\u003cbr\u003e- Combat Stats (Flying Lemur):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 20\u003cbr\u003e    - HP: 6 (fragile but evasive).\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Razor Claws: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 slashing damage.\u003cbr\u003e- Uses:  \u003cbr\u003e    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\u003cbr\u003eBending Slots:\u003cbr\u003e\tAir Lvl1: 4\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- Size: Small\u003cbr\u003e| Stat                       | Value   |\u003cbr\u003e| ------------------------------ | ----------- |\u003cbr\u003e| Strength (STR)     | 4 (-3)      |\u003cbr\u003e| Dexterity (DEX)    | 16 (+3) |\u003cbr\u003e| Constitution (CON) | 12 (+1)     |\u003cbr\u003e| Wisdom(WIS)            | 10(+0)      |\u003cbr\u003e| Intelligence(Int)      | 8(-1)       |\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eMovement:\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest): As a Bonus Action, Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e- Pulse of Dazzling Light (3\u002frest): Emit a flash in a 10 m radius. Creatures must succeed on a DC (8 + Wisdom + Proficiency) Constitution saving throw or be blinded until the end of their next turn. Allies who avert their gaze are unaffected.\u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eCombat Stats:\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAttacks:\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 psychic damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Dex+Proficiency to hit, 1d6 radiant damage. On hit, target must make a DC (8 + Dex + Proficiency) Wisdom saving throw or have disadvantage on Perception checks for 1 minute.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e---\u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eMovement\u003cbr\u003eLevel 1\u003cbr\u003e- Range: Self.\u003cbr\u003e- Duration: 1 Turn.\u003cbr\u003e- Enhance agility by propelling yourself with gusts of air.\u003cbr\u003eEffects:\u003cbr\u003e- Spend 1 Airbending Slot to add 5  Airbending Slot meters to your movement for this turn.\u003cbr\u003eTags:\u003cbr\u003eAirbending #Mobility\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eLevel 3\u003cbr\u003eConcentration\u003cbr\u003e- Range: 2  Airbending Slot Meter radius centered on yourself that moves with you.\u003cbr\u003e- Duration: Until the start of your next Turn.\u003cbr\u003e- Create a rotating shield of air to protect yourself or allies.\u003cbr\u003eEffects:\u003cbr\u003e- Spend  Airbending Slot. to create a protective barrier of swirling air.\u003cbr\u003e- The shield grants 5  Airbending Slot Evasion to all creatures within Range.\u003cbr\u003eLingering Effect:  All Ranged Attacks that enter or exit the are made with Disadvantage.\u003cbr\u003eEvasion\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eCantrip\u003cbr\u003e- Range: self and every creature within 1+ 1  Earthbending Slot meters of you\u003cbr\u003eEffect:\u003cbr\u003eTripping opponents with minor terrain manipulation. The target must succeed on a Dexterity saving throw against your Earthbending DC) or be knocked Prone.\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003e- Range: 3 Earthbending Slot Meters\u003cbr\u003e- Target: 1  Earthbending Slot  Enemies within range\u003cbr\u003eRevert Immobilisation through Ground Lock\u003cbr\u003eLinks:\u003cbr\u003e- Earthbending Slot\u003cbr\u003e- Proficiency\u003cbr\u003e- Ground Lock\u003cbr\u003e- Strength\u003cbr\u003e- Earthbending Moves\u003cbr\u003eTags:\u003cbr\u003eEarthbending #Mobility #Immobilisation\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eLevel 4\u003cbr\u003eConcentration\u003cbr\u003e- Bonus Action .\u003cbr\u003e- Range: Self\u003cbr\u003e- Duration: 3 round. Concentration\u003cbr\u003e- Surround yourself in a thick layer of Sand until the start of your next turn.\u003cbr\u003eEffect:\u003cbr\u003eProvides 2  Earthbending Slot  General Armor\u003cbr\u003eProvides 5 Earthbending Slot Physical Armor\u003cbr\u003eProvides 10  Earthbending Slot  Barrier Armor\u003cbr\u003e \u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Earthbending Slot\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCantrip Firebending Moves\u003cbr\u003efirebending #moves\u003cbr\u003e- Fire Blast\u003cbr\u003e- Flame Shield\u003cbr\u003e  - Reaction: Create a shield of fire, granting 2 Evasion against a single attack. If the attack is melee and misses, the attacker takes 1d8 fire damage.\u003cbr\u003e- Ignite Terrain\u003cbr\u003e  - Action: Set fire to a 1 meter radius sphere area of terrain within 20 feet. The fire lasts 3 rounds and deals 1d6 fire damage to creatures entering or starting their turn in the area.\u003cbr\u003e- Intimidating Flame\u003cbr\u003e  - Bonus Action: Manipulate your fire to intimidate nearby creatures. Targets within 2 Meter must make a Wisdom saving throw or become frightened until the end of your next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eLingering Effect\u003cbr\u003eLevel 2\u003cbr\u003e  - Range: 1 Firebending Slot meter Cone.\u003cbr\u003e  - Damage: 1  Firebending Slot d6 fire.\u003cbr\u003e  - Unleash a wide wave of flames, forcing creatures in the cone to make a Dexterity saving throw or take full damage.\u003cbr\u003eLingering Effect\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003efirebending #level3\u003cbr\u003e- Rage Fuel\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds. Concentration.\u003cbr\u003e  - Transform your stress penalty into a bonus. Gain +1 to accuracy and damage rolls for every stress point. At the end, stress resets to 0.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eScorching Aura\u003cbr\u003efirebending #level3\u003cbr\u003e- Scorching Aura\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Creatures within 5 feet of you take 1d6 fire damage at the start of their turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eInfernal Form\u003cbr\u003efirebending #level5\u003cbr\u003e- Infernal Form\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u0 003cbr\u003e    - \u003cbr\u003e- Combat Stats (Bearturtle):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 15\u003cbr\u003e    - \u003cbr\u003e    - Armor: \u003cbr\u003e\t    - 5 Physical Armor\u003cbr\u003e\t    - 3 General Armor\u003cbr\u003e    - HP: 28.\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Powerful Swipe: Melee Weapon Attack, +Strength to hit, 2d6 + Str slashing damage.\u003cbr\u003e\t- Shell Slam (AOE): All creatures within a 1 meter radius must make a Dexterity save DC17 or take 2d8 bludgeoning damage.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- Size: Small\u003cbr\u003e| Stat                       | Value   |\u003cbr\u003e| ------------------------------ | ----------- |\u003cbr\u003e| Strength (STR)     | 4 (-3)      |\u003cbr\u003e| Dexterity (DEX)    | 16 (+3) |\u003cbr\u003e| Constitution (CON) | 12 (+1)     |\u003cbr\u003e| Wisdom(WIS)            | 10(+0)      |\u003cbr\u003e| Intelligence(Int)      | 8(-1)       |\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eMovement:\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest): As a Bonus Action, Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e- Pulse of Dazzling Light (3\u002frest): Emit a flash in a 10 m radius. Creatures must succeed on a DC (8 + Wisdom + Proficiency) Constitution saving throw or be blinded until the end of their next turn. Allies who avert their gaze are unaffected.\u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eCombat Stats:\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAttacks:\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 psychic damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Dex+Proficiency to hit, 1d6 radiant damage. On hit, target must make a DC (8 + Dex + Proficiency) Wisdom saving throw or have disadvantage on Perception checks for 1 minute.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e---\u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eRange: 3  Airbending Slot meters\u003cbr\u003eEffect:\u003cbr\u003eArea control technique that lets you push 2  Airbending Slot Creatures within a radius 1  Airbending Slot meters.\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 5  Airbending Slot meters.\u003cbr\u003e- Duration: Instantaneous.\u003cbr\u003e- Damage: 1d6 bludgeoning per Airbending Slot.\u003cbr\u003e- Attack Roll: Dex + Proficiency.\u003cbr\u003e- Use airbending to send a blade of Air hurling at a creature within range\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: self and every creature within Earthbending Slot 1 Meters of you\u003cbr\u003e- Effect:  \u003cbr\u003e\t- Root yourself and every creature to resist forced movement.\u003cbr\u003e\t- Duration: 1 round.\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eLevel 2\u003cbr\u003e- Action: 1 #Reaction.\u003cbr\u003e- Range: 2 Earthbending Slot Meters\u003cbr\u003e- Duration: 1 round.\u003cbr\u003e- Summon a vortex of gravel  barrier that grants 10 Earthbending Slot Barrier Armor until the start of your next turn.\u003cbr\u003e- Target Earthbending Slot \u002f 3  Creatures \u003cbr\u003e-\u003cbr\u003e \u003cbr\u003eEffect: \u003cbr\u003eProvides 10  Earthbending Slot temporary Physical Armor.\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Stone Shield\u003cbr\u003e- Earthbending Slot\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eStone Shield\u003cbr\u003eLevel 2\u003cbr\u003e- Action: 1 #Reaction.\u003cbr\u003e- Range: 2 Earthbending Slot Meters\u003cbr\u003e- Du evel\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 3- 2  CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 5 Meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    You create A number of Icicles equal to the used charges.\u003cbr\u003e\tThey swirl around the Target and grants them the Reaction to send any or all of the Ammunition against one target within 100 Meters of them until all Icicles are used.\u003cbr\u003e\tAmmunition:\u003cbr\u003e    - HP: 20 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Damage 5d12 + Int Piercing Damage\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eOverview:\u003cbr\u003eWaterbenders are versatile combatants who manipulate water, ice, and mist with fluid, adaptive techniques. Unlike other benders, they rely on a resource called Water Charges to perform bending abilities. Their style focuses on redirection, control, and adaptability, drawing power from their environment.\u003cbr\u003e---\u003cbr\u003eCore Mechanics:\u003cbr\u003e1. Redirection Mechanic:\u003cbr\u003eWaterbenders excel at using their enemies\u2019 attacks against them. This mechanic reflects their unique style.\u003cbr\u003eAs a Reaction when hit by ranged physical attack.\u003cbr\u003e- Counter-Redirect physical:\u003cbr\u003e    - Cost: 1 Water Charge per 1d10 Damage redirected.\u003cbr\u003e    - When targeted by a ranged physical attack, the Waterbender can redirect it back to the attacker or a different target. This attack has the same range as the initial attack. If you reduce the damage you take to 0 you get back all used Watercharges.\u003cbr\u003e    - Redirected attacks deal half damage.\u003cbr\u003eAs a Reaction when hit by a physical melee attack\u003cbr\u003e- Parry:\u003cbr\u003e    - Cost: 1 Water Charge per 1d6 Damage parried.\u003cbr\u003e    - Reduce incoming physical melee damage by 1d6 + Dexterity modifier.\u003cbr\u003e    \u003cbr\u003eAs a Reaction when hit by a Waterbending Attack\u003cbr\u003e-Counter Waterbending\u003cbr\u003e    - Cost: None.\u003cbr\u003e    - When targeted by a Waterbending attack, you can use their own Waterbending to reduce the Damage by 1d10 per Character Level.\u003cbr\u003e    - If the Damage is reduced to 0 you can use one of your own Waterbending attacks with the same (or less) Watercharges cost.\u003cbr\u003e\t\u003cbr\u003e---\u003cbr\u003eMud bending costs more charges as it is harder to bend than pure water. (1.5)\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 1+ EP.\u003cbr\u003e- Type:  Reaction.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Effect:  \u003cbr\u003e    Jump by EP  2 Meter. Allows you to dodge bending attacks with ease.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 5 EP.\u003cbr\u003e- Type: Reaction.\u003cbr\u003e- Range: The original attacks range.\u003cbr\u003e- Effect:  \u003cbr\u003e    When in Melee range to an enemy performing a Bending Move. If they fail a DC 10+Proficiency+EP Dex Save you can redirect the opponent's bending energy back at them using the same bending Move. If they succeed by more than 5 they additionally get to use their Move.\u003cbr\u003e    If you steal a Move that requires concentration it is automatically broken instantly.\u003cbr\u003e    - Duration: Instant.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e---\u003cbr\u003eConditions to Join:\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e---\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e---\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an Ice Wall from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \u003cbr\u003e    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","wikigraphsunburst.html\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003ewikigraphtreemap.html\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eDanger Sense Reaction.\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 3  Airbending Slot meters.\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e- Push up to Airbending Slot  objects or creatures within Range away, up to Airbending Slot Meters ...","","wikigraph_sunburst.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003ewikigraph_treemap.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCollectionfile \u003cbr\u003eYou have Danger Sense Reactions per Turn scaling with your Airbending Level\u003cbr\u003e| Airbending Level | Danger Sense Reaction |\u003cbr\u003e| -------------------- | ------------------------- |\u003cbr\u003e| 1-4                  | 1                         |\u00 n attack. For every Stress Level the Firebender suffers -1 to attack and damage Rolls. At high levels, stress can be managed or turned into a weapon.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e10 + Wisdom + Proficiency\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCantrip Firebending Moves\u003cbr\u003efirebending #moves\u003cbr\u003e- Fire Blast\u003cbr\u003e- Flame Shield\u003cbr\u003e  - Reaction: Create a shield of fire, granting 2 Evasion against a single attack. If the attack is melee and misses, the attacker takes 1d8 fire damage.\u003cbr\u003e- Ignite Terrain\u003cbr\u003e  - Action: Set fire to a 1 meter radius sphere area of terrain within 20 feet. The fire lasts 3 rounds and deals 1d6 fire damage to creatures entering or starting their turn in the area.\u003cbr\u003e- Intimidating Flame\u003cbr\u003e  - Bonus Action: Manipulate your fire to intimidate nearby creatures. Targets within 2 Meter must make a Wisdom saving throw or become frightened until the end of your next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 3 Firebending Slot meters\u003cbr\u003e- Attack Roll: Wisdom+ Proficiency.\u003cbr\u003e- Damage: 1d6   Firebending Slot bludgeoning.\u003cbr\u003eEffect:\u003cbr\u003e- Shoot flames from your fists or kicks.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e  - Range: Melee\u003cbr\u003e  - Attack Roll: Attacks Firebending Slot times with Strength + Proficiency.\u003cbr\u003e  - Damage: 1d6 + Strength Bludgeoning + 1d12 fire\u003cbr\u003e  - Lingering Effect: This Effect moves with the creature. Therefore it cannot be moved put of but can be extinguished or nullified in other ways. \u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u00 ss resets to 0.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eScorching Aura\u003cbr\u003efirebending #level3\u003cbr\u003e- Scorching Aura\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Creatures within 5 feet of you take 1d6 fire damage at the start of their turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003e Level 4\u003cbr\u003e Concentration\u003cbr\u003e  - Range: 3  Firebending Slot meters radius centered on yourself. Moves with you and you are immune to its damage.\u003cbr\u003e  - Duration: Firebending Slot\u002f2 rounds. Concentration. \u003cbr\u003e  - Damage: Firebending Slot  2 d12 fire.\u003cbr\u003e  - Create a localized storm of fire in a 3  Firebending Slot meters radius, damaging all creatures within the area.\u003cbr\u003eConcentration\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eLightning Strike\u003cbr\u003efirebending #level4\u003cbr\u003e- Lightning Strike\u003cbr\u003e  - Action: 2 actions (Charge required).\u003cbr\u003e  - Range: 10  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: 4d10 lightning.\u003cbr\u003e  - Attack Roll: Wisdom + Proficiency.\u003cbr\u003e  - After charging for a round, unleash a bolt of lightning at a single target.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003e  Lingering Effect\u003cbr\u003e- Level 4\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: Firebending Slot  2 d12 fire.\u003cbr\u003e  - Summon a massive phoenix of fire that flies in a straight line within range, damaging all in its path.\u003cbr\u003eFirebending\u003cbr\u003eFirebending Slot\u003cbr\u003eFirebending DC\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u
