u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 3 \u00d7 CL (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAttacks:\u003cbr\u003e\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 psychic damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Dex+Proficiency to hit, 1d6 radiant damage. On hit, target must make a DC (8 + Dex + Proficiency) Wisdom saving throw or have disadvantage on Perception checks for 1 minute.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.","Tranformation Points cost: 2 Transformation Points\u003cbr\u003e\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 8 (-1)\u003cbr\u003eDexterity (DEX) | 14 (+2)\u003cbr\u003eConstitution (CON) | 12 (+1)\u003cbr\u003e\u003cbr\u003e- Size: Medium\u003cbr\u003e-  Ideal for scouting, hunting, and ambushing. The Sonar Earmur's sound-based abilities make it perfect for detecting enemies and disrupting plans, while its stealth and mobility allow it to evade retaliation effectively. Its combat abilities make it a nuisance for casters or stealth-reliant foes.\"\u003cbr\u003e\u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable, silent).\u003cbr\u003e    - Burrow 5 m (adapted for soft soil and loose earth).\u003cbr\u003e\u003cbr\u003e- Abilities in Sonar Earmur Form:    \u003cbr\u003e    - Echolocation Mastery: Advantage on Perception checks that rely on hearing. Can detect creatures and objects within a 30 m radius, even in complete darkness, unless in a \"silence zone.\"\u003cbr\u003e\t- Silent Hunt: Advantage on Stealth checks while flying or burrowing, as its movements are nearly soundless.\u003cbr\u003e\t- Soundbending Pulse: Once per short rest, the Earmur can emit a focused sound wave that disrupts enemy concentration or reveals hidden creatures. Creatures within 10 m must make a DC (8 + Dex + Proficiency) Constitution saving throw or be disoriented (disadvantage on attacks and Perception checks) for 1 minute.\u003cbr\u003e    Combat Stats:\u003cbr\u003e    - Evasion: 16\u003cbr\u003e    - HP: 2 x CL (durable for its size but not a tank).\u003cbr\u003e\u003cbr\u003e\t- Attacks:\u003cbr\u003e\t- Sonic Screech: Ranged Sound Attack, Dex+Proficiency to hit, 1d6 thunder damage and forces the target to make a DC (8 + Dex + Proficiency) Constitution saving throw or be deafened for 1 round.\u003cbr\u003e\t- Razor Claws: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 slashing damage.","Context:  \u003cbr\u003eImmediately after the group's victory over a corrupted spirit. Mahogany, the group's only spirit, has absorbed the entity\u2019s negative energy and purified it from within through a spiritual contest.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfaf Mechanics\u003cbr\u003e\u003cbr\u003e- Trigger: Mahogany completes the spirit cleansing.\u003cbr\u003e    \u003cbr\u003e- Airbenders in the group must make a Perception check (DC 12, with advantage).\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eOn Success:  \u003cbr\u003eThey sense a brief, unnatural shift in air pressure\u2014a swirl or pulse like a door opening to a hidden chamber, but they are high on a mountain with nothing around. It vanishes after two seconds.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Mahogany's Vision\u003cbr\u003e\u003cbr\u003e\u003e (Private: The player can request the others to leave the room for this scene.)\u003cbr\u003e\u003cbr\u003e\u003e As the spiritual remnants fade, Mahogany feels a tingle in the air\u2014not hostile, but watchful.  \u003cbr\u003e\u003e Then, a soft voice, cold as distant wind, whispers directly into her ear:\u003cbr\u003e\u003cbr\u003e\"Now... who are you?\"\u003cbr\u003e\u003cbr\u003eMahogany may make a History or Insight check (DC 17) to identify the speaker.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd0d On Success: Recognizing Rin Kotak\u003cbr\u003e\u003cbr\u003eMahogany realizes the voice belongs to Rin Kotak, the elusive Spiritualist of the Night Bloom, a radical airbender known for manipulating sound and blending with wind to near invisibility. He is feared not just for his bending, but for how he weaves ideology into every breath.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udde3\ufe0f Dialogue (If Mahogany responds)\u003cbr\u003e\u003cbr\u003eIf she speaks\u2014aloud or in thought\u2014a ripple of wind answers. On a distant cliff edge, so far that no human voice should carry, a tall, black-robed figure appears, seated cross-legged, barely more than a wraith in the wind. And yet... his voice is inside her again:\u003cbr\u003e\u003cbr\u003e\u003e \u201cYou bent the spirit. Purified it. Took its pain into your own.  \u003cbr\u003e\u003e You\u2019re not like them\u2014not just flesh. Not just bound by the old rules.  \u003cbr\u003e\u003e Intriguing.\u201d\u003cbr\u003e\u003cbr\u003e\u003e \u201cYou stand on a peak, but don\u2019t you feel the cage around you still?  \u003cbr\u003e\u003e The cycle. The Avatar. All of it\u2014wheels within wheels, spinning us endlessly toward the same fate.\u201d\u003cbr\u003e\u003cbr\u003e\u003e \u201cThey call me traitor. But I only want what you just proved is possible\u2014freedom from what was. You and I, Mahogany... we could speak again. When the wind is right.\u201d\u003cbr\u003e\u003cbr\u003eThe wind sighs. A blink later, the figure is gone. The cliff is bare again.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\uddc2\ufe0f Linked Files\u003cbr\u003e\u003cbr\u003e- Rin Kotak\u003cbr\u003e    \u003cbr\u003e- Night Bloom\u003cbr\u003e    \u003cbr\u003e- Isay Trekal\u003cbr\u003e    \u003cbr\u003e- Hanal Koga\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like me to now generate or clean up the Obsidian files for Rin Kotak or Night Bloom based on your inputs? I can help you integrate this directly into your vault.","","","The village of the Spidermonkeys\u003cbr\u003eAdventure: \u003cbr\u003e\u003cbr\u003eSetting: The Floating Island of the Nomadic Airbenders\u003cbr\u003e\u003cbr\u003eThe players find themselves in a dense forest, where an entire floating island has landed momentarily. This island belongs to a nomadic airbending tribe that has perfected a unique bending style called Silkbending, inspired by their deep bond with the Spiderlemurs.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs\u003cbr\u003e\u003cbr\u003eA rare species found only in this part of the world, Spiderlemurs have the body of a lemur but with four arms, four legs, and a long prehensile tail. Their heads resemble spiders, complete with multiple eyes and small mandibles. They produce powerful silk from each of their appendages, which they use to glide alongside the airbenders, creating parachutes they manipulate through airbending. Their silk is also essential for the tribe, used for clothing, rope, and even structural supports for their floating homes.\u003cbr\u003e\u003cbr\u003eThe Spiderlemurs assist in keeping the floating island airborne. By gripping the island with their mandibles and spinning silk into large wind-catching sails, they create natural updrafts, allowing the airbenders to maintain their high-altitude lifestyle.\u003cbr\u003e\u003cbr\u003eThe Floating Island Tribe\u003cbr\u003e\u003cbr\u003eThis nomadic tribe typically resides in a hidden valley where a natural updraft allows them to sustain their floating home. They only descend when necessary, usually for trade or in emergencies. Their culture revolves around Silkbending, a refined form of airbending that incorporates Spiderlemur silk into their movements.\u003cbr\u003e\u003cbr\u003eCulture & Traditions\u003cbr\u003e\u003cbr\u003e- Silkbending: A technique unique to this tribe, combining airbending with the manipulation of Spiderlemur silk. Masters can use it to create silk whips, nets, and even glider-like wings.\u003cbr\u003e    \u003cbr\u003e- Self-Sufficiency: The tribe cultivates special crops adapted to high-altitude life. Their clothing is woven from Spiderlemur silk, making it lightweight yet incredibly durable.\u003cbr\u003e    \u003cbr\u003e- Ceremonial Bonding: Each child of the tribe bonds with a Spiderlemur from birth, forming a lifelong partnership.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eThe Threat: The Corrupted Spiderlemur Spirit\u003cbr\u003e\u003cbr\u003eA young Spiderlemur has been corrupted by dark spiritual energy, transforming into a monstrous creature with a grotesquely large monkey-like head filled with razor-sharp teeth. Its body is now entirely that of a spider, with long, sharp legs and a bloated abdomen leaking dark silk.\u003cbr\u003e\u003cbr\u003eCorrupted Spiderlemur (Dark Spirit)\u003cbr\u003e\u003cbr\u003eType: Dark Spirit Creature (Corrupted Beast)\u003cbr\u003e\u003cbr\u003eHP: High  \u003cbr\u003eArmor: Medium (Silk-reinforced exoskeleton)\u003cbr\u003e\u003cbr\u003eAbilities:\u003cbr\u003e\u003cbr\u003e- Silk Barrage: Fires multiple strands of razor-sharp silk at enemies, restraining and cutting them.\u003cbr\u003e    \u003cbr\u003e- Parasitic Weave: Can attach dark silk to a target, slowly draining their energy while strengthening itself.\u003cbr\u003e    \u003cbr\u003e- Silk Puppet Master: Uses tendrils of silk to control other Spiderlemurs, forcing them to fight against the players.\u003cbr\u003e    \u003cbr\u003e- Shadowed Updraft: Manipulates air currents and silk parachutes to move unpredictably, making it hard to hit.\u003cbr\u003e    \u003cbr\u003e- Venomous Bite: Delivers a spirit-poison that clouds the mind, causing hallucinations and fear.\u003cbr\u003e    \u003cbr\u003e- Dark Ascension: If weakened, the spirit attempts to retreat into the spirit world, requiring the players to perform a purification ritual to prevent its return.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eAdventure Goals\u003cbr\u003e\u003cbr\u003e- Discover the Floating Island: The players must navigate the forest and befriend the nomadic tribe.\u003cbr\u003e    \u003cbr\u003e- Understand Silkbending: Learning about the Spiderlemurs and the tribe's unique abilities may grant temporary Silkbending techniques.\u003cbr\u003e    \u003cbr\u003e- Fight the Corrupted Spiderlemur: The players must defeat or purify the creature before it corrupts the other Spiderlemurs and endangers the island.\u003cbr\u003e    \u003cbr\u003e- Protect the Floating Island: The battle could disrupt the delicate updraft balance, forcing players to use creative airbending or Silkbending to keep the island afloat.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003ePossible Rewards\u003cbr\u003e\u003cbr\u003e- Silkbender\u2019s Cloak: A lightweight but durable cloak woven from Spiderlemur silk, enhancing agility and stealth.\u003cbr\u003e    \u003cbr\u003e- Silkglider Bracers: Wristbands that generate small silk wings, allowing for short bursts of controlled gliding.\u003cbr\u003e    \u003cbr\u003e- Spiderlemur Ally: If the players handle the situation well, they may gain a Spiderlemur companion or a future alliance with the tribe.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eThis adventure introduces a unique airbending culture, a powerful corrupted foe, and creative bending techniques, encouraging both combat and problem-solving elements in the game.","","","Overview of Earth Kingdom adventures, including themes like resilience, strength, and the challenges of navigating a vast and diverse region. Includes guidelines for integrating these modules with the larger campaign.","","Overview:\u003cbr\u003e\u003cbr\u003eThe Avatar spirit, the bridge between the physical and spiritual realms, is in a precarious state. During the final moments of the last Avatar\u2019s life, a catastrophic event caused the spirit\u2019s essence to splinter, disrupting the cycle of reincarnation and weakening its connection to the Spirit World.\u003cbr\u003e\u003cbr\u003eEvent of Fracture:\u003cbr\u003e\u003cbr\u003eThe fracture occurred during a climactic battle against a monstrous corrupted spirit, commanded by the rogue Spiritbender. The Avatar sacrificed themselves to contain the spirit\u2019s power, but the Spiritbender\u2019s mist disrupted the Avatar\u2019s spiritual essence, leaving it fragmented and vulnerable.\u003cbr\u003e\u003cbr\u003eEffects of the Fracture:\u003cbr\u003e\u003cbr\u003e1. Weakened Avatar State: The current Avatar cannot fully access the power of their predecessors, making their connection to past lives erratic and unreliable.\u003cbr\u003e    \u003cbr\u003e2. Disturbed Spirit World: The fracture has caused chaos in the Spirit World, with dark spirits manifesting more frequently in the physical realm.\u003cbr\u003e    \u003cbr\u003e3. Cycle in Jeopardy: The reincarnation cycle is unstable. If the fracture is not healed, the Avatar may not reincarnate after their current life ends.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eClues to Restoration:\u003cbr\u003e\u003cbr\u003e- Shards of Essence: Fragments of the Avatar spirit linger in sacred locations across the world. By visiting these sites and performing rituals, the group can begin to mend the fractures.\u003cbr\u003e    \u003cbr\u003e- Guidance from Spirits: Certain spirits, such as Shifting Sands or the elusive Bright Flame, may provide insight into restoring the balance.\u003cbr\u003e    \u003cbr\u003e- Confronting the Spiritbender: The rogue Airbender holds knowledge about the fracture and must be confronted to uncover the full truth.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e- Fractured Avatar State:\u003cbr\u003e    \u003cbr\u003e    - When the Avatar attempts to enter the Avatar State, they must succeed on a Spirit check (DC 18). Failure results in a partial manifestation, granting a single bending style enhancement instead of full power.\u003cbr\u003e        \u003cbr\u003e    - Past Avatar advice requires a concentration check (DC 15) to establish communication.\u003cbr\u003e        \u003cbr\u003e- Restoration Sites:\u003cbr\u003e    \u003cbr\u003e    - Each sacred location restores a portion of the Avatar spirit, reducing the DCs for Avatar State checks by 2. Fully visiting all sites removes these penalties entirely.\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003eEncounters:\u003cbr\u003e\u003cbr\u003e- The First Shard: The group travels to a secluded temple where the shard is guarded by a territorial spirit. They must earn the spirit\u2019s trust or defeat it to claim the shard.\u003cbr\u003e    \u003cbr\u003e- Spiritual Consequences: An encounter with a corrupted spirit shows the group the real-world effects of the fractured Avatar spirit, emphasizing the urgency of their quest.\u003cbr\u003e    \u003cbr\u003e- The Spiritbender\u2019s Challenge: A climactic battle against the Spiritbender offers an opportunity to learn how the fracture occurred and hints at their larger agenda.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eImplications for the Campaign:\u003cbr\u003e\u003cbr\u003eHealing the Avatar spirit becomes a central goal, tying together themes of balance, sacrifice, and teamwork. The fracture also provides opportunities for moral dilemmas, as the group navigates the complex relationships between humans and spirits.","","Overview of the purpose of the #Modules folder, including guidelines on how to scale the modules based on the party's power level and integrate them into the main campaign.\u003cbr\u003e\u003cbr\u003eModules","", 03cbr\u003e          \u251c\u2500\u2500 Other Importants\u003cbr\u003e              \u2514\u2500\u2500 Ula Envoy of Ch\u00e1nch\u00fa.md\u003cbr\u003e          \u2514\u2500\u2500 The Night Bloom\u003cbr\u003e              \u251c\u2500\u2500 Isay Trekal.md\u003cbr\u003e              \u251c\u2500\u2500 Jin Koga\u003cbr\u003e                  \u2514\u2500\u2500 Hanal Koga.md\u003cbr\u003e              \u2514\u2500\u2500 Rin Kotak\u003cbr\u003e                  \u2514\u2500\u2500 Rin Kotak.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","Collectionfile \u003cbr\u003e\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Organisations --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Organisations\u003cbr\u003e          \u251c\u2500\u2500 Night Bloom\u003cbr\u003e              \u2514\u2500\u2500 Night Bloom.md\u003cbr\u003e          \u2514\u2500\u2500 The Lotus.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","Collectionfile \u003cbr\u003e\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Session --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","","- Physical Description:  \u003cbr\u003e        A tall, lean man in his early sixties with silver-streaked black hair tied into a high topknot. His sharp amber eyes radiate wisdom and authority, while his lightly weathered skin reflects years of spiritual practice. He has a composed, almost regal posture, wearing a perpetual calm smile that hides the fire of his immense power.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Firebending infused with advanced spiritual techniques, emphasizing control and harmony over raw power. Known for producing green flame as a sign of his mastery.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the organization\u2019s spiritual and physical balance, emphasizing diplomacy and tradition.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Wisdom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eFirebending\u003cbr\u003e\u003cbr\u003eDear Iroh Tanaka,\u003cbr\u003eWe hope this letter finds you well, we from team anju the avatar make our way Omashu. We think the bad guys (and girls and enbis) want to go to that village. Greeting from christopher. anyways that village has a chrystal that we think that might be the next target of the evil people.\u003cbr\u003emfg  \u003cbr\u003eTeam Anju\u003cbr\u003eTHIS GOT EATEN BY ALEXANDER\u003cbr\u003eNPC","- Physical Description:  \u003cbr\u003e        A middle-aged woman of medium height with a graceful, slender build. Her long, silvery-blue hair flows freely down her back, adorned with small jade pins shaped like water droplets. Her piercing sea-green eyes seem to look into a person\u2019s soul. Her demeanor is serene but carries an undercurrent of strength, much like a calm sea hiding its depth.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending that incorporates healing and offensive manipulation of mist, granting her versatility in combats\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Strength\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eNPC","NPC","","Character\u003cbr\u003e\u003cbr\u003e- Name: Ula\u003cbr\u003e    \u003cbr\u003e- Appearance:\u003cbr\u003e    \u003cbr\u003e    - Pale skin, faintly glowing purple hair due to crystal-paste dye.\u003cbr\u003e    - Mushroom-leather outfit with a toad-eye hood for tradition and identity.\u003cbr\u003e- Personality:\u003cbr\u003e    \u003cbr\u003e    - Determined, resourceful, and reverent toward the spirit.\u003cbr\u003e    - Nervous about interacting with the outside world.\u003cbr\u003e- Role:\u003cbr\u003e    \u003cbr\u003e    - Tasked with seeking a Spirit Bender to save Ch\u00e1nch\u00fa .\u003cbr\u003e    - Acts as the guide for the party to the Undersands Village .\u003cbr\u003e\u003cbr\u003eEquipment:\u003cbr\u003e\u003cbr\u003e- Crystals for lighting caves.\u003cbr\u003e- Hydration stones for water control and protection.\u003cbr\u003e\u003cbr\u003eLinks to Other Notes:\u003cbr\u003e\u003cbr\u003e- Ch\u00e1nch\u00fa \u003cbr\u003e- Undersands Village \u003cbr\u003e- Spirit Benders \u003cbr\u003e- Mushroom Leather Techniques \u003cbr\u003eNPC","","- Physical Description:  \u003cbr\u003e    A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e- Bending Style:  \u003cbr\u003e    Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e- Role:  \u003cbr\u003e    Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003eNPC","","","Organisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Night Bloom is a radical faction seeking to overthrow the Avatar\u2019s influence, advocating for a world ruled collectively by elite benders. They view the Avatar as a relic of oppression and seek to reshape the spiritual and physical realms.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLeadership:\u003cbr\u003e\u003cbr\u003e1. Isay Trekal (she\u002fher) (Faction Leader)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A striking woman in her early forties with jet-black hair styled into an intricate braid that cascades down her back. Her pale blue eyes seem to pierce through her opponents, reflecting a sharp intellect and unshakable resolve. Her high cheekbones and angular features give her an almost regal appearance. She wears an ornate, high-collared cloak adorned with faintly glowing charms.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Waterbending focused on offensive techniques, including the manipulation of black mist\u2014a mixture of water vapor and fine particles, creating disorienting smoke.\u003cbr\u003e    - Role:  \u003cbr\u003e        Charismatic leader and visionary behind the rebellion. Isay is a master tactician and inspiring orator.\u003cbr\u003e2. Hanal Koga(she\u002fher) (Second-in-Command)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A sturdy woman with sun-kissed skin and short, spiky hair the color of sandy blonde. She has a confident, swaggering gait, often adorned with sand-crusted boots and bracers. Her lightweight armor is covered with fine grains of sand that move subtly as she walks.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Earthbending with a specialization in sand manipulation.\u003cbr\u003e    - Role:  \u003cbr\u003e        Oversees the Night Bloom\u2019s military operations, crafting strategies for their attacks.\u003cbr\u003e3. Rin Kotak(he\u002fhim) (Spiritualist)\u003cbr\u003e    \u003cbr\u003e    - Physical Description:  \u003cbr\u003e        A tall, gaunt man with alabaster skin and wispy, shoulder-length white hair that seems to shift like mist in the wind. His gray eyes are perpetually half-lidded, giving him a detached, eerie demeanor. His flowing black robes ripple unnaturally, as if caught in a constant breeze. His soft-spoken voice carries an unsettling intensity.\u003cbr\u003e    - Bending Style:  \u003cbr\u003e        Airbending with a dark twist\u2014manipulating sound waves to confuse and disorient enemies and bending the air around him to make him almost invisible.\u003cbr\u003e    - Role:  \u003cbr\u003e        Spirit guide of the Night Bloom, responsible for forging alliances with rogue spirits.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003cbr\u003e\u003cbr\u003e- Colors:  \u003cbr\u003e    Black and deep purple, representing secrecy and defiance, with accents of crimson to signify rebellion.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Sleek and utilitarian clothing designed for agility.\u003cbr\u003e    - Leaders wear flowing cloaks with jagged, petal-like edges to resemble blooming flowers in the dark.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - Masks covering the lower face, often stylized with floral patterns or fanged motifs.\u003cbr\u003e    - Small spirit-charms integrated into their outfits, glowing faintly with corrupted energy during rituals or battles.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Isay Trekal\u003cbr\u003e- Rin Kotak\u003cbr\u003e- Night Bloom\u003cbr\u003e- Hanal Koga\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eWaterbending\u003cbr\u003eAirbending\u003cbr\u003eAvatar","","My character is Anju, the oldest daughter of 5 siblings. Anju's father always wanted a son but he\u003cbr\u003ewas only blessed with daughters. Believing only males could lead the great southern water tribe\u003cbr\u003eto further prosperity, he decided to raise Anju like the son he always wanted to have.\u003cbr\u003e(Anju is derived from \"Angijua\" in Inuktitut which means \"older brother\")\u003cbr\u003eThe mother died after giving birth to the 5th child, Anju and her siblings were raised by their\u003cbr\u003efather and the father's sister.\u003cbr\u003e\u003cbr\u003eEven though Anju was raised like a man, she has a feminine side to her which she learned from\u003cbr\u003eher aunt. The father is strict but also a good instructor. In time, Anju has enough athletic ability\u003cbr\u003eto pass as an average male of her tribe (though not outstanding like Korra). Anju's strength lies\u003cbr\u003ein her ability to create icicles. One of her greatest achievements - and also secrets - is when she\u003cbr\u003ecreated thick icicle soles to appear 5cm taller, which made her taller than her father at that time\u003cbr\u003eand caused her father to appear proud of her for the first time in forever.\u003cbr\u003e\u003cbr\u003eSeeing Anju's proficient icicle making, her father is convinced she is a very talented bender, maybe\u003cbr\u003eeven with potential of becoming the next Avatar. He sends Anju off to\u003cbr\u003e\u003cENTER SUMMSI'S NAME FOR THE AVATAR CAMP HERE\u003e with one request to\u003cbr\u003eAnju: \"Be a great man that makes the southern water tribe proud\"","","Character Summary\u003cbr\u003e\u003cbr\u003eRace:  \u003cbr\u003eSpirit-turned-human\u003cbr\u003e\u003cbr\u003eClass:  \u003cbr\u003eAir Spirit\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBackstory:  \u003cbr\u003eOnce a small spirit living among the Air Nomads, I helped them forage, offering guidance and protection in their peaceful, nature-centered life. But when the spirit doors closed, I was trapped in the Spirit World, separated from the humans I cared for.\u003cbr\u003e\u003cbr\u003eAfter countless years, I found a way to cross back through an abandoned Air Nomad temple. When I arrived, I was shocked to see how much the world had changed\u2014machines, bending powers, and humans who no longer lived in harmony with nature.\u003cbr\u003e\u003cbr\u003eConfused and fascinated, I wander this unfamiliar world, trying to understand what has happened and how I can help again.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBase Abilities (Available in all forms)\u003cbr\u003e\u003cbr\u003e- Spiritual Nourishment:  \u003cbr\u003e    Can create small plants or fruits that provide minor healing (1d6 + Proficiency bonus) or temporary bonuses:\u003cbr\u003e    \u003cbr\u003e    - Energizing Fruit: Grants +2 temporary HP per character level.\u003cbr\u003e    - Focus Herb: Grants Advantage on the next attack roll or saving throw.  \u003cbr\u003e        Can be used twice per long rest, with effects lasting up to 1 hour.\u003cbr\u003e- Limited Airbending:\u003cbr\u003e    \u003cbr\u003e    - Gust: Push or pull objects or creatures within a 15 ft range (similar to the gust cantrip).\u003cbr\u003e    - Air Barrier: Create a brief 5-ft circular shield of air, granting +2 AC to yourself or an ally for 1 round.\u003cbr\u003e    - Wind Aided Movement: Gain 10 extra feet of movement speed for 1 round.\u003cbr\u003e- Connection to Nature:  \u003cbr\u003e    Gains Advantage on Nature checks and can communicate simple ideas with animals or spirits.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eShapeshifting Forms\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eShapeshifting Mechanics\u003cbr\u003e\u003cbr\u003e- Transformations Per Long Rest:  \u003cbr\u003e     You have 2  Proficiency Transformation Points per long rest.\u003cbr\u003e    \u003cbr\u003e- Shapeshifting Cost:\u003cbr\u003e\t- Human Form: 0 Transformation Points\u003cbr\u003e    - Flying Lemur: 1 Point\u003cbr\u003e    - Bearturtle: 2 Points \u003cbr\u003e    - Luma\u2019tik 2 Transformation Points\u003cbr\u003e    -\u003cbr\u003e- Exiting the Forms:  \u003cbr\u003e    Transformations end early if the form\u2019s HP is reduced to 0 or voluntarily dropped. Remaining damage spills over to the character\u2019s normal HP. \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Proficiency\u003cbr\u003e- Strength\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAirbending #transformation","You have your CL  2  amount of Transformation Points\u003cbr\u003e\u003cbr\u003etransformation","","","\u003c!-- No backlinks found --\u003e","\u003c!-- No backlinks found --\u003e","","","If not Specified otherwise, Ammunition can be used by any character (if its logic :D)  as part of their Moves to enhance them creatively.","Con save DC of max(10, Damage Taken \u002f 2)\u003cbr\u003eSome Moves require concentration to keep them up. If you take damage while concentrationg you have to make a Con save with a DC of max(10, Damage Taken \u002f 2)","If not Specified otherwise, lingering effect last until the start of your next Turn.\u003cbr\u003eIf caused by a damaging Move: Every creature that ends its turn there will get half the original attacks Damage.","Movement per Round:\u003cbr\u003e10 meters + Airbending Level  3","\u003c!-- BEGIN-AUTO-COLLECTION:Reaction --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 PCs\u003cbr\u003e  \u2502   \u2514\u2500\u2500 Mahogany\u003cbr\u003e  \u2502       \u2514\u2500\u2500 Shapeshifting Forms\u003cbr\u003e  \u2502           \u251c\u2500\u2500 Bearturtle.md\u003cbr\u003e  \u2502           \u2514\u2500\u2500 Players Part\u002fPCs\u002fMahogany\u002fShapeshifting Forms\u002fLuma\u2019tik\u003cbr\u003e  \u2514\u2500\u2500 Rules\u003cbr\u003e      \u251c\u2500\u2500 Bending Rules\u003cbr\u003e      \u2502   \u251c\u2500\u2500 Air\u003cbr\u003e      \u2502   \u2502   \u251c\u2500\u2500 Airbending Moves\u003cbr\u003e      \u2502   \u2502   \u2502   \u2514\u2500\u2500 Emergency Air Push.md\u003cbr\u003e      \u2502   \u2502   \u2514\u2500\u2500 Mechanics\u003cbr\u003e      \u2502   \u2502       \u2514\u2500\u2500 Airbending Charges.md\u003cbr\u003e      \u2502   \u251c\u2500\u2500 Earth\u003cbr\u003e      \u2502   \u2502   \u251c\u2500\u2500 Earthbending Moves\u003cbr\u003e      \u2502   \u2502   \u2502   \u251c\u2500\u2500 Level 1 Moves\u003cbr\u003e      \u2502   \u2502   \u2502   \u2502   \u2514\u2500\u2500 Earth Brace.md\u003cbr\u003e      \u2502   \u2502   \u2502   \u2514\u2500\u2500 Level 2 Moves\u003cbr\u003e      \u2502   \u2502   \u2502       \u251c\u2500\u2500 Gravel Vortex.md\u003cbr\u003e      \u2502   \u2502   \u2502       \u2514\u2500\u2500 Stone Shield.md\u003cbr\u003e      \u2502   \u2502   \u2514\u2500\u2500 glass fruit bending\u003cbr\u003e      \u2502   \u2502       \u2514\u2500\u2500 Glassfruit Seed Mechanics.md\u003cbr\u003e      \u2502   \u251c\u2500\u2500 Fire\u003cbr\u003e      \u2502   \u2502   \u2514\u2500\u2500 Firebending Moves\u003cbr\u003e      \u2502   \u2502       \u2514\u2500\u2500 General Moves\u003cbr\u003e      \u2502   \u2502           \u2514\u2500\u2500 Cantrips.md\u003cbr\u003e      \u2502   \u2514\u2500\u2500 Water\u003cbr\u003e      \u2502       \u251c\u2500\u2500 Waterbending Moves\u003cbr\u003e      \u2502       \u2502   \u2514\u2500\u2500 Level 3 Moves\u003cbr\u003e      \u2502       \u2502       \u2514\u2500\u2500 Icicle Ammunition.md\u003cbr\u003e      \u2502       \u2514\u2500\u2500 Waterbending rules.md\u003cbr\u003e      \u251c\u2500\u2500 Non Bending Rules\u003cbr\u003e      \u2502   \u2514\u2500\u2500 Chi Blocking\u003cbr\u003e      \u2502       \u2514\u2500\u2500 Chi Blocking Moves\u003cbr\u003e      \u2502           \u251c\u2500\u2500 Level 1 Moves\u003cbr\u003e      \u2502           \u2502   \u2514\u2500\u2500 Evasive manouvers.md\u003cbr\u003e      \u2502           \u2514\u2500\u2500 Level 3 Moves\u003cbr\u003e      \u2502               \u2514\u2500\u2500 Bedning Redirect.md\u003cbr\u003e      \u2514\u2500\u2500 Teamwork Moves.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","Take a break and rest for an Hour.\u003cbr\u003e\u003cbr\u003eYou Have a pool of Your Hitpoints and","","---\u003cbr\u003e\u003cbr\u003eStonevine Hollow\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Subterranean jungle cave system  \u003cbr\u003eSpecialized Style:\u00a0Vinegrasp Bending  \u003cbr\u003eDescription:  \u003cbr\u003eStonevine Hollow is hidden deep beneath the surface in a lush cave network where glowing fungi and creeping vines dominate the stone landscape. The villagers have developed\u00a0Vinegrasp Bending, a technique that integrates earthbending with plant interaction. Benders here can manipulate soil and roots in tandem, weaving vines through stone or using soil nutrients to rapidly grow roots as whips, restraints, or bridges. They value patience and symbiosis, with their bending resembling a slow but overwhelming encroachment.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Root Snare:\u00a0Erupts tangled roots from the soil to bind enemies.\u003cbr\u003e    \u003cbr\u003e- Fungal Bloom:\u00a0Encourages explosive growth of bioluminescent fungi to blind foes or light paths.\u003cbr\u003e    \u003cbr\u003e- Symbiotic Armor:\u00a0Covers the bender in flexible bark-like plating drawn from surrounding flora.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAshen Steppes\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Volcanic plains and hardened lava flows  \u003cbr\u003eSpecialized Style:\u00a0Magma Pulse Bending  \u003cbr\u003eDescription:  \u003cbr\u003eBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed\u00a0Magma Pulse Bending, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Lava Flare:\u00a0Melts a small patch of ground into a geyser of magma.\u003cbr\u003e    \u003cbr\u003e- Obsidian Shardstorm:\u00a0Shatters cooled lava into razor-sharp fragments hurled at foes.\u003cbr\u003e    \u003cbr\u003e- Ash Drift:\u00a0Uses heated air and ash for sudden propulsion or smokescreen escapes.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWhispering Mesa\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Wind-carved sandstone cliffs and canyons  \u003cbr\u003eSpecialized Style:\u00a0Echoform Bending  \u003cbr\u003eDescription:  \u003cbr\u003ePerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered\u00a0Echoform Bending\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Resonant Blade:\u00a0Vibrates stone into a cutting edge capable of slicing metal.\u003cbr\u003e    \u003cbr\u003e- Tremor Veil:\u00a0Distorts local vibrations to confuse tremor-sensing enemies.\u003cbr\u003e    \u003cbr\u003e- Echo Step:\u00a0Propels the user forward using a precisely timed ground pulse.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like me to create adventure hooks or NPCs tied to these villages?\u003cbr\u003e\u003cbr\u003eYou said:\u003cbr\u003e\u003cbr\u003egreat now do the same for airbender villages\u003cbr\u003e\u003cbr\u003eChatGPT said:\u003cbr\u003e\u003cbr\u003eHere are three distinct\u00a0Airbender villages, each shaped by their unique environments and showcasing specialized Airbending styles that reflect their culture and surroundings:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eZephyr\u2019s Climb\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0High-altitude glacier peak  \u003cbr\u003eSpecialized Style:\u00a0Stillwind Bending  \u003cbr\u003eDescription:  \u003cbr\u003eZephyr\u2019s Climb is nestled in the razor-thin air of a mountain range\u2019s highest glacier, where silence and stillness are paramount for survival. The airbenders here have developed\u00a0Stillwind Bending, a meditative form that emphasizes control of minute air currents and micro-movements. This precision-based style allows benders to manipulate even the most stagnant air to create silence zones, control breath patterns, and maintain balance on windswept peaks.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Silent Gale:\u00a0Dampens all nearby sound by stabilizing air pressure and movement.\u003cbr\u003e    \u003cbr\u003e- Breath Cloak:\u00a0Controls respiration and surface-level air to become undetectable to heat or motion sensors.\u003cbr\u003e    \u003cbr\u003e- Frozen Drift:\u00a0Uses fine gusts to levitate lightly over snow without leaving prints or triggering avalanches.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eHollow Reeds\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Floating reed islands in a vast foggy marsh  \u003cbr\u003eSpecialized Style:\u00a0Reedflow Bending  \u003cbr\u003eDescription:  \u003cbr\u003eHollow Reeds is a nomadic, waterbound community drifting through an enormous marsh where visibility is low and navigation is based on air and scent. The benders here created\u00a0Reedflow Bending, a fluid, serpentine style that emulates the winding patterns of wind through wetland reeds. This style excels at low-altitude flight, air scent-tracking, and creating confusing, humid mirages using moisture-laden gusts.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Mist Spiral:\u00a0Twists warm air and fog into a smothering vortex that obscures vision and sound.\u003cbr\u003e    \u003cbr\u003e- Scent Echo:\u00a0Carries specific smells on wind currents for tracking or signaling.\u003cbr\u003e    \u003cbr\u003e- Whispering Drift:\u00a0Glides just above water without causing ripples, ideal for stealth and scouting.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCrimson Sails\u003cbr\u003e\u003cbr\u003eEnvironment:\u00a0Roaming cliffside windships on desert thermals  \u003cbr\u003eSpecialized Style:\u00a0Thermal Riding  \u003cbr\u003eDescription:  \u003cbr\u003eCrimson Sails is not a stationary village but a mobile flotilla of wind-powered skiffs and gliders that ride the desert\u2019s fierce thermals between cliff plateaus. The benders here specialize in\u00a0Thermal Riding, an acrobatic and speed-focused airbending style that manipulates vertical drafts and uses heat differentials to soar at high speeds. Their combat relies on divebomb maneuvers, sudden bursts of updrafts, and redirecting hot air from desert stones.\u003cbr\u003e\u003cbr\u003eKey Techniques:\u003cbr\u003e\u003cbr\u003e- Updraft Spear:\u00a0Condenses a vertical wind column to launch people or objects skyward.\u003cbr\u003e    \u003cbr\u003e- Searing Glide:\u00a0Uses heat rising off hot stone to gain lift or deflect projectile attacks.\u003cbr\u003e    \u003cbr\u003e- Cyclone Lance:\u00a0A spinning, high-speed dive with piercing air pressure, used in aerial jousts.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---","","Stonevine Hollow\u003cbr\u003eEnvironment: \u003cbr\u003eSubterranean jungle cave system\u003cbr\u003eSpecialized Style: \u003cbr\u003eVinegrasp BendingDescription:\u003cbr\u003eStonevine Hollow is hidden deep beneath the surface in a lush cave network where glowing fungi and creeping vines dominate the stone landscape. The villagers have developed Vinegrasp Bending, a technique that integrates earthbending with plant interaction. Benders here can manipulate soil and roots in tandem, weaving vines through stone or using soil nutrients to rapidly grow roots as whips, restraints, or bridges. They value patience and symbiosis, with their bending resembling a slow but overwhelming encroachment.Key Techniques:Root Snare: Erupts tangled roots from the soil to bind enemies.Fungal Bloom: Encourages explosive growth of bioluminescent fungi to blind foes or light paths.Symbiotic Armor: Covers the bender in flexible bark-like plating drawn from surrounding flora.\u003cbr\u003e\u003cbr\u003eAshen Steppes\u003cbr\u003eEnvironment: \u003cbr\u003eVolcanic plains and hardened lava flowsSpecialized Style: Magma Pulse BendingDescription:\u003cbr\u003eBuilt on a cooled lava plateau, Ashen Steppes is a hardy settlement that thrives amidst ash and fire. Their benders have developed Magma Pulse Bending, a high-heat technique that focuses on heating and liquifying stone momentarily to create bursts of molten rock or steam-based propulsion. It\u2019s more aggressive and volatile than traditional earthbending, with a focus on explosive, short-range attacks and reshaping brittle volcanic stone mid-combat.\u003cbr\u003eKey Techniques:\u003cbr\u003eLava Flare:\u003cbr\u003eMelts a small patch of ground into a geyser of magma.\u003cbr\u003eObsidianShardstorm: \u003cbr\u003eShatters cooled lava into razor-sharp fragments hurled at foes.\u003cbr\u003eAsh Drift: \u003cbr\u003eUses heated air and ash for sudden propulsion or smokescreen escapes.\u003cbr\u003e\u003cbr\u003eWhispering Mesa\u003cbr\u003eEnvironment: \u003cbr\u003eWind-carved sandstone cliffs and canyons\u003cbr\u003eSpecialized Style:\u003cbr\u003eEchoform Bending Description:\u003cbr\u003ePerched atop labyrinthine mesas where the wind never stops howling, Whispering Mesa is home to benders who\u2019ve mastered Echoform Bending\u2014a refined technique that utilizes sound vibrations and seismic pulses through brittle stone. They focus on precision, using thin slices, tremor sense, and harmonic resonance to create unstable conditions underfoot or launch sonic-reinforced projectiles.\u003cbr\u003eKey Techniques:\u003cbr\u003eResonant Blade: Vibrates stone into a cutting edge capable of slicing metal.\u003cbr\u003eTremor Veil: Distorts local vibrations to confuse tremor-sensing enemies.\u003cbr\u003eEcho Step: Propels the user forward using a precisely timed ground pulse.","","| # Bobakik \u003cbr\u003eSmall Fey, Typically Lawful Neutral | | | | | |\u003cbr\u003e| Armor Class 14 (Natural Armor)\u003cbr\u003e\u003cbr\u003eHit Points 16 (4d6 + 2)\u003cbr\u003e\u003cbr\u003eSpeed 30 ft., climb 30 ft. | | | | | |\u003cbr\u003e| STR\u003cbr\u003e\u003cbr\u003e10 (+0) | DEX\u003cbr\u003e\u003cbr\u003e14 (+2) | CON\u003cbr\u003e\u003cbr\u003e12 (+1) | INT\u003cbr\u003e\u003cbr\u003e16 (+3) | WIS\u003cbr\u003e\u003cbr\u003e14 (+2) | CHA\u003cbr\u003e\u003cbr\u003e7 (-2) |\u003cbr\u003e| Skills Perception +4, Sleight of Hand +4, Stealth +4Senses darkvision 60 ft., passive Perception 14\u003cbr\u003e\u003cbr\u003eLanguages Sylvan\u003cbr\u003e\u003cbr\u003eChallenge 5 (1,800 XP) Proficiency Bonus +3 | | | | | |\u003cbr\u003e| Artisan's Darkvision. The bobakik can see in darkness as if it were bright light, and is able to discern colors in darkness.\u003cbr\u003e\u003cbr\u003eShadow Stealth. While in dim light or darkness, the bobakik can take the Hide Action as a Bonus Action.\u003cbr\u003e\u003cbr\u003eSunlight Weakness. While in sunlight, the bobakik has disadvantage on attack rolls, ability checks, and saving throws.\u003cbr\u003e\u003cbr\u003eTrue Artisan. The bobakik has proficiency with all artisans tools, as well as navigator's tools and thieves' tools. | | | | | |\u003cbr\u003e| actionS | | | | | |\u003cbr\u003e| Multiattack. The bobakik makes two scratch or tool toss attacks. If it is targeting the master of its house, it instead makes three attacks.\u003cbr\u003e\u003cbr\u003eScratch. Melee Weapon Attack: +4 to hit, reach 5 ft., one target. Hit: 5 (1d6 + 2) slashing damage.\u003cbr\u003e\u003cbr\u003eTool Toss. Ranged Weapon Attack: +4 to hit, range 15\u002f30 ft., one target. Hit: 4 (1d4 + 2) piercing damage. | | | | | |\u003cbr\u003e\u003cbr\u003e- The Bobakik will generally avoid combat, using its Shadow Stealth to escape most confrontations\u003cbr\u003e- The Bobakik will resort to ranged attacks from small areas inside buildings, such as rafters or holes in walls\u003cbr\u003e- The Bobakik is nocturnal, and if moved to attack targets first, will do so when its enemies are asleep","| # FROSTLING PUPPETEER \u003cbr\u003eSmall fey, lawful evil | | | | | |\u003cbr\u003e| Armor Class 14\u003cbr\u003e\u003cbr\u003eHit Points 44 (8d6 + 16)\u003cbr\u003e\u003cbr\u003eSpeed 30 ft. | | | | | |\u003cbr\u003e| STR\u003cbr\u003e\u003cbr\u003e9 (-1) | DEX\u003cbr\u003e\u003cbr\u003e18 (+4) | CON\u003cbr\u003e\u003cbr\u003e14 (+2) | INT\u003cbr\u003e\u003cbr\u003e10 (+0) | WIS\u003cbr\u003e\u003cbr\u003e12 (+1) | CHA\u003cbr\u003e\u003cbr\u003e17 (+3) |\u003cbr\u003e| Skills Acrobatics +6, Deception +5\u003cbr\u003e\u003cbr\u003eCondition Immunities charmedSenses darkvision 60 ft., passive Perception 11\u003cbr\u003e\u003cbr\u003eLanguages Common, Sylvan\u003cbr\u003e\u003cbr\u003eChallenge 3 (700 XP) Proficiency Bonus +2 | | | | | |\u003cbr\u003e| Frostling Puppet. The frostling puppeteer\u2019s magical puppet has AC 14, 10 hit points, and resistance to non-magical bludgeoning, piercing, and slashing damage. If the puppet is destroyed, the Puppeteer can no longer use its Puppet Binding ability. It takes 24 hours for the Frostling Puppeteer to craft a new puppet.\u003cbr\u003e\u003cbr\u003eMagic Resistance. The frostling puppeteer has advantage on saving throws against spells and other magical effects. | | | | | |\u003cbr\u003e| actionS | | | | | |\u003cbr\u003e| Naughty, Naughty. The frostling puppeteer targets one creature it can see within 30 feet with a harsh scolding. The target must succeed on a DC 13 Wisdom saving throw. On a failed save, the creature takes 14 (2d10 + 3) psychic damage and is frightened until the end of its next turn. On a successful save, the creature takes half as much and is not frightened.\u003cbr\u003e\u003cbr\u003ePuppet Binding. The frostling puppeteer targets one creature it can see within 30 feet. The target must succeed on a DC 13 Wisdom saving throw or be bound by magical strings for up to 24 hours (if a child) or until the end of its next turn (if an adult). While bound, the target is controlled by the frostling puppeteer. The binding ends if the puppet is destroyed or the frostling puppeteer binds a new creature.\u003cbr\u003e\u003cbr\u003ePull the Strings. The frostling puppeteer commands a bound creature to move up to its full movement and take two of the following attacks:\u003cbr\u003e\u003cbr\u003e1. Feral Bite: Melee Weapon Attack: +6 to hit, reach 5 ft., one target. Hit: 11 (2d6 + 4) piercing damage.\u003cbr\u003e2. Meltdown. The bound creature lets out a petulant scream. All other creatures within 30 feet that can hear it must succeed a DC 13 Constitution saving throw or take 10 (3d6) Psychic damage.\u003cbr\u003e3. Strangle. The bound creature attempts to choke the target with the magical strings that bind it. Melee Weapon Attack: +6 to hit, reach 5 ft., one Medium or smaller creature. Hit: The creature is grappled (escape DC 13). Until this grapple ends, the target is restrained and at risk of suffocating, and the bound creature can\u2019t strangle another target. In addition, at the start of each of the target's turns, the target takes 7 (2d6) bludgeoning damage.\u003cbr\u003e\u003cbr\u003e reactionS | | | | | |\u003cbr\u003e| Ventriloquist's Dodge (3\u002fday). When the frostling puppeteer is targeted by an attack, it can use its Reaction to magically swap places with a bound creature within 30 feet, causing the attack to target the bound creature instead. | | | | | |","| # HOLIDAY SPIRIT \u003cbr\u003eMedium Undead, Typically Chaotic Neutral | | | | | |\u003cbr\u003e| Armor Class 13\u003cbr\u003e\u003cbr\u003eHit Points 45 (10d8)\u003cbr\u003e\u003cbr\u003eSpeed 10 ft., fly 40 ft. | | | | | |\u003cbr\u003e| STR\u003cbr\u003e\u003cbr\u003e9 (-1) | DEX\u003cbr\u003e\u003cbr\u003e16 (+3) | CON\u003cbr\u003e\u003cbr\u003e10 (+0) | INT\u003cbr\u003e\u003cbr\u003e9 (-1) | WIS\u003cbr\u003e\u003cbr\u003e16 (+3) | CHA\u003cbr\u003e\u003cbr\u003e17 (+3) |\u003cbr\u003e| Damage Resistances acid, fire, lightning, thunder; bludgeoning, piercing, and slashing from nonmagical attacks\u003cbr\u003e\u003cbr\u003eDamage Immunities cold, necrotic, poison\u003cbr\u003e\u003cbr\u003eCondition Immunities exhaustion, grappled, paralyzed, petrified, poisoned, prone, restrainedSenses darkvision 60 ft., passive Perception 13\u003cbr\u003e\u003cbr\u003eLanguages Common\u003cbr\u003e\u003cbr\u003eChallenge 5 (1,800 XP) Proficiency Bonus +3 | | | | | |\u003cbr\u003e| Amphibious. The holiday spirit can breathe air and water.\u003cbr\u003e\u003cbr\u003eFluid Form. The Holiday Spirit can enter a hostile creature\u2019s space and stop there. It can move through and stop in a space as narrow as 1 inch wide without squeezing.\u003cbr\u003e\u003cbr\u003eSpirit Siphon. The Holiday Spirit draws power from festivities and collective emotion. The nature of any given festivity reflects the energy the creature is able to drain, determining its unique traits. The GM chooses from one of the traits from the table below, selecting one that best reflects the celebrations that have drawn the spirit\u2019s attention.\u003cbr\u003e\u003cbr\u003eSpirit Siphon Table\u003cbr\u003e\u003cbr\u003e\\| \\| \\| \\|\u003cbr\u003e\\|---\\|---\\|---\\|\u003cbr\u003e\\|Trait\\|Effect\\|Suggested Festivity\\|\u003cbr\u003e\\|Present\\|The first time the spirit deals damage to a creature on its turn, it rolls 2d8. That creature takes additional cold damage equal to the result. If the result on both dice are the same, the target instead gains Temporary Hit Points equal to the result, and resists all damage dealt by the spirit until the start of the spirit\u2019s next turn.\\|christmas, wedding, eid al-fitr\\|\u003cbr\u003e\\|Regeneration\\|The spirit regains 3 hit points at the start of its turn. This trait does not trigger if it took damage from a critical hit since the end of its last turn.\\|easter, funeral\\|\u003cbr\u003e\\|Big Day Beatdown\\|The spirit aggressively targets the focus of the festivity. It has advantage on attack rolls against the creature(s) who are the subject of the current celebration, and the first time it deals damage to such a creature on its turn, it gains 1d10 Temporary Hit Points and can use its Reaction to move up to 30 feet.\\|birthday, bar mitzvah, graduation, quincea\u00f1era\\|\u003cbr\u003e\\|Drunken Merriment\\|The spirit is one with flowing champagne and neat spirits. The first time it deals damage to a creature each turn, that creature must succeed on a DC14 Constitution saving throw or become poisoned for the next minute. A creature poisoned in this way is also intoxicated. It has disadvantage on Dexterity saving throws and Dexterity-based Attack Rolls, and speaks with slurred speech. A creature can repeat this save at the end of its turns, ending the effect on a success.\\|new year, rosh hashanah\\|\u003cbr\u003e\\|Dead Party. (Recharge 6)\\|The Spirit knows the spell Animate Dead, and can use its Action to cast it without components. When it does so, it can choose the carcasses of beasts (such as carved chicken, suckling pig, etc.) to animate as zombies or skeletons, in addition to the bones and corpses of humanoids.\\|d\u00eda de muertos, halloween\\| | | | | | |\u003cbr\u003e| actionS | | | | | |\u003cbr\u003e| Multiattack. The Holiday Spirit makes two Sapping Touch attacks.\u003cbr\u003e\u003cbr\u003eSapping Touch. Melee Weapon Attack: +6 to hit, reach 5 ft., one target. Hit: 13 (2d8 + 4) necrotic damage, and the target feels a wave of apathy wash over them. They have a -1 penalty to the next attack roll or saving throw they make before the end of their next turn.\u003cbr\u003e\u003cbr\u003eFluid Fling. The Spirit hurls a fragment of its fluid body at a point it can see within 60 feet. Creatures within 10 feet of that point must succeed on a Dexterity saving throw, taking 4d10 poison damage and falling prone on a failed save. On a successful save, they take half as much damage and do not fall prone. | | | | | |","https:\u002f\u002fdocs.google.com\u002fdocument\u002fd\u002fe\u002f2PACX-1vS6lUZOVfTes0fREKrjtLjDXrZ-oZkxG3jeoAdIFJErzhnTc82UnTnXKRTlWVBrhxy9c3bBBdj8Nkh0\u002fpub","","Bending Style: Earthbending  \u003cbr\u003eLevel: Advanced  \u003cbr\u003eRange: Touch  \u003cbr\u003eEffect: Petrification  \u003cbr\u003eCost: 1+ Earthbending Slots  \u003cbr\u003eDuration: Concentration until the start of your next turn.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eDescription:\u003cbr\u003e\u003cbr\u003eThe Petrifying Grasp technique allows a skilled Earthbender to turn their target to stone, immobilizing them and potentially petrifying them entirely with sustained effort. This versatile technique can be used for both offensive and restorative purposes, providing powerful utility to the Earthbender.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e1. Activation:  \u003cbr\u003e    To activate the technique, the Earthbender must successfully touch the target and expend at least one Earthbending Slot. The target must make a Constitution saving throw (DC = 10 + Earthbender's Proficiency + Earthbender's Wisdom Modifier). On a failed save:\u003cbr\u003e    \u003cbr\u003e    - If the target's current hit points are lower than the total rolled using the Earthbender's d10s (one per slot spent), the target is paralyzed for 1 round.\u003cbr\u003e    - If concentration is maintained for an additional round, the target becomes fully petrified.\u003cbr\u003e2. Petrification:  \u003cbr\u003e    While petrified, the target becomes an inanimate statue of stone. It is immune to damage, conditions, and effects until unpetrified.\u003cbr\u003e    \u003cbr\u003e3. Unpetrification:  \u003cbr\u003e    The Earthbender can reverse the petrification by expending the same number of Earthbending Slots used to petrify the target. This requires touch and an Action to perform.\u003cbr\u003e\tWaterbenders are also capable of unpetrifying, but must use the doubled abount of Waterbending Slots\u003cbr\u003e    \u003cbr\u003e4. Limitations:\u003cbr\u003e    \u003cbr\u003e    - The Earthbender must maintain concentration to progress from paralysis to full petrification.\u003cbr\u003e    - If concentration is broken, the target is no longer paralyzed or petrified.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eNotes for GM:\u003cbr\u003e\u003cbr\u003e- Use this technique to introduce tension in battles where an Earthbender player or NPC needs to decide between offensive power and concentration management.\u003cbr\u003e- A petrified target can serve as an interesting story hook, such as an ancient figure frozen in time or a character who must be carefully unpetrified to avoid damage.\u003cbr\u003e\u003cbr\u003eEarth Techniques | Bending Mechanics | Combat Abilities","","A vibrant Earth Kingdom festival, featuring opportunities for roleplay, games, and uncovering local rumors.","The players meet a famous Earth Kingdom sculptor who uses Earthbending to create works of art. Potential for puzzles or a heist story.","","A challenge requiring precise Earthbending control, such as moving a delicate object or navigating a collapsing cave.","Players defend or breach a fortress using Earthbending tactics. Includes scalable mechanics for different player levels.","","A sprawling network of caves hiding bandits, lost treasures, or ancient Earth Kingdom artifacts.","The players uncover a smuggling ring operating beneath a major Earth Kingdom city.","","Hidden agendas during a local festival, such as smuggling or political rivalries.","","The party must infiltrate or attack a bandit camp causing problems for a nearby town. Scalable combat and stealth options.","","A session where the party is ambushed by bandits. Includes a scalable encounter table and potential motivations for the bandits.","The party must find a lost Air Nomad relic. Options for clues, red herrings, and NPCs involved.","","Detailed mechanics for a combat scenario with bandits, including scalable stats and optional objectives.","A beast attack on a village, with rules for scaling the beast\u2019s strength and integrating environmental hazards.","","A reusable template for creating scalable combat challenges.","A reusable template for crafting social or dialogue-heavy scenarios.","","A reusable template for creating Earthbending-based puzzles and challenges.","A reusable template for designing political intrigue scenarios.","","Clues uncovered in a marketplace dispute that lead to a larger conspiracy.","A scavenger hunt for an ancient artifact, with puzzles and conflicting NPC objectives.","","Options for resolving a bandit encounter through dialogue, including persuasion challenges and NPC personality traits.","The party witnesses a dispute in a busy marketplace and can choose to mediate, escalate, or exploit the situation.","Skybison Polo Festival Extravaganza\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003eThe Skybison Polo Festival is an annual event held in the Air Nomad territories, combining thrilling competitions, festive games, and a cultural celebration of the bond between Air Nomads and their beloved skybison. This module introduces the players to the festival, offering opportunities for interaction, skill challenges, and intrigue.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Locations\u003cbr\u003eThe Festival Grounds\u003cbr\u003e- A large, open area with colorful tents, food stalls, and stages for musical performances.\u003cbr\u003e- Games and activities like skybison rides, airbending obstacle courses, and market stalls selling unique wares.\u003cbr\u003e\u003cbr\u003eThe Polo Arena\u003cbr\u003e- The centerpiece of the festival, with a massive circular arena designed for skybison polo.\u003cbr\u003e- Spectators sit in tiered seating, cheering loudly as teams compete.\u003cbr\u003e\u003cbr\u003eThe Betting Tent\u003cbr\u003e- A lively hub where festival-goers can place bets on their favorite teams or players.\u003cbr\u003e- Operated by a charismatic Air Nomad known as Garo the Gamester.\u003cbr\u003e\u003cbr\u003eThe Stables\u003cbr\u003e- A quieter area where the competing skybison are cared for.\u003cbr\u003e- Players might meet the skybison caretakers or sneak around to uncover secrets.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey NPCs\u003cbr\u003eMaster Tenzho\u003cbr\u003e- An elder Air Nomad and referee of the polo matches. Wise but with a mischievous sense of humor.\u003cbr\u003e- Knows much about the history of skybison polo.\u003cbr\u003e\u003cbr\u003eGaro the Gamester\u003cbr\u003e- A charming and slightly shady Air Nomad who runs the betting tent.\u003cbr\u003e- Always looking for a way to turn a profit, possibly at the expense of honesty.\u003cbr\u003e\u003cbr\u003eTeam Azure Wings\u003cbr\u003e- A team of young, brash Air Nomads eager to prove their skills.\u003cbr\u003e- Might invite the players to join their team if they need extra members.\u003cbr\u003e\u003cbr\u003eTeam Sky Soarers\u003cbr\u003e- The reigning champions, led by the confident Kani Windstride.\u003cbr\u003e- They are skilled but harbor a secret\u2014they may be cheating to maintain their streak.\u003cbr\u003e\u003cbr\u003eRavi the Snack Vendor\u003cbr\u003e- A jovial vendor selling skybison-themed snacks.\u003cbr\u003e- Often hears interesting gossip from festival-goers.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eModule Hooks\u003cbr\u003e- An Invitation to Compete: A friendly Air Nomad approaches the players and invites them to join Team Azure Wings, either as players or strategists.\u003cbr\u003e- Suspicious Activity: Players overhear rumors of Team Sky Soarers cheating. They can investigate by talking to NPCs, sneaking into the stables, or tracking unusual behavior.\u003cbr\u003e- High-Stakes Betting: Garo the Gamester offers the players a deal to rig a match or uncover potential rigging by others.\u003cbr\u003e- Festival Trouble: A rogue skybison causes chaos, giving players a chance to save festival-goers and show their skills.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Activities and Challenges\u003cbr\u003eSkybison Polo Match\u003cbr\u003e- A dynamic game where players use bending abilities or athletic prowess to assist their team in scoring goals.\u003cbr\u003e- Structured as a series of skill challenges, with opportunities for creativity and teamwork.\u003cbr\u003e\u003cbr\u003eBetting and Investigation\u003cbr\u003e- Players can place bets, investigate odds, or catch cheaters in the act.\u003cbr\u003e- Success depends on Insight, Persuasion, and Stealth rolls.\u003cbr\u003e\u003cbr\u003eFestival Games\u003cbr\u003e- Airbending obstacle courses, pie-eating contests, and skybison riding challenges offer chances for fun and minor rewards.\u003cbr\u003e\u003cbr\u003eThe Final Match\u003cbr\u003e- If the players participate in or interfere with the final match, it\u2019s a climactic scene with high stakes.\u003cbr\u003e- The outcome affects the players' reputation among the Air Nomads.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eComplications and Twists\u003cbr\u003e- Cheating Exposed: If the players expose Team Sky Soarers\u2019 cheating, the festival becomes tense, and the players must help restore fairness.\u003cbr\u003e- Skybison Stampede: Midway through the festival, a group of frightened skybison rampages through the grounds, requiring quick Action to protect the crowd.\u003cbr\u003e- A Mysterious Stranger: An enigmatic figure offers the players a chance to sabotage the match for a hefty reward, creating a moral dilemma.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eRewards\u003cbr\u003e- Air Nomad Artifacts: Unique trinkets and gear, such as a Skybison Whistle or a Windcatcher Cloak.\u003cbr\u003e- Favor of the Air Nomads: Unlock access to future Air Nomad storylines or resources.\u003cbr\u003e- Reputation and Renown: Gain prestige among festival-goers or uncover secrets tied to the Air Nomads\u2019 history.","","Exploring an Air Nomad temple with traps, lore, and possible combat encounters.","Random encounter tables for traveling through uncharted wilderness.","","wikigraph_treemap.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 2\u003cbr\u003e- Range: 5  Airbending Slot meters.\u003cbr\u003e- Attack Roll: Dex + Proficiency.\u003cbr\u003e- Damage: 1d10 bludgeoning per Airbending Slot. Deals another 1d10  Airbending Slot if the Creature hits a Wall.\u003cbr\u003e- Effects:\u003cbr\u003e\t- Utilize airbending to dash towards an enemy within range within line of sight and hit them with a fast blow of pressurised air. The Target has to succeed a Strength saving throw against your Airbending DC or be knocked back your travelled distance this turn. Deals another 1d10  Airbending Slot if the Creature hits a Wall or similar.\u003cbr\u003eMovement\u003cbr\u003eAirbending\u003cbr\u003eMovement\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 3 \u003cbr\u003e- Range: CL  1 meters.\u003cbr\u003e- Duration: Concentration, up to 1 Minute.\u003cbr\u003eEffects:\u003cbr\u003e- Harness precision air currents to perform subtle or delicate tasks from a distance.\u003cbr\u003e-  Manipulate a small pbject within range or make fine adjustments as if using your hands.\u003cbr\u003e- You can perform sleight-of-hand checks or disable small mechanisms remotely.\u003cbr\u003eUsage: Precision tool for intricate tasks or stealth.\u003cbr\u003eLinks:\u003cbr\u003e- Utility\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 3 Earthbending Slot meters\u003cbr\u003e- Attack Roll: Strength + Proficiency.\u003cbr\u003e- Damage: 1d6   Earthbending Slot bludgeoning.\u003cbr\u003eEffect:\u003cbr\u003e- Lift and throw a small rock. Simple ranged attack.\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eLevel 2\u003cbr\u003e- Action: 1 #Reaction.\u003cbr\u003e- Range: 2 Ea
