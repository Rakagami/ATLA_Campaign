ot large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand....","","DMPCs\u003cbr\u003eLotus...","","","","- Session 1 The Spirit Within\u003cbr\u003e- The Lotus Fractures...","- The Spirit Gauge\u2019s Purpose\u003cbr\u003e- Betrayals and Deceptions...","- The Avatar\u2019s Legacy\u003cbr\u003e- The Final Confrontation...","Title: Shattered Spirit, Rising Lotus\u003cbr\u003e- The Ceremony of the Lotus...","The Lotus\u003cbr\u003e- Home of the ceremony and spiritual hub....","Act 1: Unveiling the Threat\u003cbr\u003e- PCs discover they hold fragmented aspects of the Avatar Spirit....","1. Balance vs. Independence:\u003cbr\u003eExplores centralized power vs. collective leadership....","Scene Setting:\u003cbr\u003eThe campaign begins at the serene Temple of the The Lotus, where benders from across the world gather for the annual Ceremony of the Lotus....","Story\u003cbr\u003eLinks:...","","","","Organisations\u003cbr\u003eOverview:...","","Marjorie TBA","","\u00a71 This is all fun and games.\u003cbr\u003e\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs....","Defensive:\u003cbr\u003eMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance....","How hard it is to hit you.\u003cbr\u003eBase Evasion: 10 + Dex","Collectionfile\u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME...","","Glacial Temple\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground...","Properties:\u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated....","Form: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.\u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes....","Location: Southern Water Tribe tundra, near the Glacial Temple\u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round...","","Type: Water Tribe Island Village\u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves...","","The shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e\u003e \"There was\u2026 someone who always believed. The High Priest. Master Anzu....","","\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements....","Location: Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\u003cbr\u003eSituation:...","Baezu \u2013 Earthbender Master of Resonance\u003cbr\u003eRole: Boss \u2013 Controller, Support, Spiritual Conduit...","Plothook\u003cbr\u003eLocation: Omashu...","","City of Murmura\u003cbr\u003eTags: #PatolaMountainRange #Murmura #Airbending #Monastery...","City of Zephyros\u003cbr\u003eTags: #PatolaMountainRange #Zephyros #Airbending #Monastery...","Earmur\u003cbr\u003eTags: #PatolaMountainRange #Fauna #Soundbending...","","Overview:\u003cbr\u003eTwin siblings from Sekan\u2019to whose seamless coordination has turned their unique dual-element fusion into an art form. They\u2019re local legends among younger benders and are being watched closely by the Crystalfire Circle....","\ud83e\udded Hook Summary:\u003cbr\u003eWhile traveling the harsh Si Wong Desert, the heroes spot a mysterious gleam atop a sandstone spire\u2014a rhythmic flash of white light that appears unnatural, almost like a signal. Locals mention an ancient legend of a \u201cstar-serpent\u201d and a tribe of light-forgers hidden within the rock. The party must brave scorching winds, treacherous slopes, and possibly spiritual interference to uncover the truth....","DC 17\u003cbr\u003eType: Greater Spirit...","\ud83d\udcc4\u003cbr\u003eOverview:...","Elemental Roots: Firebending + Crystal-focused Earthbending\u003cbr\u003eNickname: Crystalfire Flash or Gleam-bending...","\ud83c\udf0d Setting: Village of Sekan'to (Si Wong Desert)\u003cbr\u003e- Hidden within a towering mesa in the Si Wong Desert, Sekan'to is carved into rich quartz veins deep in the desert\u2019s sandstone spires....","","Description\u003cbr\u003e- Appearance: A colossal peaceful and good spirit creature that is a hybrid between a toad and an elephant. It has thick, webbed feet, long elephant tusks, and a bloated, amphibian-like body with slick moist skin. Its texture resembles that of a toads \u2014 moist, clothed in simple silk robes. On its back is a disturbing cyst-like growth shaped like a smaller toad's face, with a trunk for a tongue hanging limply. The creature is ancient and wise, embodying Earth and Water, and is surrounded by a shimmering aura of mist....","","Overview\u003cbr\u003e- Location: Hidden beneath Si Wong Rock , central Si Wong Desert....","","I maybe want an arc there between metalbender and airbender characters to find ways to woek together.\u003cbr\u003eType: Spirit Beast...","","","Name: Kaedo\u003cbr\u003eAge: Mid-twenties...","A Dark humnaoid Cat like Spirit that has a large shard of Vaatu and was therefore corrupted early. He supresses the dark as good as he cans but the dark spirit also gives him the gifts to be an elite assasin. He ion, travel between worlds, and subtle influence rather than raw damage....","","10 + Strength + Proficiency","Earthbending Moves Progression Table\u003cbr\u003eLevel | Accessible Slots | Total Moves (Newly Learned)...","Overview:\u003cbr\u003eEarthbenders are solid and steadfast, drawing upon the Strength of their bodies and the stability of the ground beneath them. Their techniques focus on defense, fortification, and manipulating terrain. Rather than relying on agility to avoid blows, earthbenders create barriers, raise armor ratings, and reinforce their allies. They harness Earth Charges to shape stone and metal, providing a constant, reliable source of defense and stability....","Earthbending rules\u003cbr\u003eEarthbending Slot...","","Core Attributes of Firebending\u003cbr\u003efirebending #coreattributes...","10 + Wisdom + Proficiency\u003cbr\u003eFirebending","Firebending Slots Progression Table\u003cbr\u003eLevel | Accessible Slots | Total Moves (Newly Learned)...","- Stress Level: Firebenders gain a stress level counter, starting at 0. Stress increases by 1 each time the firebender is hit by an attack. For every Stress Level the Firebender suffers -1 to attack Rolls but +1 to any damage. At high levels, stress can be managed or turned into a weapon. At the End of each of your Turn you can roll a Wisdom DC 20 - Stress Level. If successful the Stresslevel goes Down by 1.\u003cbr\u003eFirebending","Stress Management Moves\u003cbr\u003efirebending #stressmanagement...","","","Collectionfile\u003cbr\u003eIf Concentration is not broken the Water Charges are refunded....","Water Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003eWaterbottle Water Charges...","10 + Int + Proficiency\u003cbr\u003eWaterbending","Your Waterbending Level.\u003cbr\u003eWaterbending","Overview:\u003cbr\u003eWaterbenders are versatile combatants who manipulate water, ice, and mist with fluid, adaptive techniques. Unlike other benders, they rely on a resource called Water Charges to perform bending abilities. Their style focuses on redirection, control, and adaptability, drawing power from their environment....","How efficiently you use your Waterbottle  that you can carry with you.\u003cbr\u003eWaterbending Level | Waterbottle Water Charges...","","Chi Blocking Rules\u003cbr\u003eChi Blocking is a specialized combat style that relies on targeting an opponent's pressure points to immobilize them or impede their bending abilities....","","The creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action or can remove it with your bending more efficiently.","Paralysis Mechanics\u003cbr\u003eCertain Chi Blocking moves cause paralysis, preventing the target from taking actions or bending for a specified duration....","A slowed creatures Movement Speed is halved and it can not use any #Bonusactions or #reactions. ( #Action is allowed)","","","Grants Damage reduction.\u003cbr\u003eGeneral Armor reduces all Damage Types in addition to their specific type Armor (other than spiritual)....","Barrier Armor Whenever you suffer unblocked damage Barrier Armor halves (rounded down)\u003cbr\u003eFor example when you have 15 Barrier Armor and suffer 18 damage you suffer 3 Damage and Barrier Armour halves to 7.","Collectionfile\u003cbr\u003eCharacter Level. This will be important to scale moves....","Charisma","","","Reduces All Damage Types other than Spiritual Damage.","Hitpoints\u003cbr\u003eWhen your HP reach 0 you are unconscious and bleeding out....","Very mandatory for living.\u003cbr\u003eMax Hitpoints...","Intelligence\u003cbr\u003eOne of the 6 Stats. Important for Waterbending Moves....","Auotoexplanatory.","You max Hitpoints are determined by your Level and Bending Type:\u003cbr\u003eEarth: 1d12 per CL...","","Collectionfile\u003cbr\u003eCLRange | Proficiency Bonus...","","Temporary Hitpoints are always used first and usually don't Stack but Situational exc 500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending Moves.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","\ud83d\ude80 How to Set Up\u003cbr\u003e\u003cbr\u003e1. Clone or Download the Repository\u003cbr\u003e    \u003cbr\u003e    git clone \u003crepo-url\u003e\u003cbr\u003e    \u003cbr\u003e    Or download as ZIP and extract.\u003cbr\u003e    \u003cbr\u003e2. Open as an Obsidian Vault\u003cbr\u003e    \u003cbr\u003e    - Start Obsidian.\u003cbr\u003e        \u003cbr\u003e    - Select \"Open folder as vault\".\u003cbr\u003e        \u003cbr\u003e    - Navigate to the downloaded repository and open it.\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e\ud83d\udc49 This gives you the best file explorer experience and lets you use all notes, links, and structures directly.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eGit Plugin\u003cbr\u003e\u003cbr\u003eStep 1 \u2014 Install Git\u003cbr\u003e\u003cbr\u003eDownload and install Git: https:\u002f\u002fgit-scm.com\u002fdownloads\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStep 2 \u2014 Generate a Personal Access Token\u003cbr\u003e\u003cbr\u003eIn GitHub (requires an account):\u003cbr\u003e\u003cbr\u003e- Go to Settings \u2192 Developer settings \u2192 Personal access tokens \u2192 Tokens (classic).\u003cbr\u003e    \u003cbr\u003e- Click \u201cGenerate new token\u201d.\u003cbr\u003e    \u003cbr\u003e- Set:\u003cbr\u003e    \u003cbr\u003e    - Scopes: Select repo.\u003cbr\u003e        \u003cbr\u003e    - Expiration: Choose no expiration (recommended for backups).\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eStep 3 \u2014 Install the Obsidian Git Plugin\u003cbr\u003e\u003cbr\u003eIn Obsidian:\u003cbr\u003e\u003cbr\u003e- Go to Settings \u2192 Community plugins.\u003cbr\u003e    \u003cbr\u003e- Enable community plugins.\u003cbr\u003e    \u003cbr\u003e- Search for \u201cObsidian Git\u201d and install it.\u003cbr\u003e    \u003cbr\u003e- Restart Obsidian.","\ud83d\udd04 How to Sync Your Vault (Git + Collectionfiles)\u003cbr\u003e\u003cbr\u003eTo sync your local vault with the remote repository and automatically update all collectionfiles (backlink blocks):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython -c \"from WikiFileSystemManager import Sync; Sync()\"\u003cbr\u003e\u003cbr\u003eTo manually recreate all collectionfiles (backlink blocks) without syncing:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --recreate-collectionfiles\u003cbr\u003e\u003cbr\u003eThis will:\u003cbr\u003e\u003cbr\u003e- Stage, commit, and push all local changes\u003cbr\u003e- Pull and merge the latest from origin\u002fmain\u003cbr\u003e- Recreate all collectionfiles (backlink blocks)\u003cbr\u003e- Commit and push any new collectionfile changes\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\ude80 Quickstart\u003cbr\u003e\u003cbr\u003eCopy-paste friendly commands. See also: WikiFileSystemManager (Manual), WikiFileSystemManager (FAQ)\u003cbr\u003e\u003cbr\u003e\u003e Tips: Start with --dry-run, scope with --ext .md, keep backups with --backup .bak.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSafe wiki-link bracketing\u003cbr\u003e\u003cbr\u003eBracket plain mentions, skipping already-linked:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"[[Bumi]]\" --bracket --dry-run\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"[[Bumi]]\" --bracket --backup .bak\u003cbr\u003e\u003cbr\u003eLiteral find\u002freplace\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"Omashu\" --replace \"City of Omashu\" --backup .bak\u003cbr\u003e\u003cbr\u003eCase-sensitive:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --case-sensitive --find \"Spirit\" --replace \"spirit\" --backup .bak\u003cbr\u003e\u003cbr\u003eWith punctuation\u002fspecial chars (still literal):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --find \"old\" --replace \"new\" --backup .bak\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eScope control\u003cbr\u003e\u003cbr\u003eOnly session logs:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py Sessions --ext .md --include \"\u002fSession.md\" --find \"Appa\" --replace \"Appa the Sky Bison\"\u003cbr\u003e\u003cbr\u003eExclude extra dirs:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --exclude-dir \"Archive\" \"Exports\" --find \"Sokka\" --replace \"Sokka (Water Tribe)\"\u003cbr\u003e\u003cbr\u003eSingle file:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py Notes\u002fNPCs\u002fKatara.md --find \"Waterbending\" --replace \"Waterbending (Healing)\"\u003cbr\u003e\u003cbr\u003eFollow symlinks (rare):\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --follow-symlinks --ext .md --find \"Ba Sing Se\" --replace \"Ba Sing Se (Lower Ring)\"\u003cbr\u003e\u003cbr\u003eMultiple roots:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py Notes Lore --ext .md --find \"Pai Sho\" --replace \"Pai Sho (White Lotus)\"\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCollections (backlinks)\u003cbr\u003e\u003cbr\u003eCreate\u002fupdate Action.md backlinks block + AllAction.md embeds:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --collectionfile \"Indexes\u002fAction.md\" --compact\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAppend lines\u003cbr\u003e\u003cbr\u003eAppend a footer if missing:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md --append \"Index:NPCs\" --backup .bak\u003cbr\u003e\u003cbr\u003eCombine append + replace in one pass:\u003cbr\u003e\u003cbr\u003ebash\u003cbr\u003epython WikiFileSystemManager.py --ext .md \\\u003cbr\u003e\t--append \"Index:Sessions\" \\\u003cbr\u003e\t--find \"Zuko\" --replace \"Zuko (Crowned Prince)\" \\\u003cbr\u003e\t--backup .bak --compact\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eThat\u2019s it. Keep --dry-run until output looks right; then drop it and keep --backup .bak for safety.","","","","","","","","","Obsidian Plugins Setup for Developers & Data Scientists\u003cbr\u003e\u003cbr\u003eThis guide covers the installation and basic setup of the best Obsidian plugins for code, data workflows, dashboards, and research.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e1. Install Plugins\u003cbr\u003e1. Open Settings \u2192 Community Plugins.\u003cbr\u003e2. Enable Safe Mode if it's disabled.\u003cbr\u003e3. Click Browse.\u003cbr\u003e4. Search and install the following plugins:\u003cbr\u003e   - Dataview\u003cbr\u003e   - Templater\u003cbr\u003e   - QuickAdd\u003cbr\u003e   - RunJS\u003cbr\u003e   - Note Toolbar\u003cbr\u003e   - Better Search Views\u003cbr\u003e   - Obsidian Tags Overview\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e2. Plugin Configuration\u003cbr\u003e\u003cbr\u003eDataview\u003cbr\u003e- Go to Settings \u2192 Dataview.\u003cbr\u003e- Enable JavaScript Queries for dynamic calculations.\u003cbr\u003e- Example query to list all datasets:\u003cbr\u003e    dataview\u003cbr\u003e    TABLE file.name, size, date\u003cbr\u003e    FROM \"datasets\"\u003cbr\u003e    SORT date DESC\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eTemplater\u003cbr\u003e- Set Template Folder Location: templates\u002f\u003cbr\u003e- Create a file dataset-template.md:\u003cbr\u003e    markdown\u003cbr\u003e{{title}}\u003cbr\u003e    Date: \u003c% tp.date.now(\"YYYY-MM-DD\") %\u003e\u003cbr\u003e    Source: \u003c% tp.file.cursor() %\u003e\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eQuickAdd\u003cbr\u003e- Create a new Capture Command \u2192 \u201cNew Dataset\u201d\u003cbr\u003e- Use the dataset-template.md to quickly add new entries.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eRunJS\u003cbr\u003e- Go to Settings \u2192 RunJS.\u003cbr\u003e- Add a snippet:\u003cbr\u003e    js\u003cbr\u003e    const data = [1,2,3,4];\u003cbr\u003e    return data.map(x =\u003e x  2);\u003cbr\u003e    \u003cbr\u003e- Run inline JS inside notes with ==js blocks.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eNote Toolbar\u003cbr\u003e- Add quick buttons for:\u003cbr\u003e    - \u201cNew Dataset\u201d\u003cbr\u003e    - \u201cRun Dataview Query\u201d\u003cbr\u003e    - \u201cOpen Dashboard\u201d\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eBetter Search Views\u003cbr\u003e- Use advanced search like:\u003cbr\u003e    \u003cbr\u003e    tag:#dataset size:\u003e10MB\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eObsidian Tags Overview\u003cbr\u003e- Go to the Tags Overview pane to visualize tags as a dataset tree.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e3. Recommended Folder Structure\u003cbr\u003eplaintext\u003cbr\u003e\ud83d\udcc2 vault\u002f\u003cbr\u003e \u251c\u2500\u2500 datasets\u002f\u003cbr\u003e \u2502   \u251c\u2500\u2500 dataset1.md\u003cbr\u003e \u2502   \u251c\u2500\u2500 dataset2.md\u003cbr\u003e \u251c\u2500\u2500 dashboards\u002f\u003cbr\u003e \u2502   \u251c\u2500\u2500 main-dashboard.md\u003cbr\u003e \u251c\u2500\u2500 templates\u002f\u003cbr\u003e \u2502   \u251c\u2500\u2500 dataset-template.md\u003cbr\u003e \u251c\u2500\u2500 scripts\u002f\u003cbr\u003e \u2502   \u251c\u2500\u2500 data-cleaning.js\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e4. Next Steps\u003cbr\u003e- Combine Dataview + Templater to generate automatic dashboards.\u003cbr\u003e- Use RunJS for inline computations and plotting.\u003cbr\u003e- Tag datasets with #raw, #processed, and #visualized for powerful filtering.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003ePro Tip:  \u003cbr\u003eUse Obsidian Git to version-control datasets and scripts.","","","https:\u002f\u002favatar.fandom.com\u002fwiki\u002fHistoryoftheWorldofAvatar#Eranames","","Collectionfile\u003cbr\u003eCollectionfile \u003cbr\u003eSpiritbending Moves\u003cbr\u003eSpiritbending moves are special techniques that use the Avatar Spirit's connection to the Spirit World. They tend to be more narrative and rarely purely destructive \u2014 instead focusing on influence, protection, communication, and spiritual transformation.\u003cbr\u003eCore contract:\u003cbr\u003e- Inputs: Spiritbending slots (from Bridge Level, Spirit Stones, or Avatar Spirit Checks).\u003cbr\u003e- Outputs: A move effect (see moves below).\u003cbr\u003e- Failure modes: On a failed GM opposed roll or failed concentration, some spirit effects can backfire or produce an unintended Spirit Echo.\u003cbr\u003eSample Moves\u003cbr\u003e1. Spirit Ward (cost: 2 slots)\u003cbr\u003e- Effect: Create a protective aura that grants allies within 3m + (1m \u00d7 slots used) advantage on Spirit-related saves for X minutes.\u003cbr\u003e2. Soul Sight (cost: 1 slot)\u003cbr\u003e- Effect: You and one ally can see invisible spirits or spirit effects for 1 minute. Provides a single insight on a spirit's nature.\u003cbr\u003e3. Calm of Ages (cost: 3 slots)\u003cbr\u003e- Effect: Attempt to pacify a hostile spirit or calm an area. Target makes a WIS save vs DC = 8 + slots used; on failure the spirit is pacified for 1d6 minutes.\u003cbr\u003e4. Spirit Relay (cost: variable)\u003cbr\u003e- Effect: Spend slots to send a short message into the Spirit World (or receive one). Each slot adds clarity and range.\u003cbr\u003e5. Ancestral Echo (cost: 4 slots)\u003cbr\u003e- Effect: Temporarily call on an ancestor's skill \u2014 grant an ally a one-time automatic success on a non-combat skill check tied to the ancestor's expertise.\u003cbr\u003eDesign notes:\u003cbr\u003e- Moves should be negotiated with the GM for balance and narrative fit.\u003cbr\u003e- Spiritbending is more flexible than elemental bending: creativity and roleplay matter.\u003cbr\u003eSpiritbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Spiritbending Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Avatar Spirit Bridge\u003cbr\u003e                  \u2514\u2500\u2500 Spiritbending.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","\u003c!-- No backlinks found --\u003e","\u003c!-- No backlinks found --\u003e","","","Type: Air Nomad Offshoot  \u003cbr\u003eLocation: Cliffside plateaus bordering the Great Si Wong Desert  \u003cbr\u003eRole: High-speed messengers, scouts, and storm-chasers of the desert  \u003cbr\u003eSpecialized Style: Thermal Riding\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eThe Crimson Sails are a unique, nomadic sect of Air Nomads adapted to life on the edge of the Si Wong Desert. They do not dwell in temples or static sanctuaries, but aboard elegant skiffs and gliders designed to harness the fierce thermal currents that rise from the sun-scorched sand. Painted in brilliant reds and ochres, their vessels shimmer like embers in the sky.\u003cbr\u003e\u003cbr\u003eBound by the winds and the rhythms of the desert heat, the Crimson Sails are expert couriers, capable of crossing vast expanses far faster than beasts or traditional caravans. However, their airbending is heavily dependent on the desert\u2019s thermal conditions; at night, without the rising heat, they become grounded or slow-moving.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e\u003cbr\u003e- Daybound Nomadism: Their society revolves around daylight. At night, the flotilla anchors to cliff alcoves or ruins. Festivals, meals, and gatherings are nocturnal, while travel and work occur during the heat of the day.\u003cbr\u003e    \u003cbr\u003e- Messenger Guild: The Crimson Sails operate an informal courier and intelligence network across the Earth Kingdom desert frontier. They are trusted by traders, desert clans, and outposts to deliver messages, maps, and even small goods.\u003cbr\u003e    \u003cbr\u003e- Spiritual Traditions: Though descended from the Air Nomad monastic line, the Crimson Sails follow a more animistic interpretation of airbending\u2014viewing the desert winds as living spirits that must be listened to, not commanded.\u003cbr\u003e    \u003cbr\u003e- Cliff Shrines: Instead of temples, they maintain wind shrines at high cliffs where they meditate and commune with the desert wind spirits.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAirbending Style: Thermal Riding\u003cbr\u003e\u003cbr\u003eA fast, acrobatic form of airbending that specializes in using heat-induced updrafts. Unlike traditional circular airbending, Thermal Riding involves linear acceleration, vertical climbs, and divebomb maneuvers.\u003cbr\u003e\u003cbr\u003eKey Techniques\u003cbr\u003e\u003cbr\u003e- Updraft Spear: Used for rapid vertical ascents or launching allies over obstacles.\u003cbr\u003e    \u003cbr\u003e- Searing Glide: Gliders skim hot surfaces to catch lift or create sudden evasions.\u003cbr\u003e    \u003cbr\u003e- Cyclone Lance: A spiraling dive technique combining momentum and pressure for duels.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Figures\u003cbr\u003e\u003cbr\u003e- Sister Nhari: Elder wind-priestess and navigator. Keeper of the Flame Charts\u2014ancient wind maps burned into silk.\u003cbr\u003e    \u003cbr\u003e- Korran of the Lances: Champion aerial jouster and defense leader of the flotilla.\u003cbr\u003e    \u003cbr\u003e- Tama Reed-Singer: Renowned messenger known for solo crossings of the Empty Expanse.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConflicts & Hooks\u003cbr\u003e\u003cbr\u003e- A Night-Time Ambush: Without thermal lift, the Crimson Sails are vulnerable after dark. A rival faction may exploit this to sabotage a key courier mission.\u003cbr\u003e    \u003cbr\u003e- Desert Spirits Stirring: Strange wind patterns and dust devils are interfering with their gliding. Is it natural\u2014or something darker awakening beneath the sands?\u003cbr\u003e    \u003cbr\u003e- A Lost Shrine: A sandstorm uncovers an ancient Air Nomad relic near a long-buried cliff shrine. The Crimson Sails must recover it before sandbenders do.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConnections\u003cbr\u003e\u003cbr\u003e- Allies of the Si Wong Water Raiders for mutual desert survival.\u003cbr\u003e    \u003cbr\u003e- Sometimes in conflict with Sandbender Tribes who view them as sky-interlopers.\u003cbr\u003e    \u003cbr\u003e- Rumored to ferry secrets for the White Lotus across desert borders.","Collectionfile\u003cbr\u003eCollectionfile\u003cbr\u003e\u003cbr\u003e\u003e Note: Incensebending is understood as a hybrid craft combining multiple bending styles. Water and earth are used to grow and prepare the organic materials; fire dries and activates them for burning; and the resulting smoke carries a blend of those influences (often shaped further by air or spirit-affiliated bending). Many incense rituals therefore require cooperative inputs from different benders and are rich in mixed-element effects.\u003cbr\u003e\u003cbr\u003eIncencebending Team-Up Techniques\u003cbr\u003eAvatar Spirit Bridge Level\u003cbr\u003eX = y\\z\u003cbr\u003e\u003cbr\u003e- are the number of bending \u002f ritual slots contributed by each participant.\u003cbr\u003e- This encourages coordinated, complementary rituals rather than one person carrying the whole effect.\u003cbr\u003e- X = y \u00d7 z.\u003cbr\u003e\u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e\u003cbr\u003e\u003e - Spirit-bender contributes 2 slots (y = 2)\u003cbr\u003e\u003e - Airbender contributes 3 (z = 3)\u003cbr\u003e\u003e   \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese incense rituals are subtle but potent \u2014 they alter minds, environments, and the thin veil between worlds. Each scales with X and changes flavor based on the blend used.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf2b\ufe0f Sanctified Veil (White Juniper Blend)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Air- or Spirit-affiliated bender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e A delicate, shimmering smoke hangs in the air, softening perception and muffling intent.\u003cbr\u003e\u003cbr\u003e- Effect: Creatures within the area gain disadvantage on Perception checks and Wisdom saves for social or detection rolls for the duration. Allies chosen by the casters gain advantage on stealth and deception checks instead.\u003cbr\u003e- Radius: 3 meter \\ X\u003cbr\u003e- Duration: X \u00d7 2 minutes\u003cbr\u003e- Special: If X \u2265 10, the veil extends an extra 50% radius and grants allies a one-time free Hide action while moving silently.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Move through guarded temples, stage an ambush, or protect a ritual site from prying eyes.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Ember-Perfume Lure (Saffron Ash Incense)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Firebender or an allied social-bender\u003cbr\u003e\u003cbr\u003e\u003e Warm, spicy smoke slips into the minds of those who breathe it, pulling at curiosity and confidence.\u003cbr\u003e\u003cbr\u003e- Effect: Targets in area must make a WIS save of DC = X \\ 2 or become charmed toward the initiators for 1d6 rounds (hostile creatures act more hesitantly; NPCs may follow simple requests). Charmed creatures still defend themselves if attacked.\u003cbr\u003e- Radius: 2 meter \\ X\u003cbr\u003e- Duration: 1d6 rounds (save at end of each round)\u003cbr\u003e- Special: If X \u2265 8, affected creatures also take a -2 penalty to initiative while charmed. If X \u2265 14, the charm becomes temporary friendship \u2014 NPCs may swap information or small items.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Soften a patrol, win a persuasive encounter, or buy time during negotiations.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd6f\ufe0f Quieting Resin (Black Myrrh Compound)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Earth- or Spirit-bender with line of sight\u003cbr\u003e\u003cbr\u003e\u003e Dense resin smoke clings to thoughts and speech, dampening hostile intent and noisy magic.\u003cbr\u003e\u003cbr\u003e- Effect: Spellcasters and creatures concentrating must succeed on an INT or WIS save (player\u002fGM chooses) DC = X \\ 2 or lose concentration on any spell or sustained effect they are maintaining. Non-magical creatures suffer disadvantage on attack rolls while in the cloud.\u003cbr\u003e- Radius: X \\ 1.5 meters (round down)\u003cbr\u003e- Duration: X rounds\u003cbr\u003e- Special: If X \u2265 12, the cloud suppresses minor magical auras (up to X-level or equivalent narrative significance) for the duration.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Break enemy ritual focus, neutralize a summoning in progress, or create a bubble of calm in a chaotic fight.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf38 Memory Bloom (Lotus & Sandalwood)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Spirit- or Water-affiliated bender\u003cbr\u003e\u003cbr\u003e\u003e Fragrant petals swirl with memories; those who inhale see recollections as vivid sensory flashes.\u003cbr\u003e\u003cbr\u003e- Effect: Creatures who fail a CON save DC = X \\ 2 experience one vivid memory flash chosen by the caster (real or suggested). Mechanical effects: they take Xd6 psychic damage if the memory is traumatic, or they gain advantage on a single insight or recall check if the memory is helpful.\u003cbr\u003e- Radius: 1.5 meter \\ X\u003cbr\u003e- Duration: Instant effect; memories linger as a mood for X minutes (roleplay cue).\u003cbr\u003e- Special: If X \u2265 9, the caster may imprint a short, innocuous suggestion tied to the memory (no mind control) that gives a +2 modifier to a single upcoming check for the group.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Extract clues from an NPC, trigger a hidden memory, or create an emotional opening.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u26aa Spirit Soot Communion (Clear Resin Seed)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Spirit-bender with an Earth or Water ally in direct contact\u003cbr\u003e\u003cbr\u003e\u003e A ritual smoke binds the living and the drifting; the boundary thins and spirits may answer.\u003cbr\u003e\u003cbr\u003e- Effect: For the ritual duration, the casters can attempt to commune with local spirits. Mechanically: the group gains a ritual channel equal to 10 \\ X minutes of clear spirit communication or a spirit-bound boon (GM decides outcome). Creatures of ill intent suffer disadvantage on attacks against casters while the communion holds.\u003cbr\u003e- Radius: Line of sight up to 100 meters for spirit-sensing; physical effects center on the ritual site within 5 meters per X\u002f3 (round down).\u003cbr\u003e- Duration: Concentration (both\u002f all initiators) or up to 10 \u00d7 X minutes\u003cbr\u003e- Special: If X \u2265 15, the communion may bind a willing spirit temporarily (up to 24 hours) or close a small, unstable spirit rift if tied to the site's lore.\u003cbr\u003e\u003cbr\u003e- Narrative Use: Bargain with guardian spirits, learn local history from ghosts, or seal a haunted crossroads.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMechanical Notes & Edge Cases\u003cbr\u003e\u003cbr\u003e- Rituals that require concentration: if any initiator loses concentration (incapacitated, unconscious, or fails a concentration check), the ritual fails and dissipates.\u003cbr\u003e- Area overlaps: multiple incense effects stack only if they are clearly different in narrative and mechanical purpose; otherwise the stronger (higher X or more recent) takes precedence.\u003cbr\u003e- Immunities: creatures or entities immune to charm, psychic damage, or spirit influence are either fully or partially resistant \u2014 treat per-GM.\u003cbr\u003e- Large crowds: When targeting many creatures, scale number of forced saves by X and increase DC by +1 for each doubling of targets beyond (GM can simplify).\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSpiritbending\u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves","Location and Culture:\u003cbr\u003e\u003cbr\u003eNestled at the edge of the Si Wong Desert\u2019s shifting dunes, the Village of Mahzeen stands as a rare bastion of life in the arid wilderness. The settlement lies just a half-day\u2019s journey from an ancient Earthbending Temple, its sandstone spires visible on the distant horizon. Though not large, Mahzeen is renowned for its skilled Sandbenders, who have perfected a unique defensive technique that harnesses the versatile power of sand.\u003cbr\u003e\u003cbr\u003eThe villagers live in dome-shaped tents woven from desert fibers, arranged around a central oasis fed by a hidden spring. Worn banners and intricate stone carvings display their heritage: guardians of the desert\u2019s secrets, proud custodians of a bending style that focuses on defense, endurance, and cunning ambush tactics. These Sandbenders follow a strict code of balance, taught to them by the temple monks long ago.\u003cbr\u003e\u003cbr\u003eThe Sandbending Technique: \u201cSpiked Sand Sphere\u201d\u003cbr\u003e\u003cbr\u003eThe hallmark ability of Mahzeen\u2019s Sandbenders is the creation of a swirling sphere of sand that hardens into a protective shell adorned with razor-like spikes of hardened silica. Both a shield and a weapon, it reflects their philosophy\u2014protection first, then retribution.\u003cbr\u003e\u003cbr\u003eMechanics:\u003cbr\u003e\u003cbr\u003e- Cost: 3 Earth (or Sand) Charges\u003cbr\u003e    \u003cbr\u003e- Type: Action\u003cbr\u003e    \u003cbr\u003e- Range: Self\u003cbr\u003e    \u003cbr\u003e- Effect:  \u003cbr\u003e    The Sandbender calls upon the shifting dunes, pulling grains of sand from the ground and condensing them into a floating sphere around their body. The sphere grants temporary hit points and can lash out with sharp spikes.\u003cbr\u003e    \u003cbr\u003e    - Temporary Hit Points (THP): Gain THP equal to 3 times your level (or a number appropriate for your system) when you form the Spiked Sand Sphere.\u003cbr\u003e    - Defensive Bonus: While the sphere is active, you gain +1 to your Evasion Score and +2 to your AR (or equivalent defensive bonus in your ruleset).\u003cbr\u003e    - Duration: Concentration, up to 1 minute, or until the THP are depleted.\u003cbr\u003e\u003cbr\u003eAttacking with the Sphere:\u003cbr\u003e\u003cbr\u003e- As a Bonus Action (or Reaction when hit by a melee attack), you can command the spikes to strike out at a foe within 5 ft.\u003cbr\u003e- Attack Roll: Strength + Proficiency vs. Target\u2019s Evasion Score.\u003cbr\u003e- Damage: 1d8 + Strength modifier piercing damage.\u003cbr\u003e- Scaling Damage: The damage die increases by 1 step (e.g., from 1d8 to 1d10) for every 5 remaining THP in the sphere. For example:\u003cbr\u003e    - 15+ THP: 1d10 damage\u003cbr\u003e    - 10+ THP: 1d8 damage\u003cbr\u003e    - 5+ THP: 1d6 damage\u003cbr\u003e    - \u003c5 THP: 1d4 damage\u003cbr\u003e\u003cbr\u003eAs the THP are chipped away by enemy strikes and your own attacks, the sphere\u2019s integrity diminishes. Fewer remaining THP means smaller, less potent spikes. Skilled Sandbenders learn how to maintain their focus, refortify the sand with additional Charges, or time their attacks at the peak of the sphere\u2019s resilience.\u003cbr\u003e\u003cbr\u003eIn-World Significance:\u003cbr\u003e\u003cbr\u003e- Training and Tradition:  \u003cbr\u003e    Mahzeen\u2019s Sandbenders perfect the Spiked Sand Sphere technique through years of practice in the harsh desert climate. Initiates spend countless hours balancing water gourds atop columns of shifting sand, refining their focus to keep the sphere stable under pressure.\u003cbr\u003e    \u003cbr\u003e- Trade and Diplomacy:  \u003cbr\u003e    Adventurers and scholars traveling to the nearby Earth Temple often stop at Mahzeen to hire guides or seek instruction. Monks from the temple once taught the villagers about spiritual discipline and fortitude, and in return, the Sandbenders offer them their protective services against raiders and feral spirits that prowl the dunes.\u003cbr\u003e    \u003cbr\u003e- Rites of Passage:  \u003cbr\u003e    Young Sandbenders earn their place in Mahzeen\u2019s society by successfully conjuring and maintaining a Spiked Sand Sphere under trial conditions\u2014fending off controlled attacks from elders. Only then may they wear the village\u2019s distinctive sand-silk armbands, signifying their mastery of this unique technique.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eIn this way, the Spiked Sand Sphere embodies the village\u2019s identity: resilience in adversity, measured strength, and harmony with the unforgiving desert world they call home.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Strength\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending","","DMPCs\u003cbr\u003eLotus\u003cbr\u003eNight Bloom","","","","- Session 1 The Spirit Within\u003cbr\u003e- The Lotus Fractures\u003cbr\u003e- Building Alliances\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Session 1 The Spirit Within","- The Spirit Gauge\u2019s Purpose\u003cbr\u003e- Betrayals and Deceptions\u003cbr\u003e- The Shadowed Spirits","- The Avatar\u2019s Legacy\u003cbr\u003e- The Final Confrontation\u003cbr\u003e- The Avatar Reborn\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","Title: Shattered Spirit, Rising Lotus\u003cbr\u003e\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- The Lotus\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","The Lotus\u003cbr\u003e\u003cbr\u003e- Home of the ceremony and spiritual hub.\u003cbr\u003e\u003cbr\u003eCeremony of the Resonance\u003cbr\u003e\u003cbr\u003e- Celebration of unity, balance, and bending mastery.\u003cbr\u003e\u003cbr\u003eNight Bloom\u003cbr\u003e\u003cbr\u003e- Radical faction opposing the Avatar\u2019s central role.\u003cbr\u003e\u003cbr\u003eResonance Jade\u003cbr\u003e\u003cbr\u003e- Artifact measuring spiritual energy.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","Act 1: Unveiling the Threat\u003cbr\u003e\u003cbr\u003e- PCs discover they hold fragmented aspects of the Avatar Spirit.\u003cbr\u003e- Internal conflict: heightened bending abilities without unity.\u003cbr\u003e- Night Bloom\u2019s origins tied to a Lotus Fracture.\u003cbr\u003e\u003cbr\u003eAct 2: The Rise of the Night Bloom\u003cbr\u003e\u003cbr\u003e- Spirit Gauge\u2019s potential to destabilize balance.\u003cbr\u003e- Betrayals within the White Lotus.\u003cbr\u003e- Growing attacks from corrupted spirits.\u003cbr\u003e\u003cbr\u003eAct 3: The Broken Avatar\u003cbr\u003e\u003cbr\u003e- Truth of the Avatar\u2019s death and shattered spirit.\u003cbr\u003e- Final confrontation: Combine spirits to reform Avatar or share the essence among the group.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","1. Balance vs. Independence:  \u003cbr\u003e    Explores centralized power vs. collective leadership.\u003cbr\u003e    \u003cbr\u003e2. Personal Growth:  \u003cbr\u003e    Each PC\u2019s arc reflects their fragment of the Avatar Spirit.\u003cbr\u003e    \u003cbr\u003e3. Moral Dilemmas:  \u003cbr\u003e    The Night Bloom\u2019s ideals resonate with many; their morality isn\u2019t black and white.\u003cbr\u003e    \u003cbr\u003e4. Worldbuilding:  \u003cbr\u003e    Encourage player input for designing clans, bending styles, and spiritual entities.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Night Bloom\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","Scene Setting:\u003cbr\u003e\u003cbr\u003eThe campaign begins at the serene Temple of the The Lotus, where benders from across the world gather for the annual Ceremony of the Lotus.\u003cbr\u003e\u003cbr\u003e- PCs arrive as prodigies of their respective arts.\u003cbr\u003e- Subtle unease: elders whisper of spiritual disturbances.\u003cbr\u003e- PCs feel a fleeting resonance, but there\u2019s no spiritual response\u2014an ill omen.\u003cbr\u003e\u003cbr\u003eThe Attack on the Ceremony:\u003cbr\u003e\u003cbr\u003e- Smokebomb and the Voice:  \u003cbr\u003e    A black mist explosion (orchestrated by Isai Trekal) disrupts the ceremony.  \u003cbr\u003e    Voice: \u201cThe age of bending submission is over...\u201d\u003cbr\u003e    \u003cbr\u003e- Artifact Theft:  \u003cbr\u003e    The Order of the Night Bloom steals the Resonance Jade.\u003cbr\u003e    \u003cbr\u003e- Rogue Spirit Attack:  \u003cbr\u003e    PCs fend off a corrupted spirit, feeling faint resonance from the ritual during combat.\u003cbr\u003e    \u003cbr\u003e- Aftermath:  \u003cbr\u003e    The artifact is gone, and the PCs are tasked with investigating the theft.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- The Lotus\u003cbr\u003e- Night Bloom","Story\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Act 2 The Rise of the Night Bloom\u003cbr\u003e- Campaign Overview\u003cbr\u003e- Act 1 Unveiling the Threat\u003cbr\u003e- The Ceremony of the Lotus\u003cbr\u003e- Key Groups and Concepts\u003cbr\u003e- Recurring Themes and Player Agency\u003cbr\u003e- Main Story Arc A Shattered Avatar Spirit\u003cbr\u003e- Session 1 The Spirit Within\u003cbr\u003e- Act 3 The Broken Avatar\u003cbr\u003e- Modules\u003cbr\u003e- \u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eAvatar","","","","Organisations\u003cbr\u003eOverview:\u003cbr\u003e\u003cbr\u003eThe Lotus is a venerable organization dedicated to the balance of the world, acting as spiritual guides and protectors of harmony. They host the annual Ceremony of the Resonance, symbolizing their commitment to unity among benders.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUniform Design:\u003cbr\u003e\u003cbr\u003e- Colors:  \u003cbr\u003e    White and gold, symbolizing purity and enlightenment, with accents of light blue to represent spiritual connection.\u003cbr\u003e    \u003cbr\u003e- Style:\u003cbr\u003e    \u003cbr\u003e    - Flowing robes for spiritual leaders, with a lotus emblem embroidered on the chest.\u003cbr\u003e    - Soldiers wear sturdy uniforms with plated armor on shoulders and bracers, designed for mobility and defense.\u003cbr\u003e- Details:\u003cbr\u003e    \u003cbr\u003e    - A sash or belt with a lotus motif, denoting rank.\u003cbr\u003e    - Masks for combat troops, styled after serene and neutral faces, emphasizing their role as impartial protectors.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Mistress Akira Meiyu\u003cbr\u003e- Armor\u003cbr\u003e- Strength\u003cbr\u003e- Stonewarden Garon\u003cbr\u003e- Wisdom\u003cbr\u003e- Grandmaster Iroh Tanaka\u003cbr\u003e- The Lotus\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eFirebending\u003cbr\u003eWaterbending","","Marjorie TBA","","\u00a71 This is all fun and games.\u003cbr\u003e\t\u00a71.1 For many people (including the author :D) a big part of the fun is the improv theater roleplaying in TTRPGs. \u003cbr\u003e\tSome people like the Characterbuilding and creating a personality and fleshed out character how they imagine it. Both are valid but it needs to be communicated that i want to keep it generally in a very \"yes and...\" kind of style but always accept a \"no id rather have it like...\".\u003cbr\u003e\t\t1.1.1 That being said this also applies to world building and lore so feel free to worldbuild yourself a bit either spontanously during roleplay or planned out for bigger worldbuilding projects (e.g. \"I had an idea for a watertribe that uses plantbending algae as boats for their lake\"(and discussed with the GM)).\u003cbr\u003e\u003cbr\u003e\u00a72 I will try my best to nerve and buff bending moves how i think fits best. \u003cbr\u003e\t2.1 This may also include giving them more roleplaying opportunities to find bending teachers or similar to acquire new skills and bending Moves.\u003cbr\u003e\u003cbr\u003e\u00a73 I'm trying some more experimental mechanics that may be fun for me but not so fun for others. So always accept constructive feedback and","Defensive:\u003cbr\u003e\tMostly like DnD but Armor class is now called evasion and there is an Armor  for every kind of Damage (Damage Resistance) that reduces the damage taken per instance.\u003cbr\u003e\tThe Damage types will be the same as in Dnd\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Armor","How hard it is to hit you. \u003cbr\u003eBase Evasion: 10 + Dex","Collectionfile \u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eConditions to Join:\u003cbr\u003e\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an Ice Wall from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \u003cbr\u003e    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Teamwork Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e","","Glacial Temple\u003cbr\u003e\u003cbr\u003ePurpose: Spiritual sanctuary and waterbender training ground  \u003cbr\u003eArchitecture: A glimmering structure partially embedded in ice, with prayer flags fluttering around open, steam-warmed courtyards.\u003cbr\u003e\u003cbr\u003eLore:  \u003cbr\u003eBuilt above the Healing Spring of Akara, the Glacial Temple is both a spiritual hub and defensive bastion. It\u2019s home to the Order of the Veiled Mist, a sect of waterbenders trained in Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fCantrips\u002fMistbending \u2014 a sacred technique taught only to those deemed spiritually attuned by the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eAccess to the temple is restricted. Pilgrims may offer prayers at the base, but only those with permission from the High Acolyte may enter the inner sanctum or take water directly from the spring.\u003cbr\u003e\u003cbr\u003eTemple Customs:\u003cbr\u003e\u003cbr\u003e- No artificial fire within the inner sanctum.\u003cbr\u003e    \u003cbr\u003e- Offerings must include a piece of handwoven fabric dipped in the spring.\u003cbr\u003e    \u003cbr\u003e- All initiates take a vow of vapor \u2014 a month-long silence.","Properties:  \u003cbr\u003eThe water is infused with natural and spiritual properties, accelerating healing, soothing pain, and purging spiritual corruption. However, overuse or removal of too much water causes the spring to become turbulent and the Jellytee Spirit to grow agitated.\u003cbr\u003e\u003cbr\u003eLimits:\u003cbr\u003e\u003cbr\u003e- Only a limited volume can be extracted per day.\u003cbr\u003e    \u003cbr\u003e- Excessive exposure can dull pain but doesn\u2019t cure deeper ailments unless sanctioned by the temple.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---","Form: A luminescent, ethereal fusion of jellyfish and manatee. It drifts through the spring, emitting soft pulses of bioluminescence and humming vibrations.  \u003cbr\u003eNature: Benevolent but sensitive to imbalance and greed. When pleased, it radiates a mist that calms the mind and heals minor ailments. When disturbed, the mist becomes turbulent and can induce hallucinations or intense emotional episodes.\u003cbr\u003e\u003cbr\u003eVery emotionally unstable and the waterbenders have to be super careful not to disturb the water as the manatee starts to cry and throw a tantrum when they do.\u003cbr\u003e\u003cbr\u003e---","Location: Southern Water Tribe tundra, near the Glacial Temple  \u003cbr\u003ePopulation: 150 permanent residents, swelling with visitors year-round  \u003cbr\u003eNotable Feature: The Healing Spring of Akara, which emits a continuous healing mist due to the presence of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003eDescription:  \u003cbr\u003eAkara is a quiet, snow-dusted village nestled against a glacial ridge. Built in concentric circles around the Healing Spring of Akara, the town's layout reflects the cultural importance of balance and flow. Small wooden homes carved with oceanic motifs cluster closer to the spring, with larger communal and guest housing further out.\u003cbr\u003e\u003cbr\u003eThe village has become a sacred pilgrimage site for the chronically ill, terminally afflicted, and spirit-touched. While the Healing Spring of Akara's waters are said to be miraculous, the villagers are extremely cautious in how much water they allow to be drawn, in reverence to the Jellytee Spirit.\u003cbr\u003e\u003cbr\u003eKey NPCs:\u003cbr\u003e\u003cbr\u003e- High Acolyte Siva: Stoic leader of the temple, acts as intermediary between villagers and the Jellytee Spirit.\u003cbr\u003e    \u003cbr\u003e- Healer Rokan: Master of the Players Part\u002fRules\u002fBending Rules\u002fWater\u002fWaterbending Moves\u002fCantrips\u002fMistbending technique, teaches selected apprentices.\u003cbr\u003e    \u003cbr\u003e- Elder Tumaq: Village elder, keeper of oral history and taboos.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWould you like to expand this into a quest hook, adventure arc, or introduce tensions like outsiders exploiting the spring?\u003cbr\u003e\u003cbr\u003eYou said:\u003cbr\u003e\u003cbr\u003egreat now also add a little monplogue of the jellytee spirit. It is super whinie and moody and cries when water gets removed\u003cbr\u003e\u003cbr\u003eChatGPT said:\u003cbr\u003e\u003cbr\u003ePerfect! Here\u2019s a whimsical and moody monologue from the Jellytee Spirit, capturing its overly emotional, whiny personality. This could be delivered during a vision in the mist or heard echoing through the spring when someone tries to take more than their share of water:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMonologue of the Jellytee Spirit\u003cbr\u003e\u003cbr\u003e\u003e The mist thickens. Light pulses softly from below the water. A voice, melodious yet dripping with exaggerated sorrow, rings out through the temple\u2019s chamber...\u003cbr\u003e\u003cbr\u003e\"Oooohhh noooo... not agaaaain... why must you always take? I just got the spring balanced. My nerves\u2014my poor, fluttery nerves! You don\u2019t understand how hard it is to keep the mist pretty and shimmery when you\u2019re all down here sloshing and scooping like hungry pelicans!\"\u003cbr\u003e\u003cbr\u003e\"Do you know what it\u2019s like to live in a sacred spring? It\u2019s cold, it's bright, and people are always touching stuff. I\u2014we\u2014me! I need peace! And you\u2014you greedy water-sucking little surface-crawlers\u2014never think about me!\"\u003cbr\u003e\u003cbr\u003e(sniffs dramatically, bubble trails forming in the water)\u003cbr\u003e\u003cbr\u003e\"Fine. Take a few drops, go ahead. It\u2019s not like I matter. Just the ancient sacred spirit who lives in this place. That\u2019s fine. That\u2019s totally fine.\"\u003cbr\u003e\u003cbr\u003e(beat)\u003cbr\u003e\u003cbr\u003e\"...But if you take more than one flask I will emotionally devastate you.\"","","Type: Water Tribe Island Village  \u003cbr\u003eLocation: Remote island far from the Northern Water Tribe ice shelves  \u003cbr\u003eAffinity: Waterbending, Spirits\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eOverview\u003cbr\u003e\u003cbr\u003eKugluktup is a secretive and remote waterbending village located on a rugged island surrounded by turbulent seas. It lies several days' journey south of the Northern Water Tribe's territories. Due to its isolation and history of raids by pirates and foreign explorers, the villagers are notoriously wary and openly hostile to outsiders. Their waterbending traditions have diverged significantly from the mainstream Northern Tribe practices, adapting to a more self-sufficient, ocean-based survival.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eUnique Features\u003cbr\u003e\u003cbr\u003eOceanwater Desalination Technique\u003cbr\u003e\u003cbr\u003eKugluktup's greatest innovation is their sacred Desalination Ritual, used to convert seawater into fresh water. This process is spiritual as much as it is practical and is central to village survival. It involves collaboration with the village's guardian spirit, the Eelstar.\u003cbr\u003e\u003cbr\u003eThe Eelstar\u003cbr\u003e\u003cbr\u003eA hybrid spirit beast, the Eelstar resembles five long eels fused at the tail to form a living starfish-like body. It is an ancient spirit bound to the island, often dwelling in underwater caverns accessible only through intricate coral tunnels.\u003cbr\u003e\u003cbr\u003e- Elemental Power: Uniquely, the Eelstar can breathe fire (a rare trait among ocean spirits), which it uses to heat seawater to boiling during the desalination ceremony. Waterbenders then condense and harvest the purified steam into fresh water.\u003cbr\u003e    \u003cbr\u003e- Temperament: Benevolent but alien in its thinking, the Eelstar respects tradition and punishes disrespect. It chooses one acolyte per generation to serve as its interpreter and medium: the Boilkeeper.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCulture\u003cbr\u003e\u003cbr\u003e- Isolationist Ethos: Kugluktup culture is insular. Children are taught caution and mistrust of outsiders from birth. Stories of invaders stealing knowledge or corrupting the Eelstar are retold often.\u003cbr\u003e    \u003cbr\u003e- Spiritual Bond: The villagers see themselves as stewards of both the sea and the Eelstar. Every household contributes to tending coral beds, cleaning beaches, and preserving balance with the spirit.\u003cbr\u003e    \u003cbr\u003e- Tattoos of the Tides: Adult waterbenders earn blue-green tattoos patterned after ocean currents. Each wave line signifies a milestone in mastery of their local bending techniques.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWaterbending Style\u003cbr\u003e\u003cbr\u003eKugluktup's bending style is:\u003cbr\u003e\u003cbr\u003e- Flowing and Sudden: Movements mimic sudden waves, surges, and sharp contractions like jellyfish pulses.\u003cbr\u003e    \u003cbr\u003e- Saltwater Versatility: Benders here specialize in manipulating saltwater directly, with subtle techniques to shift salinity and temperature. Many learn to pull fog from the sea for concealment.\u003cbr\u003e    \u003cbr\u003e- Condensation Arts: A unique branch of waterbending that involves evaporating and condensing water in minute amounts, especially during the desalination rituals.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eKey Figures\u003cbr\u003e\u003cbr\u003eNaqqi the Boilkeeper\u003cbr\u003e\u003cbr\u003e- Role: Spiritual leader and medium for the Eelstar\u003cbr\u003e    \u003cbr\u003e- Traits: Stern, enigmatic, speaks rarely and often in parables\u003cbr\u003e    \u003cbr\u003e- Skills: Master of condensation arts, communicates directly with the spirit in dreams and trance\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eTuliq the Tideguard\u003cbr\u003e\u003cbr\u003e- Role: Military captain and protector of the shores\u003cbr\u003e    \u003cbr\u003e- Traits: Fierce, pragmatic, believes in pre-emptive defense\u003cbr\u003e    \u003cbr\u003e- Skills: Skilled warrior and waterbender with techniques that use high-pressure saltwater jets\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003ePana the Listener\u003cbr\u003e\u003cbr\u003e- Role: One of the few curious about the outside world\u003cbr\u003e    \u003cbr\u003e- Traits: Quiet, observant, secretly collects maps and foreign items\u003cbr\u003e    \u003cbr\u003e- Potential Hook: Might secretly assist travelers if convinced they mean no harm\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAdventure Hooks\u003cbr\u003e\u003cbr\u003e- A drought weakens the Eelstar, and Kugluktup's hostility intensifies. The players must convince the villagers to let them help.\u003cbr\u003e    \u003cbr\u003e- A rogue spirit has infected one of the Eel limbs, twisting it into an aggressive form. The Boilkeeper calls for aid.\u003cbr\u003e    \u003cbr\u003e- Pirates are seeking the secret of the Desalination Ritual. The players must decide whether to defend Kugluktup or broker peace.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eLinks\u003cbr\u003e\u003cbr\u003e- Waterbending\u003cbr\u003e    \u003cbr\u003e- Spirits\u003cbr\u003e    \u003cbr\u003e- Eelstar","","The shimmering goldfish poop, once dismissed, is now reacting \u2014 humming faintly, vibrating when close to sacred texts or old chanting bowls in the temple. A monk, once skeptical, nervously confesses:\u003cbr\u003e\u003cbr\u003e\u003e \"There was\u2026 someone who always believed. The High Priest. Master Anzu.  \u003cbr\u003e\u003e He was banished to the temple archives after\u2026 well, too many sermons about invisible fish.\"\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfdb\ufe0f Act I: Finding Master Anzu\u003cbr\u003e\u003cbr\u003eThe party must explore the forbidden lower sanctum of the temple \u2014 a quiet, echoing archive of moldy scrolls, broken water clocks, and fish-shaped relics. Deep within, they find Master Anzu:\u003cbr\u003e\u003cbr\u003e- A thin, ancient man with big watery eyes, speaking in half-poetry and full riddles\u003cbr\u003e    \u003cbr\u003e- Surrounded by aquariums full of no fish \u2014 only reflections and bubbles\u003cbr\u003e    \u003cbr\u003e- He talks to the goldfish regularly, but admits \u201cShe\u2019s shy. She only appears when you aren\u2019t looking.\u201d\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdd Act II: The Limerick\u003cbr\u003e\u003cbr\u003eAmong the scrolls, Anzu recites an ancient limerick he once found inscribed on a scale made of gold-leafed spiritglass:\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc The Goldfish Limerick\u003cbr\u003e\u003cbr\u003e\u003e In stillest of ponds where no ripples are seen,  \u003cbr\u003e\u003e She darts through the veil where no spirit has been.  \u003cbr\u003e\u003e She poops like a comet, unseen in her wake,  \u003cbr\u003e\u003e And sleeps in the world where dreams do not break.  \u003cbr\u003e\u003e To find her, dear seeker, don't look but just feel\u2014  \u003cbr\u003e\u003e For goldfish are truth, and their silence is real.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Interpretation (What Anzu Knows)\u003cbr\u003e\u003cbr\u003e- The Goldfish fazes between the Spirit World and the Material based on emotional triggers \u2014 fear, serenity, hunger, embarrassment.\u003cbr\u003e    \u003cbr\u003e- She is drawn to stillness, reflection, and honest curiosity.\u003cbr\u003e    \u003cbr\u003e- Her poop only appears when she phases improperly \u2014 a symptom of imbalance between the realms.\u003cbr\u003e    \u003cbr\u003e- She once had a mirror-lake shrine, far from the temple, where the veil was thin and she could swim freely.\u003cbr\u003e    \u003cbr\u003e- Anzu believes the party can recreate the conditions to lure her back temporarily.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc3e Next Steps \u002f Quest Objectives\u003cbr\u003e\u003cbr\u003e1. Recreate the Still Pond:\u003cbr\u003e    \u003cbr\u003e    - Find or build a water basin with perfect stillness (no wind, noise, light)\u003cbr\u003e        \u003cbr\u003e    - Must be placed in a high-spirit resonance area (Anzu knows of one \u2014 the Mirror Hollow)\u003cbr\u003e        \u003cbr\u003e2. Use the Poop (yes, really):\u003cbr\u003e    \u003cbr\u003e    - The poop fragment is a spiritual scent marker \u2014 burn it as incense during the ritual to open the veil\u003cbr\u003e        \u003cbr\u003e3. Avoid looking directly at the fish \u2014 this causes her to retreat. Players must instead perceive her via reflections, ripples, or through mirrors held backwards.\u003cbr\u003e    \u003cbr\u003e4. If successful, the fish may:\u003cbr\u003e    \u003cbr\u003e    - Grant a blessing (invisibility, silent movement, spirit-sight)\u003cbr\u003e        \u003cbr\u003e    - Reveal the location of a hidden artifact (maybe another Resonance Stone?)\u003cbr\u003e        \u003cbr\u003e    - Simply leave behind another poop\u2026 but now it\u2019s glowing with spiritual energy and can be used to track spirit movements like a compass\u003cbr\u003e    - \u003cbr\u003e\ud83d\udc1f Still Ear, Truth Clear\u003cbr\u003e\u003cbr\u003eAdvanced Spiritual Airbending Technique  \u003cbr\u003ePrerequisite: Training in Airbending (even basic level), spiritual sensitivity, and a connection to the Invisible Goldfish Spirit  \u003cbr\u003eLearned from: Master Anzu\u2019s teachings and meditation upon the Limerick\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u2728 Description:\u003cbr\u003e\u003cbr\u003eBy entering a state of deep meditation and tuning out all worldly sound, the Goldfish Priest reaches a state of resonant stillness. In this space, she poses questions not with voice, but with thoughts shaped like ripples \u2014 gentle vibrations of intent across the boundary between worlds.\u003cbr\u003e\u003cbr\u003eIn response, the Invisible Goldfish Spirit answers not with words, but with the presence or absence of a single \"blub\" in the ear of the priest. No one else can hear it.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\uddd8\u200d\u2640\ufe0f Mechanics:\u003cbr\u003e\u003cbr\u003eAction Type: Special Ritual Action (requires 1 uninterrupted minute of focus)\u003cbr\u003e\u003cbr\u003eCheck: Roll a Religion (or Spirit) check, DC = 12 + number of times used today\u003cbr\u003e\u003cbr\u003e- You may only ask 1 question per successful check\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eRules for Questions:\u003cbr\u003e\u003cbr\u003e- Must be phrased in a Yes\u002fNo format\u003cbr\u003e    \u003cbr\u003e- Must be genuinely introspective or spiritually oriented (not \"What\u2019s 2+2?\")\u003cbr\u003e    \u003cbr\u003e- The answer comes as a sensation, not a sound:\u003cbr\u003e    \u003cbr\u003e    - No Blub = YES\u003cbr\u003e        \u003cbr\u003e    - Blub = NO\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e\u003e (The GM determines the answer truthfully, according to what the goldfish would know spiritually.)\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf00 Enhancements \u002f Level Ups\u003cbr\u003e\u003cbr\u003eAs the Goldfish Priest deepens their connection, the ability can evolve:\u003cbr\u003e\u003cbr\u003e\ud83c\udf2c\ufe0f Level 2 \u2013 Ripple Reading\u003cbr\u003e\u003cbr\u003eOn a successful check, the priest can ask 2 yes\u002fno questions in a single ritual.\u003cbr\u003e\u003cbr\u003e\ud83c\udf0a Level 3 \u2013 Spirit Echo Clarity\u003cbr\u003e\u003cbr\u003eOnce per day, the priest can automatically succeed on the check and get a brief vision or emotional impression along with the blub\u002fno-blub (GM\u2019s choice).\u003cbr\u003e\u003cbr\u003e\ud83c\udf90 Level 4 \u2013 Silent Chorus\u003cbr\u003e\u003cbr\u003eWhile meditating in a naturally silent location (e.g. Mirror Hollow), the priest can allow one other person to share the ritual and ask a question as well \u2014 but only the priest will \u201chear\u201d the answer.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udde9 Narrative Uses:\u003cbr\u003e\u003cbr\u003e- Discover hidden spiritual truths (\"Is there a spirit watching us?\")\u003cbr\u003e    \u003cbr\u003e- Test moral\u002fspiritual judgments (\"Did we choose the right path?\")\u003cbr\u003e    \u003cbr\u003e- Detect lies from other spirit beings (\"Is this spirit telling the truth?\")\u003cbr\u003e    \u003cbr\u003e- Feel for portals, veils, or corrupted energies (\"Is the balance broken here?\")\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #1 \u2013 \u201cThe Golden Scent\u201d\u003cbr\u003e\u003cbr\u003e\u003e A shimmer, a scent in the air,  \u003cbr\u003e\u003e From a gift left behind with great care.  \u003cbr\u003e\u003e Though humble its form,  \u003cbr\u003e\u003e It shifts spirit and norm,  \u003cbr\u003e\u003e And opens the veil with a prayer.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #2 \u2013 \u201cBlaze of the Blub\u201d\u003cbr\u003e\u003cbr\u003e\u003e When silence and stillness align,  \u003cbr\u003e\u003e And poop becomes truly divine,  \u003cbr\u003e\u003e Then burneth the gold,  \u003cbr\u003e\u003e For the pathways unfold,  \u003cbr\u003e\u003e And spirit and seeker entwine.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #3 \u2013 \u201cBurn, O Holy Pellet\u201d\u003cbr\u003e\u003cbr\u003e\u003e Burn, O holy pellet so faint,  \u003cbr\u003e\u003e Though most would dismiss with complaint,  \u003cbr\u003e\u003e It draws back the tide,  \u003cbr\u003e\u003e Where the shy fish doth hide,  \u003cbr\u003e\u003e In places the bold dare not paint.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udcdc Limerick #4 \u2013 \u201cThe Temple Fume\u201d\u003cbr\u003e\u003cbr\u003e\u003e When the fish leaves a mark on the floor,  \u003cbr\u003e\u003e Do not clean \u2014 it\u2019s a key to the door.  \u003cbr\u003e\u003e Light incense with care,  \u003cbr\u003e\u003e Let the spirit draw near,  \u003cbr\u003e\u003e And you'll swim where the world touches more.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udfad Usage in Game:\u003cbr\u003e\u003cbr\u003e- These can be used as ritual verses the character must recite while performing the incense ceremony.\u003cbr\u003e    \u003cbr\u003e- Master Anzu may only remember part of the limerick, and the players must recover missing lines.\u003cbr\u003e    \u003cbr\u003e- One limerick might be written in the margins of a water-damaged scroll, adding to the mystery.\u003cbr\u003e\u003cbr\u003eScene: before sunrise, smoky ruins of a cactus juice distillery. \u003cbr\u003e\u003cbr\u003eThe air is thick with dew, ash, and just a hint of fermented regret. Master Anzu, eyes wide and glistening, kneels over charred stone, holding up a soot-smudged scroll as the sunrise reflects in his watery eyes.\u003cbr\u003e\"...Do you smell that? Not the smoke. Not the fermented sin still clinging to the sand.  \u003cbr\u003eNo... it's the scent of secrets.  \u003cbr\u003e(he raises the scroll gently, reverently)  \u003cbr\u003eBuried beneath a vat of distilled foolishness... lay the truth.\u003cbr\u003e\u003cbr\u003e(clears throat)  \u003cbr\u003e'When the moon reflects with no moon to see,  \u003cbr\u003eAnd silence moves where sound should be,  \u003cbr\u003eThe swimmer glides in sacred hush\u2014  \u003cbr\u003eA ripple born from temple\u2019s blush.'\u003cbr\u003e\u003cbr\u003e(he pauses, the scroll trembles in his hands)  \u003cbr\u003eIt speaks of her. The One Between Currents.  \u003cbr\u003eNot just fable, not just fish.  \u003cbr\u003eThis text\u2014this... Scripture of the Silted Gills\u2014it was lost when the archives collapsed in the Flood of Tea. They said it was nonsense. Poetry.\u003cbr\u003e\u003cbr\u003eBut now\u2026 NOW\u2026!  \u003cbr\u003eBy the blessed bladder of the Desert Carp!  \u003cbr\u003eThis explosion\u2014this blessed, bubbling, bone-shaking boom\u2014has unearthed what no scholar would dare admit:\u003cbr\u003e\u003cbr\u003eThe goldfish was never gone. She was only waiting... for the distillery to ignite.\u003cbr\u003e\u003cbr\u003e(he looks around dramatically)  \u003cbr\u003eCall it fate. Call it fermentation.  \u003cbr\u003eBut this\u2026 this is providence.\"","","\ud83c\udf49Glassfruit Watermelonsteamer\u003cbr\u003eMust be innitiated by a Earth or Waterbender and needs at least one level from each Elements Level. You can use Levels from up to two different Elements. \u003cbr\u003e\u003cbr\u003e\u003e A watermelon seed that needs to be watered to grow into a sphere of X meter radius that pushes everyone away and creates a Heavy sphere with X(Earthebending slot count double) Hitpoints. The watermelon is then quickly heated and the steam cooled down to heal every creature in a 5  X Meters cone from the watermelon with the steam 3  X Hitpoints \u003cbr\u003e- Effects: \u003cbr\u003e- Wall : \u003cbr\u003e\t- X(Earthebending slot count double) Hitpoints\u003cbr\u003e- Healing\u003cbr\u003e\t- 5  X Meters cone from the watermelon\u003cbr\u003e\t- 2  X(Water Counts double) Hitpoints Healing\u003cbr\u003e\t-\u003cbr\u003e\ud83c\udf4b Sunburst Nectarfield (Lemonseed)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Fire or Water. Requires at least one Level from Fire and Air.  \u003cbr\u003eYou may use Levels from up to two Elements. Fire counts double.\u003cbr\u003e\u003cbr\u003e\u003e A lemon-shaped crystal is launched skyward, where it refracts the sunlight into a radiant bloom before one side sprays out hot liquid glassand one side shines a cleansing light. After a delay of 1 round, it explodes in midair with a flash that burns spirits and cleanses mortal ailments.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Flashburst AoE\u003cbr\u003e    \u003cbr\u003e    - All enemies within X \u00d7 4 meters radius must succeed on INT Save (DC = 10 + X)\u003cbr\u003e        \u003cbr\u003e    - On fail: Blinded (1 round) + take Xd8 radiant damage\u003cbr\u003e        \u003cbr\u003e    - On success: Half damage, no blind\u003cbr\u003e        \u003cbr\u003e- Healing Burst (Allies only)\u003cbr\u003e    \u003cbr\u003e    - All allies in X \u00d7 5 meters are cured of one condition (blinded, frightened, charmed, etc.)\u003cbr\u003e        \u003cbr\u003e- X = Fire Slot \u00d7 Air Slot\u003cbr\u003e    \u003cbr\u003e    - Fire counts double\u003cbr\u003e        \u003cbr\u003e    - Max slots: 6 from Fire (counted as 12), 3 from Air\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf47 Cactusfruit  Bulb (Brambleseed)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Earth or Fire. Requires at least one Level from Earth and Fire.  \u003cbr\u003eYou may use Levels from up to two Elements, but Earth counts double.\u003cbr\u003e\u003cbr\u003e\u003e A Cactusfruit-shaped glassfruit seed is planted in the ground and rapidly grows into a colossal crystalline maze that coils and shifts like a sentient trap.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Create a Trap: \u003cbr\u003e    \u003cbr\u003e    - Radius: X \u00d7 2 meters\u003cbr\u003e        \u003cbr\u003e    - Duration: X rounds\u003cbr\u003e        \u003cbr\u003e    - Any enemy who enters or exits takes Xd6 slashing damage A the \u003cbr\u003e        \u003cbr\u003e    - Moving inside costs double movement\u003cbr\u003e        \u003cbr\u003e- Binding Roots:\u003cbr\u003e    \u003cbr\u003e    - 1 enemy of choice each round must succeed STR Save (DC = 10 + X) or be restrained by vine-arms from the wall\u003cbr\u003e        \u003cbr\u003e- X = Earth Slot \u00d7 Water Slot\u003cbr\u003e    \u003cbr\u003e    - Earth counts double\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd2e Prism Bloom Reflection Field (Clear Soulseed + Flashcore)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Air or Firebender. Requires at least one Level from Spirit and Fire.  \u003cbr\u003eYou may use Levels from up to two Elements, but Spirit counts double.\u003cbr\u003e\u003cbr\u003e\u003e A flower of soul-glass blooms and begins refracting incoming energy \u2014 redirecting harmful bending and reflecting light into a calming aura.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Mirror Ward (Ward HP = X \u00d7 8)\u003cbr\u003e    \u003cbr\u003e    - All elemental attacks against allies within X \u00d7 3 meters are redirected to the prism instead of their original target\u003cbr\u003e        \u003cbr\u003e    - Prism absorbs the damage until depleted\u003cbr\u003e        \u003cbr\u003e- Reflection Surge (1\u002fshort rest)\u003cbr\u003e    \u003cbr\u003e    - When Prism Bloom is destroyed, it releases a cone of refracted energy\u003cbr\u003e        \u003cbr\u003e    - All enemies in a 6 \u00d7 X meter cone take Xd10 radiant or bending-type damage, matching the last element absorbed\u003cbr\u003e        \u003cbr\u003e- X = Spirit Slot \u00d7 Fire or Air Slot\u003cbr\u003e    \u003cbr\u003e    - Spirit counts double\u003cbr\u003e        \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83c\udf49 Watermelon Bastion Bomb (Updated Version)\u003cbr\u003e\u003cbr\u003eMust be initiated by an Earth or Waterbender. Needs at least one Level from each.  \u003cbr\u003eYou may use Levels from up to two Elements.\u003cbr\u003e\u003cbr\u003e- Earth counts double for the wall HP\u003cbr\u003e    \u003cbr\u003e- Water counts double for the healing effect\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEffects:\u003cbr\u003e\u003cbr\u003e- Push Sphere:\u003cbr\u003e    \u003cbr\u003e    - Grows into a crystal watermelon with a radius of X meters\u003cbr\u003e        \u003cbr\u003e    - All creatures within range must succeed on STR Save (DC = 10 + X) or be pushed back X meters\u003cbr\u003e        \u003cbr\u003e- Bastion Wall:\u003cbr\u003e    \u003cbr\u003e    - Leaves behind a hard shell with X \u00d7 2 (Earth Slots double) Hitpoints\u003cbr\u003e        \u003cbr\u003e- Healing Steam:\u003cbr\u003e    \u003cbr\u003e    - After heating and cooling, a cone of 5 \u00d7 X meters heals all allies for 3 \u00d7 X (Water Slots double) HP\u003cbr\u003e        \u003cbr\u003e- X = Earth Slot \u00d7 Water Slot\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83e\udeb7 Want more?\u003cbr\u003e\u003cbr\u003eWould you like 1-2 more \u201cepic\u201d tier moves using triple-element requirements (e.g. Fire + Water + Air) or spiritual terrain effects next? I can also create a visual reference card or turn these into [[Glassfruit High Techniques for your Obsidian campaign folder.","Location: Glassline canyon near Omashu\u2019s lower shell district \u2013 jagged cliffs, semi-wild Glassfruit groves, and an unstable spiritual resonance.\u003cbr\u003e\u003cbr\u003eSituation:  \u003cbr\u003eThe party seeks access to the Heart of Clarity (the ancient Resonance Stone), but they\u2019re intercepted by a Glassfang Vanguard Cell \u2014 loyal to the stone and sworn to protect it from those deemed \u201cunworthy\u201d or \u201cdisruptive.\u201d\u003cbr\u003e\u003cbr\u003eThe Glassfang benders are trained in Glassfruit Team-Up Techniques and immediately unleash synchronized bending using harvested seeds and sacred resonance tones.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udc65 Encounter Composition\u003cbr\u003e\u003cbr\u003e\ud83e\uddf1 Baezu \u2013 Earthbender (Initiator for Glassfruit seeds)\u003cbr\u003e\u003cbr\u003e- Tactical leader, chants in low harmonic tones\u003cbr\u003e    \u003cbr\u003e- Carries a pouch of clear Soulseeds\u003cbr\u003e    \u003cbr\u003e- Triggers Soulseed Harmonic Seal for massive battlefield control\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\ud83d\udd25 Siroh \u2013 Firebender (Initiator for Inferno Bloom & FlashLemon)\u003cbr\u003e\u003cbr\u003e- Aggressive and flashy, uses rapid Firebending katas\u003cbr\u003e    \u003cbr\u003e- Wears a red Gl
