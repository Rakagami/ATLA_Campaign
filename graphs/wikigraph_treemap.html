xterity saving throws or take 4d6 fire damage.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eVolcanic Eruption\u003cbr\u003efirebending #level5\u003cbr\u003e- Volcanic Eruption\u003cbr\u003e  - Action: 1 Action.\u003cbr\u003e  - Range: 40  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: 6d10 fire.\u003cbr\u003e  - Create a massive eruption of molten rock and fire at a target point, affecting all creatures in a 30-foot radius.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eStress Management Moves\u003cbr\u003efirebending #stressmanagement\u003cbr\u003e- Level 1: Cool Down\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Reduce stress points by 2.\u003cbr\u003e  - Focus your inner fire to calm your mind and regain clarity.\u003cbr\u003e- Level 3: Rage Fuel (Secret Technique)\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Transform your stress penalty into a bonus. For every stress point, gain a +1 to accuracy and damage rolls for the duration. At the end of the effect, stress resets to 0.\u003cbr\u003e  - Unleash the power of your rage, turning your inner turmoil into devastating strength.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAgni Kai Style\u003cbr\u003efirebending #style #agnikai\u003cbr\u003e- Duels emphasize precision and dominance.\u003cbr\u003e- Move: Burning Duel\u003cbr\u003e  - Action: Choose a single target and engage them in a duel. Both you and the target gain +2 to attack rolls against each other until one is incapacitated.\u003cbr\u003e  - Lingering Effect: The ground around you is superheated; creatures entering the area take 1d6 fire damage.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eDancing Dragon Style\u003cbr\u003efirebending #style #dancingdragon\u003cbr\u003e- Focuses on fluid, continuous motion.\u003cbr\u003e- Move: Spiral Flames\u003cbr\u003e  - Action: Spin and release flames in a 360-degree arc. Creatures within 10 feet must make a Dexterity saving throw or take 2d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area smolders, imposing disadvantage on Dexterity saving throws for creatures within it until the start of your next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eExplosive Firebending\u003cbr\u003efirebending #style #explosive\u003cbr\u003e- Focuses on powerful area-of-effect attacks.\u003cbr\u003e- Move: Fireburst\u003cbr\u003e  - Action: Target a point within 30 feet. All creatures in a 10-foot radius must make a Dexterity saving throw or take 3d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area burns for 2 rounds, dealing 1d4 fire damage to creatures starting their turn there.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eLightning Generation\u003cbr\u003efirebending #style #lightning\u003cbr\u003e- Rare skill requiring intense focus.\u003cbr\u003e- Move: Lightning Strike\u003cbr\u003e  - Action: Spend 2 turns charging and unleash a precise bolt of lightning. One target within 60 feet must make a Constitution saving throw or take 4d10 lightning damage. On a successful save, they take half damage.\u003cbr\u003e  - Lingering Effect: None, but the charge must be used within the next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 3\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIcecubes (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 3m\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Creating Mist:\u003cbr\u003e- Cost: 1 Water Charge per 10 ft radius .\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 10 ft radius centered on self.\u003cbr\u003e    - Will grow 10 feet per round until full sized\u003cbr\u003e    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (10 feeet radius per Turn) or blown await by air.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eShape Water (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Range: 30 ft.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an Int ability check.\u003cbr\u003eLinks:\u003cbr\u003e- Shape Water\u003cbr\u003e- Rules\u003cbr\u003e- Int\u003cbr\u003e- Waterbending Moves\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCyclic Flow\u003cbr\u003eLevel 1\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable.\u003cbr\u003e    - Healing: 2d8 per charge + Int modifier at the beginning of your next Turn.\u003cbr\u003e    - Limitations: Cannot heal constructs or undead.\u003cbr\u003eCyclic Flow\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Range: 3  Water Charges meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender shoots a sharp, pressurized stream of water at a target.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: Water Charges d8 piercing or Water Charges d6 bludgeoning damage per Charge.\u003cbr\u003e    \u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Piercing Water\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eSlicing Water (1st Level Move)\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft cone.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender unleashes a slicing wave of water in a cone, dealing damage to multiple targets.\u003cbr\u003e    - Saving Throw: Targets make a Dexterity save (DC = 8 + Proficiency + Int mod).\u003cbr\u003e    - Damage: 1d6 slashing damage on a failed save, half on success.\u003cbr\u003eLinks:\u003cbr\u003e- Rules\u003cbr\u003e- Slicing Water\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWater Whip (Level 1 Ability)\u003cbr\u003e- Cost: 1 Water Charge.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Action: 1 Action.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender lashes out with a tendril of water, striking a target within range.\u003cbr\u003e    - Attack Roll: Intelligence + Proficiency Bonus.\u003cbr\u003e    - Damage: 1d8 + Int modifier bludgeoning damage.\u003cbr\u003e    - Special: The target must succeed on a Strength saving throw (DC 10 + Int modifier + Proficiency) or be knocked back 10 feet.\u003cbr\u003e    \u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Water Whip\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIce Daggers (2nd Level Move)\u003cbr\u003e- Cost: 1-2CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates sharp daggers of ice to hurl at targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency\u003cbr\u003e- Damage: 1d8 + Int modifier piercing damage per dagger (can create up to 2CL daggers).\u003cbr\u003eLinks:\u003cbr\u003e- CL\u003cbr\u003e- Proficiency\u003cbr\u003e- Ice Daggers\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWall of Water (2nd Level Move)\u003cbr\u003e- Cost: 3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a wall of water up to 30 ft long, 10 ft high, and 1 ft thick.\u003cbr\u003e    - Duration: Concentration, up to 1 minute.\u003cbr\u003e    - Effect: Provides partial cover and can extinguish flames.\u003cbr\u003eLinks:\u003cbr\u003e- Wall of water\u003cbr\u003eTags:\u003cbr\u003eWaterbendingx \u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWater Tentacles (2nd Level Move)\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender summons two water tentacles to attack or grapple targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: 1d10 bludgeoning damage per tentacle.\u003cbr\u003e    - Grapple: A creature hit by the tentacle must succeed on a Strength saving throw or be restrained.\u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Water Tentacles\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIce Wall (3rd Level Move)\u003cbr\u003e- Cost: 4 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a solid wall of ice, up to 30ft long 10 ft tall and 10 ft wide.\u003cbr\u003e    - HP: 30 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003eLinks:\u003cbr\u003e- Ice Wall\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 3- 2  CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 5 Meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    You create A number of Icicles equal to the used charges.\u003cbr\u003e\tThey swirl around the Target and grants them the Reaction to send any or all of the Ammunition against one target within 100 Meters of them until all Icicles are used.\u003cbr\u003e\tAmmunition:\u003cbr\u003e    - HP: 20 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Damage 5d12 + Int Piercing Damage\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eShockfreeze (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: The same as the Waterbending used as Action f\u003cbr\u003e- Effect:  \u003cbr\u003e    After using an Action to use a Waterbending Move that consumes water charges you can use your Bonus Action to let every creature hit by your Action roll a Strength Saving throw against your Waterbending DC or become Immobilised. \u003cbr\u003eLinks:\u003cbr\u003e- Shockfreeze\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eImmobilisation \u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eThe creature can not move or be moved by force. Depending what causes Immobilisation you can save against it as an Action or can remove it with your bending more efficiently.\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eA slowed creatures Movement Speed is halved and it can not use any #Bonusactions or #reactions. ( #Action is allowed)\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 2+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Effect:  \u003cbr\u003e    A Flick to the forehead to disrupt focus. Deals EPd4 + Dexterity and the target makes concentraion saves with disadvantage until the end of your next turn.\u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 3+ EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex + Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    A precise strike that deals no damage but if hit the Target must succeed a DC 10+Proficiency+EP Con Save or be Paralysed until the end of your next Turn. \u003cbr\u003e    - Duration: 1 turn.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 4 EP.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: Melee.\u003cbr\u003e- Attack: Dex+Proficiency\u003cbr\u003e- Effect:  \u003cbr\u003e    Deliver a powerful blow that if hit restores 6 EP. The Target must succeed on a DC 10 + Proficiency + EP Con Save or become Slowed.\u003cbr\u003e    - Duration: 2 turns.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCollectionfile \u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e---\u003cbr\u003eConditions to Join:\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e---\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e---\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e- A Mud Wall created by an Earthbender could be reinforced with an Ice Wall from a Waterbender, resulting in a sturdier barrier with sharp ice spike defenses.  \u003cbr\u003e    This opens opportunities for creative problem-solving and innovative combinations, adding depth to gameplay.\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Teamwork Moves --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e  .\u002f\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWiki_File_System_Manager.py\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","wikigraph_treemap.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eFlying Lemur Form\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 6 (-2)\u003cbr\u003eDexterity (DEX) | 24(+7)\u003cbr\u003eConstitution (CON) | 7 (-2)\u003cbr\u003eWisdom(WIS) | 14(+2)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e- Size: Small\u003cbr\u003e    \u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable).\u003cbr\u003e    - Climb 20 m (adapted to vertical movement).\u003cbr\u003e- Abilities in Flying Lemur Form:\u003cbr\u003e    - Silent Glide: Advantage on Stealth checks while flying.\u003cbr\u003e    - Acute Senses: Advantage on Perception checks that rely on sight or hearing.\u003cbr\u003e    - Quick Escape: Disengage or dash as a Bonus Action.\u003cbr\u003e- Combat Stats (Flying Lemur):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 20\u003cbr\u003e    - HP: 6 (fragile but evasive).\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Razor Claws: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 slashing damage.\u003cbr\u003e- Uses:  \u003cbr\u003e    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\u003cbr\u003eBending Slots:\u003cbr\u003e\tAir Lvl1: 4\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- Size: Small\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 4 (-3)\u003cbr\u003eDexterity (DEX) | 16 (+3)\u003cbr\u003eConstitution (CON) | 12 (+1)\u003cbr\u003eWisdom(WIS) | 10(+0)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eMovement:\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest): As a Bonus Action, Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e- Pulse of Dazzling Light (3\u002frest): Emit a flash in a 10 m radius. Creatures must succeed on a DC (8 + Wisdom + Proficiency) Constitution saving throw or be blinded until the end of their next turn. Allies who avert their gaze are unaffected.\u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eCombat Stats:\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAttacks:\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 psychic damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Dex+Proficiency to hit, 1d6 radiant damage. On hit, target must make a DC (8 + Dex + Proficiency) Wisdom saving throw or have disadvantage on Perception checks for 1 minute.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e---\u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eMovement\u003cbr\u003eLevel 1\u003cbr\u003e- Range: Self.\u003cbr\u003e- Duration: 1 Turn.\u003cbr\u003e- Enhance agility by propelling yourself with gusts of air.\u003cbr\u003eEffects:\u003cbr\u003e- Spend 1 Airbending Slot to add 5  Airbending Slot meters to your movement for this turn.\u003cbr\u003eTags:\u003cbr\u003eAirbending #Mobility\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eLevel 3\u003cbr\u003eConcentration\u003cbr\u003e- Range: 2  Airbending Slot Meter radius centered on yourself that moves with you.\u003cbr\u003e- Duration: Until the start of your next Turn.\u003cbr\u003e- Create a rotating shield of air to protect yourself or allies.\u003cbr\u003eEffects:\u003cbr\u003e- Spend  Airbending Slot. to create a protective barrier of swirling air.\u003cbr\u003e- The shield grants 5  Airbending Slot Evasion to all creatures within Range.\u003cbr\u003eLingering Effect:  All Ranged Attacks that enter or exit the are made with Disadvantage.\u003cbr\u003eEvasion\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBonus Action\u003cbr\u003eCantrip\ ed.\u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eCombat Stats:\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAttacks:\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 psychic damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Dex+Proficiency to hit, 1d6 radiant damage. On hit, target must make a DC (8 + Dex + Proficiency) Wisdom saving throw or have disadvantage on Perception checks for 1 minute.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e---\u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eRange: 3  Airbending Slot meters\u003cbr\u003eEffect:\u003cbr\u003eArea control technique that lets you push 2  Airbending Slot Creatures within a radius 1  Airbending Slot meters.\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: 5  Airbending Slot meters.\u003cbr\u003e- Duration: Instantaneous.\u003cbr\u003e- Damage: 1d6 bludgeoning per Airbending Slot.\u003cbr\u003e- Attack Roll: Dex + Proficiency.\u003cbr\u003e- Use airbending to send a blade of Air hurling at a creature within range\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eLevel 1\u003cbr\u003e- Range: self and every creature within Earthbending Slot 1 Meters of you\u003cbr\u003e- Effect:  \u003cbr\u003e\t- Root yourself and every creature to resist forced movement.\u003cbr\u003e\t- Duration: 1 round.\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003eLevel 2\u003cbr\u003e- Action: 1 #Reaction.\u003cbr\u003e- Range: 2 Earthbending Slot Meters\u003cbr\u003e- Duration: 1 round.\u003cbr\u003e- Summon a vortex of gravel  barrier that grants 10 Earthbending Slot Barrier Armor until the start of your next turn.\u003cbr\u003e- Target Earthbending Slot \u002f 3  Creatures \u003cbr\u003e-\u003cbr\u003e \u003cbr\u003eEffect: \u003cbr\u003eProvides 10  Earthbending Slot temporary Physical Armor.\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Stone Shield\u003cbr\u003e- Earthbending Slot\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eStone Shield\u003cbr\u003eLevel 2\u003cbr\u003e- Action: 1 #Reaction.\u003cbr\u003e- Range: 2 Earthbending Slot Meters\u003cbr\u003e- Duration: 1 round.\u003cbr\u003e- Target Earthbending Slot \u002f 2  Creatures \u003cbr\u003eEffect:\u003cbr\u003eProvides 10  Earthbending Slot temporary  Physical Armor until the start of your next turn. \u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Stone Shield\u003cbr\u003e- Earthbending Slot\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eGlassfruit Team-Up Techniques \u003cbr\u003eX = yz\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e \u003cbr\u003e\u003e - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e\u003e     \u003cbr\u003e\u003e - Firebender contributes 3 (z = 3)\u003cbr\u003e\u003e     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e---\u003cbr\u003e\ud83d\udd34 Inferno Bloom (Red Flamegrape)\u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003e A cluster of buried Flame-glass shards detonates in a chain Reaction.\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e- Radius: 2  meter  X\u003cbr\u003e    \u003cbr\u003e- Lingering Effect\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udca8Resonant Collapse (Blue Soundbanana)\u003cbr\u003eMust be initiated by a Airbender in line of sight \u003cbr\u003e\u003e A soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e- Effect: Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e    \u003cbr\u003e- Secondary: Earth terrain in the zone becomes difficult terrain\u003cbr\u003e    \u003cbr\u003e- Radius:  2X meter\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 12, causes localized landslide or ceiling collapse in enclosed space\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Clear out guards, knock down spirit constructs\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udd35 BlueBerry Glass Surge\u003cbr\u003eMust be initiated by a Waterbender in line of sight\u003cbr\u003e\u003e  Stick and grow trapping enemies and reshaping the terrain.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Dex save to jump aside or  get Immobilised in cold soft and barely liquid Glass.\u003cbr\u003e    \u003cbr\u003e- Radius: X  2\u003cbr\u003e    \u003cbr\u003e- Duration:  X minutes but trapped creatures can as an Action make a strength saving throws to break out with the same DC - Rounds since getting trapped\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 8, brambles regenerate once if destroyed\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Reshape battlefield, trap beasts or enemy squads\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\ud83d\udfe1 FlashLemon Refractor Beam \u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003e Focused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003eRange:  10  X meter cone\u003cbr\u003e- Bonus: Deal Xd8 radiant damage to one target hit directly\u003cbr\u003e    \u003cbr\u003e- Lasting Effect: All affected enemies suffer disadvantage on perception for 4 turns\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 10, the Focused damage is doubled \u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003e\u26aa Soulseed Harmonic Seal (Clear Soulseed)\u003cbr\u003eMust be initiated by another Earthbender in line of sight\u003cbr\u003e\u003e A ritual resonance of GlassSeeds pressed on the Ground around the earthbenders \u003cbr\u003e   Concentration for both\u003cbr\u003e- Effect: As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e- Radius: within line of sight up to 100 meter\u003cbr\u003e    \u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 15, the seal becomes permanent unless shattered by spiritual corruption\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Close spirit portals, bind corrupted spirits, defend a holy site\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCantrip Firebending Moves\u003cbr\u003efirebending #moves\u003cbr\u003e- Fire Blast\u003cbr\u003e- Flame Shield\u003cbr\u003e  - Reaction: Create a shield of fire, granting 2 Evasion against a single attack. If the attack is melee and misses, the attacker takes 1d8 fire damage.\u003cbr\u003e- Ignite Terrain\u003cbr\u003e  - Action: Set fire to a 1 meter radius sphere area of terrain within 20 feet. The fire lasts 3 rounds and deals 1d6 fire damage to creatures entering or starting their turn in the area.\u003cbr\u003e- Intimidating Flame\u003cbr\u003e  - Bonus Action: Manipulate your fire to intimidate nearby creatures. Targets within 2 Meter must make a Wisdom saving throw or become frightened until the end of your next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003e- Range: 5  Waterbending Levelmeter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can attempt to freeze a creature that has been hit by a Move using Water Charges. It has to succeed a Strength Saving throw against your Waterbending DC or become Immobilised.\u003cbr\u003eLinks:\u003cbr\u003e- Waterbending Level\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 3- 2  CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 5 Meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    You create A number of Icicles equal to the used charges.\u003cbr\u003e\tThey swirl around the Target and grants them the Reaction to send any or all of the Ammunition against one target within 100 Meters of them until all Icicles are used.\u003cbr\u003e\tAmmunition:\u003cbr\u003e    - HP: 20 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Damage 5d12 + Int Piercing Damage\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eOverview:\u003cbr\u003eWaterbenders are versatile combatants who manipulate water, ice, and mist with fluid, adaptive techniques. Unlike other benders, they rely on a resource called Water Charges to perform bending abilities. Their style focuses on redirection, control, and adaptability, drawing power from their environment.\u003cbr\u003e---\u003cbr\u003eCore Mechanics:\u003cbr\u003e1. Redirection Mechanic:\u003cbr\u003eWaterbenders excel at using their enemies\u2019 attacks against them. This mechanic reflects their unique style.\u003cbr\u003eAs a Reaction when hit by ranged physical attack.\u003cbr\u003e- Counter-Redirect physical:\u003cbr\u003e    - Cost: 1 Water Charge per 1d10 Damage redirected.\u003cbr\u003e    - When targeted by a ranged physical attack, the Waterbender can redirect it back to the attacker or a different target. This attack has the same range as the initial attack. If you reduce the damage you take to 0 you get back all used Watercharges.\u003cbr\u003e    - Redirected attacks deal half damage.\u003cbr\u003eAs a Reaction when hit by a physical melee attack\u003cbr\u003e- Parry:\u003cbr\u003e    - Cost: 1 Water Charge per 1d6 Damage parried.\u003cbr\u003e    - Reduce incoming physical melee damage by 1d6 + Dexterity modifier.\u003cbr\u003e    \u003cbr\u003eAs a Reaction when hit by a Waterbending Attack\u003cbr\u003e-Counter Waterbending\u003cbr\u003e    - Cost: None.\u003cbr\u003e    - When targeted by a Waterbending attack, you can use their own Waterbending to reduce the Damage by 1d10 per Character Level.\u003cbr\u003e    - If the Damage is reduced to 0 you can use one of your own Waterbending attacks with the same (or less) Watercharges cost.\u003cbr\u003e\t\u003cbr\u003e---\u003cbr\u003eMud bending costs more charges as it is harder to bend than pure water. (1.5)\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 1+ EP.\u003cbr\u003e- Type:  Reaction.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Effect:  \u003cbr\u003e    Jump by EP  2 Meter. Allows you to dodge bending attacks with ease.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 5 EP.\u003cbr\u003e- Type: Reaction.\u003cbr\u003e- Range: The original attacks range.\u003cbr\u003e- Effect:  \u003cbr\u003e    When in Melee range to an enemy performing a Bending Move. If they fail a DC 10+Proficiency+EP Dex Save you can redirect the opponent's bending energy back at them using the same bending Move. If they succeed by more than 5 they additionally get to use their Move.\u003cbr\u003e    If you steal a Move that requires concentration it is automatically broken instantly.\u003cbr\u003e    - Duration: Instant.\u003cbr\u003eTags:\u003cbr\u003eChiBlocking\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCollectionfile \u003cbr\u003ePROBABLY NEEDS REBALANCING ON THE GO ALL THE TIME\u003cbr\u003eJoining Moves:  \u003cbr\u003eBenders can combine their abilities to create more powerful or creative effects, guided by the \"rule of cool.\" This allows for dynamic and collaborative gameplay that rewards teamwork.\u003cbr\u003e---\u003cbr\u003eConditions to Join:\u003cbr\u003e- Proximity: You must be within 10 feet of the ally initiating the Move.\u003cbr\u003e- Action Type: Joining the Move requires using your Reaction.\u003cbr\u003e- Move Compatibility: The same Move does not need to be performed at the same Level Slot as the initiating Bender.\u003cbr\u003e---\u003cbr\u003eEffect:  \u003cbr\u003eCombining Moves enhances their overall power or effect. For example, if an ally uses Fireburst, and you join in, the resulting effect could be strong enough to burst through a stone wall.\u003cbr\u003e---\u003cbr\u003eOptional Variant:  \u003cbr\u003eYou can also combine different Moves if you can explain how they interact. For instance:\u003cbr\u003e- A Mud Wall created by an E ic Eruption\u003cbr\u003efirebending #level5\u003cbr\u003e- Volcanic Eruption\u003cbr\u003e  - Action: 1 Action.\u003cbr\u003e  - Range: 40  Firebending Slot meters.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Damage: 6d10 fire.\u003cbr\u003e  - Create a massive eruption of molten rock and fire at a target point, affecting all creatures in a 30-foot radius.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCore Attributes of Firebending\u003cbr\u003efirebending #coreattributes\u003cbr\u003e- Primary Stat: Wisdom\u003cbr\u003e  - Firebenders rely on their inner focus, discipline, and clarity to control their flames.\u003cbr\u003e- Key Mechanic: Lingering Damage\u003cbr\u003e  - Firebenders create residual damage zones where their fire strikes, representing burning or smoldering terrain.\u003cbr\u003e- Stress Level: Firebenders gain a stress level counter, starting at 0. Stress increases by 1 each time the firebender is hit by an attack. If the stress level exceeds 5, the firebender suffers a -2 penalty to accuracy rolls. At high levels, stress can be managed or turned into a weapon.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eFirebending Slots Progression Table\u003cbr\u003eLevel | Accessible Slots | Total Moves (Newly Learned)\u003cbr\u003e1 | Level 1 | 1 Slot from Level 1\u003cbr\u003e2 | Level 1 | 2 Slots from Level 1\u003cbr\u003e3 | Level 1, Level 2 | 4 Slots (3 from Level 1, 1 from Level 2)\u003cbr\u003e4 | Level 1, Level 2 | 6 Slots (4 from Level 1, 2 from Level 2)\u003cbr\u003e5 | Level 1, Level 2, Level 3 | 9 Slots (5 from Level 1, 3 from Level 2, 1 from Level 3)\u003cbr\u003e6 | Level 1, Level 2, Level 3 | 12 Slots (6 from Level 1, 4 from Level 2, 2 from Level 3)\u003cbr\u003e7 | Level 1, Level 2, Level 3, Level 4 | 16 Slots (7 from Level 1, 5 from Level 2, 3 from Level 3, 1 from Level 4)\u003cbr\u003e8 | Level 1, Level 2, Level 3, Level 4 | 20 Slots (8 from Level 1, 6 from Level 2, 4 from Level 3, 2 from Level 4)\u003cbr\u003e9 | Level 1, Level 2, Level 3, Level 4, Level 5 | 25 Slots (9 from Level 1, 7 from Level 2, 5 from Level 3, 3 from Level 4, 1 from Level 5)\u003cbr\u003e10 | Level 1, Level 2, Level 3, Level 4, Level 5 | 30 Slots (10 from Level 1, 8 from Level 2, 6 from Level 3, 4 from Level 4, 2 from Level 5)\u003cbr\u003e11 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6 | 36 Slots (11 from Level 1, 9 from Level 2, 7 from Level 3, 5 from Level 4, 3 from Level 5, 1 from Level 6)\u003cbr\u003e12 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6 | 42 Slots (12 from Level 1, 10 from Level 2, 8 from Level 3, 6 from Level 4, 4 from Level 5, 2 from Level 6)\u003cbr\u003e13 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7 | 49 Slots (13 from Level 1, 11 from Level 2, 9 from Level 3, 7 from Level 4, 5 from Level 5, 3 from Level 6, 1 from Level 7)\u003cbr\u003e14 | Level 1, Level 2, Level 3, Level 4, Level 5, Level 6, Level 7 | 56 Slots (14 from Level 1, 12 from Level 2, 10 from Level 3, 8 from Level 4, 6 from Level 5, 4 from Level 6, 2 from Level 7)\u003cbr\u003e15 | Level 1 - Level 8 | 64 Slots (15 from Level 1, 13 from Level 2, 11 from Level 3, 9 from Level 4, 7 from Level 5, 5 from Level 6, 3 from Level 7, 1 from Level 8)\u003cbr\u003e16 | Level 1 - Level 8 | 72 Slots (16 from Level 1, 14 from Level 2, 12 from Level 3, 10 from Level 4, 8 from Level 5, 6 from Level 6, 4 from Level 7, 2 from Level 8)\u003cbr\u003e17 | Level 1 - Level 9 | 81 Slots (17 from Level 1, 15 from Level 2, 13 from Level 3, 11 from Level 4, 9 from Level 5, 7 from Level 6, 5 from Level 7, 3 from Level 8, 1 from Level 9)\u003cbr\u003e18 | Level 1 - Level 9 | 90 Slots (18 from Level 1, 16 from Level 2, 14 from Level 3, 12 from Level 4, 10 from Level 5, 8 from Level 6, 6 from Level 7, 4 from Level 8, 2 from Level 9)\u003cbr\u003e19 | Level 1 - Level 9 | 99 Slots (19 from Level 1, 17 from Level 2, 15 from Level 3, 13 from Level 4, 11 from Level 5, 9 from Level 6, 7 from Level 7, 5 from Level 8, 3 from Level 9)\u003cbr\u003e20 | Level 1 - Level 9 | 108 Slots (20 from Level 1, 18 from Level 2, 16 from Level 3, 14 from Level 4, 12 from Level 5, 10 from Level 6, 8 from Level 7, 6 from Level 8, 4 from Level 9)\u003cbr\u003e---\u003cbr\u003eExplanation:\u003cbr\u003e1. Slots Increase Each Level: As characters level up, they gain slots to learn new moves, and the distribution of slots ensures steady growth and access to higher-level moves.\u003cbr\u003e2. Balanced Progression: Players gain slots evenly while progressively unlocking new levels at Levels 3, 5, 7, 9, 11, 13, 15, and 17.\u003cbr\u003eTags:\u003cbr\u003eFirebending\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Stress Level: Firebenders gain a stress level counter, starting at 0. Stress increases by 1 each time the firebender is hit by an attack. For every Stress Level the Firebender suffers -1 to attack Rolls but +1 to any damage. At high levels, stress can be managed or turned into a weapon. At the End of each of your Turn you can roll a Wisdom DC 20 - Stress Level. If successful the Stresslevel goes Down by 1. \u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eStress Management Moves\u003cbr\u003efirebending #stressmanagement\u003cbr\u003e- Level 1: Cool Down\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: Instantaneous.\u003cbr\u003e  - Reduce stress points by 2.\u003cbr\u003e  - Focus your inner fire to calm your mind and regain clarity.\u003cbr\u003e- Level 3: Rage Fuel (Secret Technique)\u003cbr\u003e  - Action: Bonus Action.\u003cbr\u003e  - Range: Self.\u003cbr\u003e  - Duration: 3 rounds.\u003cbr\u003e  - Transform your stress penalty into a bonus. For every stress point, gain a +1 to accuracy and damage rolls for the duration. At the end of the effect, stress resets to 0.\u003cbr\u003e  - Unleash the power of your rage, turning your inner turmoil into devastating strength.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAgni Kai Style\u003cbr\u003efirebending #style #agnikai\u003cbr\u003e- Duels emphasize precision and dominance.\u003cbr\u003e- Move: Burning Duel\u003cbr\u003e  - Action: Choose a single target and engage them in a duel. Both you and the target gain +2 to attack rolls against each other until one is incapacitated.\u003cbr\u003e  - Lingering Effect: The ground around you is superheated; creatures entering the area take 1d6 fire damage.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eClassic Firebending\u003cbr\u003efirebending #style #classic\u003cbr\u003e- Focuses on powerful, straightforward attacks.\u003cbr\u003e- Move: Flame Jet\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eDancing Dragon Style\u003cbr\u003efirebending #style #dancingdragon\u003cbr\u003e- Focuses on fluid, continuous motion.\u003cbr\u003e- Move: Spiral Flames\u003cbr\u003e  - Action: Spin and release flames in a 360-degree arc. Creatures within 10 feet must make a Dexterity saving throw or take 2d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area smolders, imposing disadvantage on Dexterity saving throws for creatures within it until the start of your next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eExplosive Firebending\u003cbr\u003efirebending #style #explosive\u003cbr\u003e- Focuses on powerful area-of-effect attacks.\u003cbr\u003e- Move: Fireburst\u003cbr\u003e  - Action: Target a point within 30 feet. All creatures in a 10-foot radius must make a Dexterity saving throw or take 3d6 fire damage.\u003cbr\u003e  - Lingering Effect: The area burns for 2 rounds, dealing 1d4 fire damage to creatures starting their turn there.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eLightning Generation\u003cbr\u003efirebending #style #lightning\u003cbr\u003e- Rare skill requiring intense focus.\u003cbr\u003e- Move: Lightning Strike\u003cbr\u003e  - Action: Spend 2 turns charging and unleash a precise bolt of lightning. One target within 60 feet must make a Constitution saving throw or take 4d10 lightning damage. On a successful save, they take half damage.\u003cbr\u003e  - Lingering Effect: None, but the charge must be used within the next turn.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 3\u003cbr\u003e  - Range: 3  Firebending Slot meters.\u003cbr\u003e  - Duration: 2 rounds Concentration.\u003cbr\u003e  - Create a mirage of heat, imposing disadvantage on attack rolls against creatures within a 10-foot radius of a point you choose.\u003cbr\u003eFirebending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","wikigraph_treemap.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eGlassfruit Team-Up Techniques \u003cbr\u003eX = yz\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e \u003cbr\u003e\u003e - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e\u003e     \u003cbr\u003e\u003e - Firebender contributes 3 (z = 3)\u003cbr\u003e\u003e     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e---\u003cbr\u003e\ud83d\udd34 Inferno Bloom (Red Flamegrape)\u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003e A cluster of buried Flame-glass shards detonates in a chain Reaction.\u003cbr\u003e- Effect: Exp ee to get creative where to find water.:\u003cbr\u003e    \u003cbr\u003e    - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e    - Humid Area: 5-10 Water Charges.\u003cbr\u003e    - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e    - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\t    \u003cbr\u003e- Restoring Water Charges:\u003cbr\u003e    \u003cbr\u003e    - Skill Checks: A waterbender can perform a skill check to draw water from their surroundings DC is determined by how dry the area is. Success restores Water Charges, depending on the environment.\u003cbr\u003e    - Abilities: Certain abilities allow Water Charges recovery or Cyclic Flow.\u003cbr\u003e    \u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e10 + Int + Proficiency\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eYour Waterbending Level.\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: 15 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIcecubes (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 3m\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Creating Mist:\u003cbr\u003e- Cost: 1 Water Charge per 10 ft radius .\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 10 ft radius centered on self.\u003cbr\u003e    - Will grow 10 feet per round until full sized\u003cbr\u003e    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (10 feeet radius per Turn) or blown await by air.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eShape Water (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Range: 30 ft.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an Int ability check.\u003cbr\u003eLinks:\u003cbr\u003e- Shape Water\u003cbr\u003e- Rules\u003cbr\u003e- Int\u003cbr\u003e- Waterbending Moves\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCyclic Flow\u003cbr\u003eLevel 1\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable.\u003cbr\u003e    - Healing: 2d8 per charge + Int modifier at the beginning of your next Turn.\u003cbr\u003e    - Limitations: Cannot heal constructs or undead.\u003cbr\u003eCyclic Flow\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Range: 3  Water Charges meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender shoots a sharp, pressurized stream of water at a target.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: Water Charges d8 piercing or Water Charges d6 bludgeoning damage per Charge.\u003cbr\u003e    \u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Piercing Water\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eType: Waterbending spiritbending sub-skill  \u003cbr\u003eEffect:  \u003cbr\u003eThe bender draws a small amount of water and vaporizes it into a dense mist that spreads over a small to medium area. All creatures within the mist gain Fire Armour.  \u003cbr\u003eMechanics (TTRPG style):\u003cbr\u003e- Cost: 1-5 Water Charges\u003cbr\u003e    \u003cbr\u003e- Area: 1 Water Charges Meter radius \u003cbr\u003e    \u003cbr\u003e- Concentration: Water Charges Turns. Every Creature in the area has 10  Water Charges Fire Armor.\u003cbr\u003e    \u003cbr\u003e- Effect: Gradual healing, mental clarity, emotional soothing\u003cbr\u003e    \u003cbr\u003e- Interactions:\u003cbr\u003e    \u003cbr\u003e    - Can be moved by airbenders using wind techniques.\u003cbr\u003e        \u003cbr\u003e    - Can be dispersed or destroyed by strong firebending or extreme heat.\u003cbr\u003e        \u003cbr\u003e        \u003cbr\u003eAdvanced Technique (Mastery Level):\u003cbr\u003e- Cleansing Veil: Condenses the mist into a swirling cloak around allies, granting them resistance to poison, disease, or negative spiritual effects for a short duration.\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eSlicing Water (1st Level Move)\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft cone.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender unleashes a slicing wave of water in a cone, dealing damage to multiple targets.\u003cbr\u003e    - Saving Throw: Targets make a Dexterity save (DC = 8 + Proficiency + Int mod).\u003cbr\u003e    - Damage: 1d6 slashing damage on a failed save, half on success.\u003cbr\u003eLinks:\u003cbr\u003e- Rules\u003cbr\u003e- Slicing Water\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWater Whip (Level 1 Ability)\u003cbr\u003e- Cost: 1 Water Charge.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Action: 1 Action.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender lashes out with a tendril of water, striking a target within range.\u003cbr\u003e    - Attack Roll: Intelligence + Proficiency Bonus.\u003cbr\u003e    - Damage: 1d8 + Int modifier bludgeoning damage.\u003cbr\u003e    - Special: The target must succeed on a Strength saving throw (DC 10 + Int modifier + Proficiency) or be knocked back 10 feet.\u003cbr\u003e    \u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Water Whip\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eReaction\u003cbr\u003e- Range: 5  Waterbending Levelmeter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can attempt to freeze a creature that has been hit by a Move using Water Charges. It has to succeed a Strength Saving throw against your Waterbending DC or become Immobilised.\u003cbr\u003eLinks:\u003cbr\u003e- Waterbending Level\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIce Daggers (2nd Level Move)\u003cbr\u003e- Cost: 1-2CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates sharp daggers of ice to hurl at targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency\u003cbr\u003e- Damage: 1d8 + Int modifier piercing damage per dagger (can create up to 2CL daggers).\u003cbr\u003eLinks:\u003cbr\u003e- CL\u003cbr\u003e- Proficiency\u003cbr\u003e- Ice Daggers\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWall of Water (2nd Level Move)\u003cbr\u003e- Cost: 3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a wall of water up to 30 ft long, 10 ft high, and 1 ft thick.\u003cbr\u003e    - Duration: Concentration, up to 1 minute.\u003cbr\u003e    - Effect: Provides partial cover and can extinguish flames.\u003cbr\u003eLinks:\u003cbr\u003e- Wall of water\u003cbr\u003eTags:\u003cbr\u003eWaterbendingx \u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eWater Tentacles (2nd Level Move)\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender summons two water tentacles to attack or grapple targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: 1d10 bludgeoning damage per tentacle.\u003cbr\u003e    - Grapple: A creature hit by the tentacle must succeed on a Strength saving throw or be restrained.\u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Water Tentacles\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCyclic Flow\u003cbr\u003eConcentration\u003cbr\u003eLevel 3\u003cbr\u003e    \u003cbr\u003eRange: 1  Water Charges Meter radius cloud\u003cbr\u003eEffect:\u003cbr\u003e Water Charges  d8 Healing to every creature that was in the clouds radius during the Concentration\u003cbr\u003e- Interactions:\u003cbr\u003e    - Can be moved by Airbenders.\u003cbr\u003e        \u003cbr\u003e    - Can be dispersed or destroyed by strong firebending or extreme heat breaking Cyclic Flow\u003cbr\u003e        \u003cbr\u003eWaterbending\u003cbr\u003eCyclic Flow\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIce Wall (3rd Level Move)\u003cbr\u003e- Cost: 4 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a solid wall of ice, up to 30ft long 10 ft tall and 10 ft wide.\u003cbr\u003e    - HP: 30 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003eLinks:\u003cbr\u003e- Ice Wall\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: 3- 2  CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 5 Meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    You create A number of Icicles equal to the used charges.\u003cbr\u003e\tThey swirl around the Target and grants them the Reaction to send any or all of the Ammunition against one target within 100 Meters of them until all Icicles are used.\u003cbr\u003e\tAmmunition:\u003cbr\u003e    - HP: 20 HP.\u003cbr\u003e    - AC: 12.\u003cbr\u003e    - Damage 5d12 + Int Piercing Damage\u003cbr\u003e    - Duration: 1 minute.\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Passive.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender rides atop a thin sheet of water or ice, moving with increased agility.\u003cbr\u003e    - Speed Boost: Gain +30 ft movement speed.\u003cbr\u003e    - Prerequisite: Accessible at a higher level(TBA).\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eShockfreeze (Cantrip)\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: The same as the Waterbending used as Action f\u003cbr\u003e- Effect:  \u003cbr\u003e    After using an Action to use a Waterbending Move that consumes water charges you can use your Bonus Action to let every creature hit by your Action roll a Strength Saving throw against your Waterbending DC or become Immobilised. \u003cbr\u003eLinks:\u003cbr\u003e- Shockfreeze\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eImmobilisation \u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eOverview:\u003cbr\u003eWaterbenders are versatile combatants who manipulate water, ice, and mist with fluid, adaptive techniques. Unlike other benders, they rely on a resource called Water Charges to perform bending abilities. Their style focuses on redirection, control, and adaptability, drawing power from their environment.\u003cbr\u003e---\u003cbr\u003eCore Mechanics:\u003cbr\u003e1. Redirection Mechanic:\u003cbr\u003eWaterbenders excel at using their enemies\u2019 attacks against them. This mechanic reflects their unique style.\u003cbr\u003eAs a Reaction when hit by ranged physical attack.\u003cbr\u003e- Counter-Redirect physical:\u003cbr\u003e    - Cost: 1 Water Charge per 1d10 Damage redirected.\u003cbr\u003e    - When targeted by a ranged physical attack, the Waterbender can redirect it back to the attacker or a different target. This attack has the same range as the initial attack. If you reduce the damage you take to 0 you get back all used Watercharges.\u003cbr\u003e    - Redirected attacks deal half damage.\u003cbr\u003eAs a Reaction when hit by a physical melee attack\u003cbr\u003e- Parry:\u003cbr\u003e    - Cost: 1 Water Charge per 1d6 Damage parried.\u003cbr\u003e    - Reduce incoming physical melee damage by 1d6 + Dexterity modifier.\u003cbr\u003e    \u003cbr\u003eAs a Reaction when hit by a Waterbending Attack\u003cbr\u003e-Counter Waterbending\u003cbr\u003e    - Cost: None.\u003cbr\u003e    - When targeted by a Waterbending attack, you can use their own Waterbending to reduce the Damage by 1d10 per Character Level.\u003cbr\u003e    - If the Damage is reduced to 0 you can use one of your own Waterbending attacks with the same (or less) Watercharges cost.\u003cbr\u003e\t\u003cbr\u003e---\u003cbr\u003eMud bending costs more charges as it is harder to bend than pure water. (1.5)\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eHow efficiently you use your Waterbottle  that you can carry with you.\u003cbr\u003eWaterbending Level | Waterbottle Water Charges\u003cbr\u003e1-4 | 1\u003cbr\u003e5-8 | 2\u003cbr\u003e9-12 | 3\u003cbr\u003e13-16 | 4\u003cbr\u003e17-20 | 5\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","wikigraphtreemap.html\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eGlassfruit Team-Up Techniques \u003cbr\u003e\u003cbr\u003eX = yz\u003cbr\u003e\u003cbr\u003e-  are the number of bending slots contributed by each bender.\u003cbr\u003e    \u003cbr\u003e- This rewards balanced team effort over just one person dumping points.\u003cbr\u003e    \u003cbr\u003e-X = y \u00d7 z.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e\u003e Example:\u003cbr\u003e\u003e \u003cbr\u003e\u003e - Earthbender contributes 2 slots (y = 2)\u003cbr\u003e\u003e     \u003cbr\u003e\u003e - Firebender contributes 3 (z = 3)\u003cbr\u003e\u003e     \u2192 X = 2 \u00d7 3 = 6\u003cbr\u003e\u003cbr\u003eThese are powerful, multi-element, terrain-altering moves that consume Glassfruit Seeds. Each scales based on X and has different effects depending on the seed used.\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd34 Inferno Bloom (Red Flamegrape)\u003cbr\u003e\u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e A cluster of buried Flame-glass shards detonates in a chain Reaction.\u003cbr\u003e\u003cbr\u003e- Effect: Explosion in an area, dealing Xd6  bludgeoning + half fire damage\u003cbr\u003e    \u003cbr\u003e- Radius: 2  meter  X\u003cbr\u003e    \u003cbr\u003e- Lingering Effect\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udca8Resonant Collapse (Blue Soundbanana)\u003cbr\u003eMust be initiated by a Airbender in line of sight \u003cbr\u003e\u003cbr\u003e\u003e A soundblast builds from multiple frequencies and shatters the ground.\u003cbr\u003e\u003cbr\u003e- Effect: Targets in area must make CON save of X2 or take Xd8 thunder damage and fall prone\u003cbr\u003e    \u003cbr\u003e- Secondary: Earth terrain in the zone becomes difficult terrain\u003cbr\u003e    \u003cbr\u003e- Radius:  2X meter\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 12, causes localized landslide or ceiling collapse in enclosed space\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Clear out guards, knock down spirit constructs\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udd35 BlueBerry Glass Surge\u003cbr\u003eMust be initiated by a Waterbender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e  Stick and grow trapping enemies and reshaping the terrain.\u003cbr\u003e\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Dex save to jump aside or  get Immobilised in cold soft and barely liquid Glass.\u003cbr\u003e    \u003cbr\u003e- Radius: X  2\u003cbr\u003e    \u003cbr\u003e- Duration:  X minutes but trapped creatures can as an Action make a strength saving throws to break out with the same DC - Rounds since getting trapped\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 8, brambles regenerate once if destroyed\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Reshape battlefield, trap beasts or enemy squads\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\ud83d\udfe1 FlashLemon Refractor Beam \u003cbr\u003eMust be initiated by a Firebender in line of sight\u003cbr\u003e\u003cbr\u003e\u003e Focused light is amplified by mirrored shards into a blinding beam.\u003cbr\u003e- Effect: Targets in area must make  a DCX  2 Int save to shield or close their eyes or be Blinded for one turn\u003cbr\u003eRange:  10  X meter cone\u003cbr\u003e- Bonus: Deal Xd8 radiant damage to one target hit directly\u003cbr\u003e    \u003cbr\u003e- Lasting Effect: All affected enemies suffer disadvantage on perception for 4 turns\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 10, the Focused damage is doubled \u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e\u26aa Soulseed Harmonic Seal (Clear Soulseed)\u003cbr\u003eMust be initiated by another Earthbender in line of sight\u003cbr\u003e\u003e A ritual resonance of GlassSeeds pressed on the Ground around the earthbenders \u003cbr\u003e   Concentration for both\u003cbr\u003e- Effect: As the air vibrates with a cleansing energy as creatures of your choice within radius gain 10  X General Armor\u003cbr\u003e\u003cbr\u003e- Radius: within line of sight up to 100 meter\u003cbr\u003e    \u003cbr\u003e- Duration: Lasts until stopped concentrating or for 1 hour.\u003cbr\u003e    \u003cbr\u003e- Special: If X \u2265 15, the seal becomes permanent unless shattered by spiritual corruption\u003cbr\u003e    \u003cbr\u003e- Narrative Use: Close spirit portals, bind corrupted spirits, defend a holy site\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eEarthbending \u003cbr\u003eAirbending\u003cbr\u003eWaterbending\u003cbr\u003eFirebending\u003cbr\u003eTeam-up Moves\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X number of projectiles \u003cbr\u003e-  Y: Yd6 Damage per projectile\u003cbr\u003e \u003cbr\u003e- One waterbender shoots X Water Projectiles (rolls the attack role) and the other one Freezes them  rolls the damage rolls)\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eMust be initiated by at least two Waterbenders.  \u003cbr\u003eYou may use Levels from Water only.\u003cbr\u003eEach Bender-decides to which pool to add their Bending slots:\u003cbr\u003e-  X: X  10 Barrier Armor \u003cbr\u003e-  Y: Y  5 Healing at the start of their turn\u003cbr\u003e\u003cbr\u003e- Encase a willing ally in a jagged prism of glacial ice with a liquid healing core.\u003cbr\u003e    \u003cbr\u003e- The ally immediately gains the effects of Barrier Armor\u003cbr\u003e    \u003cbr\u003e- At the start of their next turn, as the ice thaws, they are healed for 2 \u00d7 Y but their movement is halved.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003eTeam-up Moves\u003cbr\u003eHealing\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCollectionfile \u003cbr\u003eIf Concentration is not broken the Water Charges are refunded.\u003cbr\u003e\u003cbr\u003eWaterbending\u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Cyclic Flow --\u003e\u003cbr\u003eBacklinks\u003cbr\u003e\u003cbr\u003e  .\u002f\u003cbr\u003e  \u251c\u2500\u2500 graphs\u003cbr\u003e      \u2514\u2500\u2500 wikigraphtreemap.html\u003cbr\u003e  \u2514\u2500\u2500 Players Part\u003cbr\u003e      \u2514\u2500\u2500 Rules\u003cbr\u003e          \u2514\u2500\u2500 Bending Rules\u003cbr\u003e              \u2514\u2500\u2500 Water\u003cbr\u003e                  \u251c\u2500\u2500 Water Charges.md\u003cbr\u003e                  \u2514\u2500\u2500 Waterbending Moves\u003cbr\u003e                      \u251c\u2500\u2500 Level 1 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Healing Water.md\u003cbr\u003e                      \u2514\u2500\u2500 Level 3 Moves\u003cbr\u003e                          \u2514\u2500\u2500 Healing Mist.md\u003cbr\u003e\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWater Charges represent the amount of water available for a water-bender to manipulate.\u003cbr\u003e\u003cbr\u003eWaterbottle Water Charges \u003cbr\u003e\u003cbr\u003e- Environmental Influence:  \u003cbr\u003e    The number of Water Charges available at the start of combat or during an encounter depends on the setting. Feel free to get creative where to find water.:\u003cbr\u003e    \u003cbr\u003e    - Desert\u002fDry Area: 0 Water Charges (minimum water source).\u003cbr\u003e    - Humid Area: 5-10 Water Charges.\u003cbr\u003e    - Near Water Source (Lake, Ocean, etc.): 15 Water Charges.\u003cbr\u003e    - In Lake, Ocean, etc.: 50+ charges\u003cbr\u003e\t    \u003cbr\u003e- Restoring Water Charges:\u003cbr\u003e    \u003cbr\u003e    - Skill Checks: A waterbender can perform a skill check to draw water from their surroundings DC is determined by how dry the area is. Success restores Water Charges, depending on the environment.\u003cbr\u003e    - Abilities: Certain abilities allow Water Charges recovery or Cyclic Flow.\u003cbr\u003e    \u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e10 + Int + Proficiency\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eYour Waterbending Level.\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Bonus Action.\u003cbr\u003e- Range: 15 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eIcecubes (Cantrip)\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 3m\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can freeze a small amount of water, such as a puddle or a drink-sized volume. The higher the Level the more water can be frozen.\u003cbr\u003e    - Duration: Permanent until thawed naturally.\u003cbr\u003e    - Uses: Create slippery surfaces, small barriers, or tools.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Icecubes\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003efreezing\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003e- Creating Mist:\u003cbr\u003e- Cost: 1 Water Charge per 10 ft radius .\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 10 ft radius centered on self.\u003cbr\u003e    - Will grow 10 feet per round until full sized\u003cbr\u003e    - Creates a heavily obscured area for concealment that can be absorbed to regain charges (10 feeet radius per Turn) or blown await by air.\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eShape Water (Cantrip)\u003cbr\u003e\u003cbr\u003e- Cost: None.\u003cbr\u003e- Range: 30 ft.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: At Will. Concentration.\u003cbr\u003e- Effect:  \u003cbr\u003e    You can manipulate a water, shaping it into simple forms, moving it, or changing its state (solid, liquid, mist) temporarily.\u003cbr\u003e    - Limitations: Cannot deal damage but can be used for utility (e.g., extinguishing flames, creating distractions). The higher your Level is the more water can be shaped. Might need an Int ability check.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Shape Water\u003cbr\u003e- Rules\u003cbr\u003e- Int\u003cbr\u003e- Waterbending Moves\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCyclic Flow\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Duration: 1 round Concentration.\u003cbr\u003e- Range: Touch (through water).\u003cbr\u003e- Effect:  \u003cbr\u003e    You channel healing energy through water, restoring health to a creature. \u003cbr\u003e\t- If the creature is unconscious the creature becomes stable.\u003cbr\u003e    - Healing: 2d8 per charge + Int modifier at the beginning of your next Turn.\u003cbr\u003e    - Limitations: Cannot heal constructs or undead.\u003cbr\u003e\u003cbr\u003eCyclic Flow\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eAction\u003cbr\u003eLevel 1\u003cbr\u003e\u003cbr\u003e- Cost: 1-3 Water Charges.\u003cbr\u003e- Range: 3  Water Charges meter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender shoots a sharp, pressurized stream of water at a target.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: Water Charges d8 piercing or Water Charges d6 bludgeoning damage per Charge.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Proficiency\u003cbr\u003e- Piercing Water\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eType: Waterbending spiritbending sub-skill  \u003cbr\u003e\u003cbr\u003eEffect:  \u003cbr\u003eThe bender draws a small amount of water and vaporizes it into a dense mist that spreads over a small to medium area. All creatures within the mist gain Fire Armour.  \u003cbr\u003e\u003cbr\u003eMechanics (TTRPG style):\u003cbr\u003e\u003cbr\u003e- Cost: 1-5 Water Charges\u003cbr\u003e    \u003cbr\u003e- Area: 1 Water Charges Meter radius \u003cbr\u003e    \u003cbr\u003e- Concentration: Water Charges Turns. Every Creature in the area has 10  Water Charges Fire Armor.\u003cbr\u003e    \u003cbr\u003e- Effect: Gradual healing, mental clarity, emotional soothing\u003cbr\u003e    \u003cbr\u003e- Interactions:\u003cbr\u003e    \u003cbr\u003e    - Can be moved by airbenders using wind techniques.\u003cbr\u003e        \u003cbr\u003e    - Can be dispersed or destroyed by strong firebending or extreme heat.\u003cbr\u003e        \u003cbr\u003e        \u003cbr\u003e\u003cbr\u003eAdvanced Technique (Mastery Level):\u003cbr\u003e\u003cbr\u003e- Cleansing Veil: Condenses the mist into a swirling cloak around allies, granting them resistance to poison, disease, or negative spiritual effects for a short duration.\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eSlicing Water (1st Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft cone.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender unleashes a slicing wave of water in a cone, dealing damage to multiple targets.\u003cbr\u003e    - Saving Throw: Targets make a Dexterity save (DC = 8 + Proficiency + Int mod).\u003cbr\u003e    - Damage: 1d6 slashing damage on a failed save, half on success.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Rules\u003cbr\u003e- Slicing Water\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWater Whip (Level 1 Ability)\u003cbr\u003e\u003cbr\u003e- Cost: 1 Water Charge.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Action: 1 Action.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender lashes out with a tendril of water, striking a target within range.\u003cbr\u003e    - Attack Roll: Intelligence + Proficiency Bonus.\u003cbr\u003e    - Damage: 1d8 + Int modifier bludgeoning damage.\u003cbr\u003e    - Special: The target must succeed on a Strength saving throw (DC 10 + Int modifier + Proficiency) or be knocked back 10 feet.\u003cbr\u003e    \u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Water Whip\u003cbr\u003e- Proficiency\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eReaction\u003cbr\u003e\u003cbr\u003e- Range: 5  Waterbending Levelmeter.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender can attempt to freeze a creature that has been hit by a Move using Water Charges. It has to succeed a Strength Saving throw against your Waterbending DC or become Immobilised.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Waterbending Level\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eIce Daggers (2nd Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 1-2CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates sharp daggers of ice to hurl at targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency\u003cbr\u003e- Damage: 1d8 + Int modifier piercing damage per dagger (can create up to 2CL daggers).\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- CL\u003cbr\u003e- Proficiency\u003cbr\u003e- Ice Daggers\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWall of Water (2nd Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 3 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 60 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates a wall of water up to 30 ft long, 10 ft high, and 1 ft thick.\u003cbr\u003e    - Duration: Concentration, up to 1 minute.\u003cbr\u003e    - Effect: Provides partial cover and can extinguish flames.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Wall of water\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbendingx \u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eWater Tentacles (2nd Level Move)\u003cbr\u003e\u003cbr\u003e- Cost: 2 Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 15 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender summons two water tentacles to attack or grapple targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency.\u003cbr\u003e    - Damage: 1d10 bludgeoning damage per tentacle.\u003cbr\u003e    - Grapple: A creature hit by the tentacle must succeed on a Strength saving throw or be restrained.\u003cbr\u003e\u003cbr\u003eLinks:\u003cbr\u003e- Strength\u003cbr\u003e- Rules\u003cbr\u003e- Waterbending Moves\u003cbr\u003e- Proficiency\u003cbr\u003e- Water Tentacles\u003cbr\u003e- Int\u003cbr\u003e\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e\u003cbr\u003eCycl
