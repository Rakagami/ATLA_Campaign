ffects.\u003cbr\u003e- Level 3: High-impact moves that exhaust opponents.","","You have your CL  2  amount of Transformation Points\u003cbr\u003etransformation\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eAction\u003cbr\u003eLevel 3 \u003cbr\u003e- Range: CL  1 meters.\u003cbr\u003e- Duration: Concentration, up to 1 Minute.\u003cbr\u003eEffects:\u003cbr\u003e- Harness precision air currents to perform subtle or delicate tasks from a distance.\u003cbr\u003e-  Manipulate a small pbject within range or make fine adjustments as if using your hands.\u003cbr\u003e- You can perform sleight-of-hand checks or disable small mechanisms remotely.\u003cbr\u003eUsage: Precision tool for intricate tasks or stealth.\u003cbr\u003eLinks:\u003cbr\u003e- Utility\u003cbr\u003eAirbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eIce Daggers (2nd Level Move)\u003cbr\u003e- Cost: 1-2CL Water Charges.\u003cbr\u003e- Type: Action.\u003cbr\u003e- Range: 20 ft.\u003cbr\u003e- Effect:  \u003cbr\u003e    The waterbender creates sharp daggers of ice to hurl at targets.\u003cbr\u003e    - Attack Roll: Int + Proficiency\u003cbr\u003e- Damage: 1d8 + Int modifier piercing damage per dagger (can create up to 2CL daggers).\u003cbr\u003eLinks:\u003cbr\u003e- CL\u003cbr\u003e- Proficiency\u003cbr\u003e- Ice Daggers\u003cbr\u003e- Int\u003cbr\u003eTags:\u003cbr\u003eWaterbending\u003cbr\u003eWaterbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eYou max Hitpoints are determined by your Level and Bending Type:\u003cbr\u003eEarth: 1d12 per CL\u003cbr\u003eWater: 1d8 per CL\u003cbr\u003eFire: 1d8 per CL\u003cbr\u003eAir: 1d6 per CL\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCollectionfile \u003cbr\u003eCLRange | Proficiency Bonus\u003cbr\u003e1-4 | 2\u003cbr\u003e5-8 | 3\u003cbr\u003e9-12 | 4\u003cbr\u003e13-16 | 5\u003cbr\u003e17-20 | 6\u003cbr\u003e | \u003cbr\u003e\u003c!-- BEGIN-AUTO-COLLECTION:Proficiency --\u003e\u003cb          \u2514\u2500\u2500 Chi Surge.md\u003cbr\u003e\u003c!-- END-AUTO-COLLECTION --\u003e\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCatapult Step\u003cbr\u003eLevel 5 Slot\u003cbr\u003e- Launch yourself or an ally up to 60ft.\u003cbr\u003e- Range: Self.\u003cbr\u003e- Duration: Instantaneous.\u003cbr\u003eUsage: Effective for repositioning or surprise attacks.\u003cbr\u003eLinks:\u003cbr\u003e- Catapult Step\u003cbr\u003eTags:\u003cbr\u003eEarthbending\u003cbr\u003eEarthbending\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---","wikigraph_treemap.html\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eCharacter Summary\u003cbr\u003eRace:  \u003cbr\u003eSpirit-turned-human\u003cbr\u003eClass:  \u003cbr\u003eAir Spirit\u003cbr\u003e---\u003cbr\u003eBackstory:  \u003cbr\u003eOnce a small spirit living among the Air Nomads, I helped them forage, offering guidance and protection in their peaceful, nature-centered life. But when the spirit doors closed, I was trapped in the Spirit World, separated from the humans I cared for.\u003cbr\u003eAfter countless years, I found a way to cross back through an abandoned Air Nomad temple. When I arrived, I was shocked to see how much the world had changed\u2014machines, bending powers, and humans who no longer lived in harmony with nature.\u003cbr\u003eConfused and fascinated, I wander this unfamiliar world, trying to understand what has happened and how I can help again.\u003cbr\u003e---\u003cbr\u003eBase Abilities (Available in all forms)\u003cbr\u003e- Spiritual Nourishment:  \u003cbr\u003e    Can create small plants or fruits that provide minor healing (1d6 + Proficiency bonus) or temporary bonuses:\u003cbr\u003e    \u003cbr\u003e    - Energizing Fruit: Grants +2 temporary HP per character level.\u003cbr\u003e    - Focus Herb: Grants Advantage on the next attack roll or saving throw.  \u003cbr\u003e        Can be used twice per long rest, with effects lasting up to 1 hour.\u003cbr\u003e- Limited Airbending:\u003cbr\u003e    \u003cbr\u003e    - Gust: Push or pull objects or creatures within a 15 ft range (similar to the gust cantrip).\u003cbr\u003e    - Air Barrier: Create a brief 5-ft circular shield of air, granting +2 AC to yourself or an ally for 1 round.\u003cbr\u003e    - Wind Aided Movement: Gain 10 extra feet of movement speed for 1 round.\u003cbr\u003e- Connection to Nature:  \u003cbr\u003e    Gains Advantage on Nature checks and can communicate simple ideas with animals or spirits.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eShapeshifting Forms\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eShapeshifting Mechanics\u003cbr\u003e- Transformations Per Long Rest:  \u003cbr\u003e     You have 2  Proficiency Transformation Points per long rest.\u003cbr\u003e    \u003cbr\u003e- Shapeshifting Cost:\u003cbr\u003e\t- Human Form: 0 Transformation Points\u003cbr\u003e    - Flying Lemur: 1 Point\u003cbr\u003e    - Bearturtle: 2 Points \u003cbr\u003e    - Luma\u2019tik 2 Transformation Points\u003cbr\u003e    -\u003cbr\u003e- Exiting the Forms:  \u003cbr\u003e    Transformations end early if the form\u2019s HP is reduced to 0 or voluntarily dropped. Remaining damage spills over to the character\u2019s normal HP. \u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eLinks:\u003cbr\u003e- Armor\u003cbr\u003e- Proficiency\u003cbr\u003e- Strength\u003cbr\u003eTags:\u003cbr\u003eAirbending #transformation\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eBearturtle.webp#### Bearturtle Form (Protection\u002fDefense Form)\u003cbr\u003e- Size: Medium\u003cbr\u003e- On Transform:\u003cbr\u003e\t- Defensive Presence: Allies within 5 meter gain +3 to their AC until you Form Drops.\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 22 (+6)\u003cbr\u003eDexterity (DEX) | 2 (-4)\u003cbr\u003eConstitution (CON) | 24 (+7)\u003cbr\u003eWisdom(WIS) | 10(+0)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003e- Movement:\u003cbr\u003e    \u003cbr\u003e    - Walk 20 meter.\u003cbr\u003e    - Swim 10 meter\u003cbr\u003e- Abilities in Bearturtle Form:\u003cbr\u003e    - Shell Shield:\u003cbr\u003e\t    - Reaction\u003cbr\u003e\t        When an ally within 3 meter is attacked, impose Disadvantage on the attack roll as you shift to protect them with your shell. Can be used a number of times equal to your Proficiency bonus per long rest.\u003cbr\u003e\t    Tuck in: \u003cbr\u003e\t    - Reaction\u003cbr\u003e\t\t    When you fail a dexterity saving throw you still only take half damage. Your Movement in the next round is halved.\u003cbr\u003e    - Sturdy Form:\u003cbr\u003e\t    - You have Advantage on saving throws against being knocked prone or moved against your will.\u003cbr\u003e    -\u003cbr\u003e    - \u003cbr\u003e- Combat Stats (Bearturtle):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 15\u003cbr\u003e    - \u003cbr\u003e    - Armor: \u003cbr\u003e\t    - 5 Physical Armor\u003cbr\u003e\t    - 3 General Armor\u003cbr\u003e    - HP: 28.\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Powerful Swipe: Melee Weapon Attack, +Strength to hit, 2d6 + Str slashing damage.\u003cbr\u003e\t- Shell Slam (AOE): All creatures within a 1 meter radius must make a Dexterity save DC17 or take 2d8 bludgeoning damage.\u003cbr\u003e    \u003cbr\u003e    \u003cbr\u003eBending Slots:\u003cbr\u003e\tFire Lvl1: 2\u003cbr\u003e\tEarth Lvl1: 1\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eFlying Lemur Form\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 6 (-2)\u003cbr\u003eDexterity (DEX) | 24(+7)\u003cbr\u003eConstitution (CON) | 7 (-2)\u003cbr\u003eWisdom(WIS) | 14(+2)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e- Size: Small\u003cbr\u003e    \u003cbr\u003e- Movement:\u003cbr\u003e    - Fly 20 m (highly maneuverable).\u003cbr\u003e    - Climb 20 m (adapted to vertical movement).\u003cbr\u003e- Abilities in Flying Lemur Form:\u003cbr\u003e    - Silent Glide: Advantage on Stealth checks while flying.\u003cbr\u003e    - Acute Senses: Advantage on Perception checks that rely on sight or hearing.\u003cbr\u003e    - Quick Escape: Disengage or dash as a Bonus Action.\u003cbr\u003e- Combat Stats (Flying Lemur):\u003cbr\u003e    \u003cbr\u003e    - Evasion: 20\u003cbr\u003e    - HP: 6 (fragile but evasive).\u003cbr\u003e    - Attacks:\u003cbr\u003e        - Razor Claws: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 slashing damage.\u003cbr\u003e- Uses:  \u003cbr\u003e    Perfect for scouting, infiltration, or swift movement through difficult terrain. The form allows quick evasion and small-scale reconnaissance.\u003cbr\u003eBending Slots:\u003cbr\u003e\tAir Lvl1: 4\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003e---\u003cbr\u003eName: Luma\u2019tik \u2014 Glimmerkin of Cracked Mirrors  \u003cbr\u003eType: Lesser Spirit  \u003cbr\u003eDomain: Light, Trickery  \u003cbr\u003eTransformation Points cost: 2 Transformation Points\u003cbr\u003e---\u003cbr\u003eLuma'tik.png\u003cbr\u003e- Size: Small\u003cbr\u003eStat | Value\u003cbr\u003eStrength (STR) | 4 (-3)\u003cbr\u003eDexterity (DEX) | 16 (+3)\u003cbr\u003eConstitution (CON) | 12 (+1)\u003cbr\u003eWisdom(WIS) | 10(+0)\u003cbr\u003eIntelligence(Int) | 8(-1)\u003cbr\u003e- Ideal for infiltration, distraction, and sensory manipulation. Luma\u2019tik thrives in urban or crystal-laced environments, using its shimmering form and illusions to mislead enemies and aid allies from the shadows. Though not powerful in direct combat, it\u2019s difficult to pin down and annoying to deal with.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eMovement:\u003cbr\u003e- Fly 15 m (hovering, effortless, emits no sound).\u003cbr\u003e    \u003cbr\u003e- Climb 10 m (can scale smooth surfaces with reflective qualities).\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAbilities in Luma\u2019tik Form:\u003cbr\u003e- Refraction Veil: While in bright or shifting light, Luma\u2019tik gains advantage on Stealth and cannot be targeted by opportunity attacks. This effect ends if Luma\u2019tik is in total darkness or complete silence.\u003cbr\u003e    \u003cbr\u003e- Mirage Flicker (1\u002fShort Rest): As a Bonus Action, Luma\u2019tik can create up to two illusionary duplicates for 1 minute. Each duplicate mimics its movements and grants attackers disadvantage on attack rolls until they hit Luma\u2019tik.\u003cbr\u003e    \u003cbr\u003e- Pulse of Dazzling Light (3\u002frest): Emit a flash in a 10 m radius. Creatures must succeed on a DC (8 + Wisdom + Proficiency) Constitution saving throw or be blinded until the end of their next turn. Allies who avert their gaze are unaffected.\u003cbr\u003e    \u003cbr\u003e- Glimmerjump: \u003cbr\u003e- Reaction:\u003cbr\u003e\tteleport to any point within 20 m that is brightly lit or reflects light (e.g., mirrors, water, crystal surfaces)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eCombat Stats:\u003cbr\u003e- Evasion: 17\u003cbr\u003e    \u003cbr\u003e- HP: 21 (fragile, relies on mobility and illusions)\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eAttacks:\u003cbr\u003e- Sparkbite: Melee Weapon Attack, Dex+Proficiency to hit, 1d4 radiant damage. If attacking from stealth, deals an extra 1d4 psychic damage.\u003cbr\u003e    \u003cbr\u003e- Lightshard Dart: Ranged Attack, Dex+Proficiency to hit, 1d6 radiant damage. On hit, target must make a DC (8 + Dex + Proficiency) Wisdom saving throw or have disadvantage on Perception checks for 1 minute.\u003cbr\u003e    \u003cbr\u003e---\u003cbr\u003eLuma\u2019tik is a playful, capricious entity\u2014often found dancing between fractured crystal surfaces or taunting intruders with flickers of light and laughter. Bonding with this spirit gives a bender or spiritualist access to stealth, misdirection, and flash-based utility, ideal for scouts or cunning tacticians.\u003cbr\u003e---\u003cbr\u003eBending Slots:\u
